<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>DEEP MINE MASTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070605;--bg-up:#0c0a08;--bg-card:#12100e;--bg-hover:#181614;--bg-active:#1e1b18;
  --border:rgba(255,255,255,.04);--border-hover:rgba(255,255,255,.1);--border-gold:rgba(201,168,76,.2);
  --text:#ece8e0;--text-sec:#9a958c;--text-tert:#5a554d;
  --gold:#c9a84c;--gold-bright:#e8c860;--gold-dim:#8a7330;--gold-glow:rgba(201,168,76,.15);
  --copper:#b87333;--silver:#a8b4be;--iron:#7a8a96;--emerald:#4a9b5e;--ruby:#b05048;
  --sapphire:#4a7fb0;--amethyst:#8b6fa0;--diamond:#6ab8c9;--mithril:#5a8a9a;--adamantite:#8a6a4a;
  --void:#6a5a8a;--divine:#c9a84c;--success:#4a9b5e;--danger:#b05048;--info:#4a7fb0;
  --ft-title:'Cinzel',serif;--ft-body:'Inter',sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:16px;
  --sh-sm:0 4px 12px rgba(0,0,0,.4);--sh-md:0 8px 24px rgba(0,0,0,.5);--sh-lg:0 16px 48px rgba(0,0,0,.6);
}
*{-webkit-tap-highlight-color:transparent;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--ft-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased;}

/* ===== LOADING ===== */
#load{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s,visibility 1s;}
#load.done{opacity:0;visibility:hidden;}
#load .lg{font-family:var(--ft-title);font-size:2.8rem;color:var(--gold);letter-spacing:.25em;font-weight:800;text-shadow:0 0 40px rgba(201,168,76,.3);animation:loadPulse 2s ease-in-out infinite;}
#load .sub{font-size:.7rem;color:var(--text-tert);letter-spacing:.4em;text-transform:uppercase;margin-top:8px;}
#load .bar{width:180px;height:2px;background:var(--bg-card);border-radius:1px;margin-top:48px;overflow:hidden;}
#load .bar::after{content:'';display:block;width:0%;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));transition:width .8s;}
#load.ready .bar::after{width:100%;}
@keyframes loadPulse{0%,100%{text-shadow:0 0 40px rgba(201,168,76,.2);}50%{text-shadow:0 0 60px rgba(201,168,76,.4);}}

/* ===== 3D PICKAXE ICONS ===== */
.pick-ico{width:40px;height:40px;position:relative;flex-shrink:0;transition:transform .3s;}
.pick-ico:hover{transform:scale(1.15) rotateY(10deg);}
.pick-ico svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));transition:filter .3s;}
.pick-ico:hover svg{filter:drop-shadow(0 0 8px currentColor);}

/* Wood Pick */
.p0 svg .head{fill:#8B6914;}
.p0 svg .handle{fill:#5C4033;}
/* Stone Pick */
.p1 svg .head{fill:#7a7a7a;}
.p1 svg .handle{fill:#5C4033;}
/* Copper Pick */
.p2 svg .head{fill:#b87333;}
.p2 svg .handle{fill:#4a3520;}
/* Iron Pick */
.p3 svg .head{fill:#8a9ba8;}
.p3 svg .handle{fill:#3a3028;}
/* Steel Pick */
.p4 svg .head{fill:#b8c4ce;}
.p4 svg .handle{fill:#2a2520;}
/* Silver Pick */
.p5 svg .head{fill:#d0d8e0;}
.p5 svg .handle{fill:#1a1814;}
/* Gold Pick */
.p6 svg .head{fill:#c9a84c;}
.p6 svg .handle{fill:#3a3020;}
/* Mithril Pick */
.p7 svg .head{fill:#4a7fb0;}
.p7 svg .handle{fill:#1a1e28;}
/* Adamantite Pick */
.p8 svg .head{fill:#5a9b6e;}
.p8 svg .handle{fill:#1a2418;}
/* Obsidian Pick */
.p9 svg .head{fill:#2a2a2a;}
.p9 svg .handle{fill:#1a1a1a;}
.p9 svg .head{stroke:#6a6a6a;stroke-width:.5;}
/* Crystal Pick */
.p10 svg .head{fill:#7ab8c9;}
.p10 svg .handle{fill:#1a2028;}
.p10 svg .head{opacity:.9;}
/* Emerald Pick */
.p11 svg .head{fill:#4a9b5e;}
.p11 svg .handle{fill:#1a2418;}
/* Diamond Pick */
.p12 svg .head{fill:#6ab8c9;}
.p12 svg .handle{fill:#1a2028;}
.p12 svg .head{stroke:#a8d8e8;stroke-width:.3;}
/* Amethyst Pick */
.p13 svg .head{fill:#8b6fa0;}
.p13 svg .handle{fill:#1a1820;}
/* Void Pick */
.p14 svg .head{fill:#6a5a8a;}
.p14 svg .handle{fill:#1a1420;}
.p14 svg .head{stroke:#9a8aba;stroke-width:.3;}
/* Soul Pick */
.p15 svg .head{fill:#8a9ba8;}
.p15 svg .handle{fill:#1a1e24;}
.p15 svg .head{opacity:.8;}
/* Star Pick */
.p16 svg .head{fill:#c9a84c;}
.p16 svg .handle{fill:#2a2010;}
.p16 svg .head{stroke:#e8d070;stroke-width:.3;}
/* Creation Pick */
.p17 svg .head{fill:#d4af37;}
.p17 svg .handle{fill:#2a2010;}
/* Divine Pick */
.p18 svg .head{fill:#c9a84c;}
.p18 svg .handle{fill:#3a2810;}
.p18 svg .head{stroke:#e8c860;stroke-width:.5;}
/* Eternal Pick */
.p19 svg .head{fill:#7ab8c9;}
.p19 svg .handle{fill:#1a2028;}
.p19 svg .head{stroke:#a8e0f0;stroke-width:.5;}
/* Abyss Pick */
.p20 svg .head{fill:#2a2a2a;}
.p20 svg .handle{fill:#1a1a1a;}
.p20 svg .head{stroke:#c9a84c;stroke-width:.8;}

/* ===== GEOMETRIC BLOCK ICONS ===== */
.block-ico{width:56px;height:56px;position:relative;flex-shrink:0;}
.block-ico svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.block-ico:hover svg{transform:scale(1.12);}

/* ===== PARTICLES ===== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;}
.part{position:absolute;border-radius:50%;pointer-events:none;}
#dmgL{position:fixed;inset:0;pointer-events:none;z-index:200;}
.dmg{position:absolute;font-weight:900;pointer-events:none;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.9);font-family:var(--ft-body);}

/* ===== LAYOUT ===== */
.app{display:flex;flex-direction:column;min-height:100vh;max-width:1440px;margin:0 auto;padding:0 24px;}
@media(max-width:600px){.app{padding:0 14px;}}

/* ===== HEADER ===== */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(7,6,5,.95);backdrop-filter:blur(16px);z-index:50;}
.hdr .brd{display:flex;align-items:center;gap:14px;}
.hdr .brd-mk{width:36px;height:36px;border:2px solid var(--gold);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 12px rgba(201,168,76,.1);}
.hdr .brd-mk::before{content:'';position:absolute;width:16px;height:16px;background:var(--gold);clip-path:polygon(50% 0%,100% 35%,100% 65%,50% 100%,0% 65%,0% 35%);}
.hdr .brd-tx{font-family:var(--ft-title);font-size:1.15rem;color:var(--gold);letter-spacing:.15em;font-weight:700;}
.hdr .sts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.st-chip{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:24px;font-size:.78rem;font-weight:600;transition:all .2s;}
.st-chip:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:var(--sh-sm);}
.st-chip .dot{width:7px;height:7px;border-radius:50%;}

/* ===== MAIN ===== */
main{flex:1;display:grid;grid-template-columns:1fr 360px;gap:28px;padding:28px 0;}
@media(max-width:1100px){main{grid-template-columns:1fr;}}

/* ===== CARD ===== */
.card{background:var(--bg-up);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s,transform .3s;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);}
.card:hover{border-color:var(--border-hover);box-shadow:var(--sh-md);}
.card.gold{border-color:var(--border-gold);box-shadow:0 0 20px rgba(201,168,76,.06);}
.card-hd{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.card-hd .c-ico{width:32px;height:32px;border-radius:var(--r-sm);background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative;}
.card-hd .c-ico svg{width:18px;height:18px;}
.card-hd .c-tl{font-family:var(--ft-title);font-size:.95rem;color:var(--gold);letter-spacing:.08em;font-weight:700;}

/* ===== MINE STAGE ===== */
.mine-st{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative;}
.mine-st::after{content:'';position:absolute;inset:0;border-radius:var(--r-lg);background:radial-gradient(ellipse at center,rgba(201,168,76,.025) 0%,transparent 70%);pointer-events:none;}

/* 3D Ring */
.ring-w{position:relative;width:280px;height:280px;perspective:800px;}
.ring-w svg{transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(201,168,76,.1));}
.ring-bg{fill:none;stroke:var(--bg-card);stroke-width:3;}
.ring-fg{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .12s linear;filter:drop-shadow(0 0 4px rgba(201,168,76,.2));}
.ring-in{position:absolute;inset:28px;border-radius:var(--r-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;background:linear-gradient(165deg,var(--bg-card),var(--bg-hover));border:1.5px solid var(--border);transition:all .1s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
.ring-in:hover{border-color:var(--border-hover);box-shadow:0 8px 32px rgba(0,0,0,.4);}
.ring-in:active{transform:scale(.95) translateZ(-10px);}
.ring-in .b-geo{width:72px;height:72px;margin-bottom:6px;}
.ring-in .b-geo svg{width:100%;height:100%;}
.ring-in .b-nm{font-size:1.05rem;font-weight:800;margin-top:6px;color:var(--text);letter-spacing:.03em;}
.ring-in .b-hp{font-size:.8rem;color:var(--text-sec);margin-top:6px;font-variant-numeric:tabular-nums;font-weight:500;}
.ring-in .b-def{position:absolute;top:12px;right:12px;font-size:.65rem;padding:3px 10px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text-sec);font-weight:600;letter-spacing:.02em;}
.ring-in .b-zone{position:absolute;top:12px;left:12px;font-size:.65rem;padding:3px 10px;background:var(--bg);border:1px solid var(--border-gold);border-radius:12px;color:var(--gold);font-weight:700;letter-spacing:.05em;}

.hp-tr{width:220px;height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px;}
.hp-fi{height:100%;border-radius:3px;transition:width .12s linear,background .3s;}

.combo-tr{width:200px;height:3px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:16px;}
.combo-fi{height:100%;background:linear-gradient(90deg,var(--copper),var(--gold),var(--gold-bright));border-radius:2px;transition:width .1s linear;}
.combo-tx{font-size:.75rem;color:var(--gold);text-align:center;margin-top:6px;font-weight:700;letter-spacing:.06em;}

.log-p{width:100%;max-width:420px;max-height:110px;overflow-y:auto;font-size:.72rem;color:var(--text-tert);display:flex;flex-direction:column;gap:4px;padding:12px 16px;background:var(--bg-card);border-radius:var(--r-md);border:1px solid var(--border);}
.log-p .ln{opacity:.85;}
.log-p .ln.g{color:var(--gold);}
.log-p .ln.gr{color:var(--emerald);}
.log-p .ln.r{color:var(--ruby);}

/* ===== TABS ===== */
.tab-b{display:flex;gap:3px;margin-bottom:16px;padding:4px;background:var(--bg-card);border-radius:var(--r-md);border:1px solid var(--border);}
.tab-bt{flex:1;padding:9px 0;border-radius:var(--r-sm);border:none;background:transparent;color:var(--text-tert);font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--ft-body);letter-spacing:.04em;}
.tab-bt:hover{color:var(--text-sec);}
.tab-bt.on{background:rgba(201,168,76,.1);color:var(--gold);box-shadow:0 2px 8px rgba(201,168,76,.08);}
.tab-p{display:none;}
.tab-p.on{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ===== ZONE GRID ===== */
.zg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
.zc{padding:16px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);text-align:center;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.zc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:transparent;transition:background .25s;}
.zc:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateY(-2px);box-shadow:var(--sh-sm);}
.zc.on{border-color:var(--border-gold);background:rgba(201,168,76,.04);}
.zc.on::before{background:var(--gold);}
.zc.lock{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
.zc .z-geo{width:24px;height:24px;margin:0 auto 8px;}
.zc .z-nm{font-size:.76rem;font-weight:700;color:var(--text);}
.zc .z-rq{font-size:.65rem;color:var(--text-tert);margin-top:3px;}

/* Block rows */
.brs{display:flex;flex-direction:column;gap:7px;margin-top:14px;}
.br{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .2s;}
.br:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateX(4px);}
.br.on{border-color:rgba(74,155,94,.35);background:rgba(74,155,94,.04);}
.br .br-geo{width:36px;height:36px;flex-shrink:0;}
.br .br-geo svg{width:100%;height:100%;}
.br .br-in{flex:1;min-width:0;}
.br .br-nm{font-size:.84rem;font-weight:700;color:var(--text);}
.br .br-st{font-size:.74rem;color:var(--text-sec);margin-top:2px;}
.br .br-dr{font-size:.68rem;color:var(--text-tert);margin-top:2px;}

/* ===== PICK LIST ===== */
.pk-l{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;}
.pk-l::-webkit-scrollbar{width:4px;}
.pk-l::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.pk-r{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .2s;position:relative;}
.pk-r:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateX(4px);box-shadow:var(--sh-sm);}
.pk-r.on{border-color:var(--border-gold);background:rgba(201,168,76,.05);}
.pk-r.lock{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.pk-r .pk-in{flex:1;min-width:0;}
.pk-r .pk-nm{font-size:.84rem;font-weight:700;color:var(--text);}
.pk-r .pk-st{font-size:.74rem;color:var(--text-sec);margin-top:1px;}
.pk-r .pk-ac{padding:6px 14px;border-radius:var(--r-sm);border:none;font-size:.74rem;font-weight:700;cursor:pointer;background:var(--gold);color:var(--bg);transition:all .15s;box-shadow:0 2px 8px rgba(201,168,76,.2);}
.pk-r .pk-ac:hover{filter:brightness(1.15);transform:translateY(-1px);}
.pk-r .pk-ac:disabled{opacity:.35;cursor:not-allowed;background:var(--bg-hover);color:var(--text-tert);box-shadow:none;transform:none;}
.pk-r .pk-tg{font-size:.65rem;padding:3px 10px;border-radius:10px;background:var(--emerald);color:#fff;font-weight:700;}

/* ===== MATERIALS ===== */
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.mc{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);transition:all .2s;}
.mc:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateY(-1px);}
.mc .mg-geo{width:30px;height:30px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);flex-shrink:0;}
.mc .mg-geo svg{width:22px;height:22px;}
.mc .mg-in{flex:1;}
.mc .mg-nm{font-size:.78rem;font-weight:600;color:var(--text);}
.mc .mg-ct{font-size:.74rem;color:var(--text-sec);font-variant-numeric:tabular-nums;}

/* ===== TALENTS ===== */
.tl-s{margin-bottom:20px;}
.tl-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tl-hd .tl-ico{width:22px;height:22px;}
.tl-hd .tl-tl{font-size:.88rem;font-weight:700;color:var(--gold);letter-spacing:.04em;}
.tl-g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.tl-n{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;transition:all .2s;position:relative;padding:6px;}
.tl-n:hover{border-color:var(--border-hover);transform:translateY(-3px);box-shadow:var(--sh-sm);}
.tl-n.on{border-color:var(--gold);background:rgba(201,168,76,.08);box-shadow:0 0 12px rgba(201,168,76,.08);}
.tl-n.mx{border-color:var(--emerald);background:rgba(74,155,94,.08);box-shadow:0 0 12px rgba(74,155,94,.08);}
.tl-n .tn-geo{width:22px;height:22px;}
.tl-n .tn-lv{font-size:.62rem;color:var(--text-tert);margin-top:3px;font-weight:600;}
.tl-n .tn-nm{font-size:.58rem;color:var(--text-tert);text-align:center;line-height:1.2;margin-top:2px;}
.tl-tt{position:absolute;bottom:calc(100%+10px);left:50%;transform:translateX(-50%);width:200px;background:var(--bg-up);border:1px solid var(--border-hover);border-radius:var(--r-md);padding:12px;font-size:.76rem;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s;box-shadow:var(--sh-lg);}
.tl-n:hover .tl-tt{opacity:1;}
.tl-tt .tt-nm{font-weight:800;color:var(--gold);margin-bottom:5px;font-size:.8rem;}
.tl-tt .tt-dc{color:var(--text-sec);margin-bottom:5px;line-height:1.5;}
.tl-tt .tt-ct{color:var(--emerald);font-weight:600;}

/* ===== CRAFTING ===== */
.cf-l{display:flex;flex-direction:column;gap:8px;}
.cf-r{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);transition:all .2s;}
.cf-r:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateY(-1px);box-shadow:var(--sh-sm);}
.cf-r .cf-geo{width:44px;height:44px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--border);flex-shrink:0;}
.cf-r .cf-in{flex:1;}
.cf-r .cf-nm{font-size:.88rem;font-weight:700;color:var(--text);}
.cf-r .cf-rq{font-size:.74rem;color:var(--text-sec);margin-top:4px;line-height:1.5;}
.cf-r .cf-bt{padding:8px 18px;border-radius:var(--r-sm);border:none;font-size:.76rem;font-weight:700;cursor:pointer;background:var(--gold);color:var(--bg);transition:all .15s;box-shadow:0 2px 8px rgba(201,168,76,.2);}
.cf-r .cf-bt:hover{filter:brightness(1.15);transform:translateY(-1px);}
.cf-r .cf-bt:disabled{opacity:.35;cursor:not-allowed;background:var(--bg-hover);color:var(--text-tert);box-shadow:none;transform:none;}

/* ===== ACHIEVEMENTS ===== */
.ach-l{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto;}
.ach-r{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);transition:all .2s;}
.ach-r.done{border-color:rgba(74,155,94,.3);background:rgba(74,155,94,.04);}
.ach-r .ach-geo{width:30px;height:30px;flex-shrink:0;}
.ach-r .ach-geo svg{width:100%;height:100%;}
.ach-r .ach-in{flex:1;}
.ach-r .ach-nm{font-size:.84rem;font-weight:700;color:var(--text);}
.ach-r .ach-dc{font-size:.74rem;color:var(--text-sec);margin-top:1px;}
.ach-r .ach-rw{font-size:.74rem;color:var(--gold);font-weight:700;}

/* ===== CHEST ===== */
.ch-st{display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px 24px;}
.ch-geo{width:80px;height:64px;position:relative;cursor:pointer;transition:transform .1s;}
.ch-geo:active{transform:scale(.92);}
.ch-geo .ch-lid{position:absolute;top:0;left:4px;right:4px;height:18px;background:var(--copper);border-radius:var(--r-sm) var(--r-sm) 0 0;border:2px solid var(--copper-dim);border-bottom:none;transition:transform .3s;transform-origin:bottom;}
.ch-geo:hover .ch-lid{transform:rotateX(-25deg);}
.ch-geo .ch-body{position:absolute;bottom:0;left:4px;right:4px;height:46px;background:var(--copper);border-radius:0 0 var(--r-sm) var(--r-sm);border:2px solid var(--copper-dim);border-top:none;box-shadow:inset 0 2px 8px rgba(0,0,0,.3);}
.ch-geo .ch-lk{position:absolute;top:50%;left:50%;transform:translate(-50%,-10%);width:14px;height:16px;background:var(--gold);border-radius:2px;box-shadow:0 0 6px rgba(201,168,76,.3);}
.ch-geo .ch-lk::before{content:'';position:absolute;top:-7px;left:3px;width:8px;height:8px;border:2px solid var(--gold);border-radius:50%;border-bottom:none;}
.ch-geo.pulse{animation:chPulse 2.5s ease-in-out infinite;}
@keyframes chPulse{0%,100%{filter:drop-shadow(0 0 0 rgba(201,168,76,0));}50%{filter:drop-shadow(0 0 16px rgba(201,168,76,.3));}}
.ch-geo.shake{animation:chShake .5s ease;}
@keyframes chShake{0%,100%{transform:rotate(0);}15%{transform:rotate(-10deg);}30%{transform:rotate(10deg);}45%{transform:rotate(-6deg);}60%{transform:rotate(6deg);}75%{transform:rotate(-3deg);}}
.ch-sts{font-size:.88rem;color:var(--text-sec);font-weight:600;}
.ch-rws{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.rw-cp{display:flex;align-items:center;gap:6px;font-size:.8rem;padding:7px 14px;background:var(--bg);border-radius:var(--r-sm);border:1px solid var(--border);font-weight:600;}

/* ===== SETTINGS ===== */
.set-r{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.set-r:last-child{border-bottom:none;}
.set-lb{font-size:.86rem;font-weight:600;color:var(--text);}
.set-dc{font-size:.72rem;color:var(--text-tert);margin-top:3px;}
.tog-tr{width:48px;height:26px;background:var(--bg-card);border:1px solid var(--border);border-radius:13px;position:relative;cursor:pointer;transition:all .3s cubic-bezier(.4,0,.2,1);}
.tog-tr.on{background:var(--emerald);border-color:var(--emerald);}
.tog-tr::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--text);border-radius:50%;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-sm);}
.tog-tr.on::after{transform:translateX(22px);background:#fff;}

.cd-r{display:flex;gap:8px;margin-bottom:14px;}
.cd-r input{flex:1;padding:11px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.84rem;outline:none;font-family:var(--ft-body);transition:border-color .2s;}
.cd-r input:focus{border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.1);}
.cd-r button{padding:11px 20px;background:var(--gold);color:var(--bg);border:none;border-radius:var(--r-md);font-weight:700;cursor:pointer;font-size:.84rem;transition:all .15s;box-shadow:0 2px 8px rgba(201,168,76,.2);}
.cd-r button:hover{filter:brightness(1.15);transform:translateY(-1px);}
.cd-ts{display:flex;flex-wrap:wrap;gap:6px;}
.cd-tg{font-size:.72rem;padding:4px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;color:var(--text-tert);font-weight:600;letter-spacing:.03em;transition:all .2s;}
.cd-tg:hover{border-color:var(--border-hover);color:var(--text-sec);}
.cd-tg.used{border-color:rgba(74,155,94,.35);color:var(--emerald);}

.sv-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.sv-c{padding:18px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-card);text-align:center;cursor:pointer;transition:all .2s;}
.sv-c:hover{border-color:var(--border-hover);background:var(--bg-hover);transform:translateY(-2px);box-shadow:var(--sh-sm);}
.sv-c.on{border-color:var(--border-gold);background:rgba(201,168,76,.06);box-shadow:0 0 12px rgba(201,168,76,.06);}
.sv-c .sv-nm{font-size:.84rem;font-weight:800;color:var(--gold);letter-spacing:.05em;}
.sv-c .sv-in{font-size:.74rem;color:var(--text-tert);margin-top:5px;}

/* ===== MODALS ===== */
.md-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:all .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(6px);}
.md-ov.on{opacity:1;visibility:visible;}
.md-bx{background:var(--bg-up);border:1px solid var(--border-hover);border-radius:var(--r-lg);padding:32px;max-width:460px;width:90%;max-height:85vh;overflow-y:auto;transform:scale(.95) translateY(10px);transition:transform .3s cubic-bezier(.4,0,.2,1);position:relative;box-shadow:var(--sh-lg);}
.md-ov.on .md-bx{transform:scale(1) translateY(0);}
.md-tl{font-family:var(--ft-title);font-size:1.2rem;color:var(--gold);margin-bottom:20px;letter-spacing:.06em;font-weight:700;}
.md-cl{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text-tert);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:all .2s;}
.md-cl:hover{color:var(--text);border-color:var(--border-hover);background:var(--bg-hover);}

/* ===== TOASTS ===== */
.ts-st{position:fixed;top:24px;right:24px;z-index:400;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.ts{padding:14px 20px;background:var(--bg-up);border:1px solid var(--border);border-radius:var(--r-md);font-size:.86rem;box-shadow:var(--sh-lg);animation:tsIn .4s cubic-bezier(.4,0,.2,1);max-width:320px;pointer-events:auto;font-weight:600;}
.ts.ok{border-color:rgba(74,155,94,.35);}
.ts.err{border-color:rgba(176,80,72,.35);}
.ts.inf{border-color:rgba(74,127,176,.35);}
@keyframes tsIn{from{opacity:0;transform:translateX(40px) scale(.95);}to{opacity:1;transform:translateX(0) scale(1);}}

/* ===== OFFLINE ===== */
.of-st{text-align:center;padding:28px 20px;}
.of-tl{font-family:var(--ft-title);font-size:1.3rem;color:var(--gold);margin-bottom:14px;letter-spacing:.06em;font-weight:700;}
.of-tm{font-size:.92rem;color:var(--text-sec);margin-bottom:22px;}
.of-it{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:28px;}
.of-itm{padding:12px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);font-size:.88rem;font-weight:600;transition:all .2s;}
.of-itm:hover{border-color:var(--border-hover);transform:translateY(-1px);}
.of-bt{padding:14px 36px;background:var(--gold);color:var(--bg);border:none;border-radius:var(--r-md);font-weight:800;cursor:pointer;font-size:.95rem;letter-spacing:.04em;transition:all .15s;box-shadow:0 4px 16px rgba(201,168,76,.25);}
.of-bt:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 6px 24px rgba(201,168,76,.35);}

/* ===== ANIMATIONS ===== */
@keyframes shk{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px)rotate(-1.5deg);}40%{transform:translateX(5px)rotate(1.5deg);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
.shk{animation:shk .25s ease;}
@keyframes flt{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.flt{animation:flt 3.5s ease-in-out infinite;}
@keyframes glw{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0);}50%{box-shadow:0 0 0 8px rgba(201,168,76,.06);}}
.glw{animation:glw 2.5s ease-in-out infinite;}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover);}

/* ===== RESPONSIVE ===== */
@media(max-width:600px){
  .hdr .brd-tx{font-size:.95rem;}

  .sv-g{grid-template-columns:1fr;}
  .mg{grid-template-columns:1fr;}
  .zg{grid-template-columns:repeat(2,1fr);}
}
</style>

<script>
// ===== PICKAXE SVG TEMPLATES =====

  const tier = PICKAXES[id].tier;

  if(tier===1) return PICK_SVG_ADV('p'+id, false);

}

// ===== COMBAT =====
function getPickDamage(){
  let base = PICKAXES[game.pickaxe].damage;
  let best = 0;
  for(const id of game.pickaxesOwned) if(PICKAXES[id].damage>best) best = PICKAXES[id].damage;
  if(best>base) base += (best-base)*0.3;
  const atk1 = game.talents.atk1||0;
  base *= (1+atk1*0.05);
  const atk5 = game.talents.atk5||0;
  base *= (1+atk5*0.15);
  return Math.floor(base);
}
function getCritChance(){return 0.05+(game.talents.atk2||0)*0.02;}
function getCritMult(){return 1.5+(game.talents.atk3||0)*0.10;}
function getIgnoreDef(){return (game.talents.atk4||0)*0.05;}
function getComboMax(){return 10+(game.talents.def4||0);}
function getComboDuration(){return 2+(game.talents.def1||0)*0.5;}
function getCoinMult(){return 1+(game.talents.eco1||0)*0.05;}
function getExpMult(){return 1+(game.talents.eco2||0)*0.05;}
function getDropMult(){return 1+(game.talents.eco3||0)*0.10;}
function getAutoSpeed(){return 1+(game.talents.sp1||0)*0.10;}
function getInstakillChance(){return (game.talents.sp5||0)*0.01;}
function getDoubleChance(){return (game.talents.sp2||0)*0.02;}
function getOfflineMult(){return 0.5+(game.talents.sp4||0)*0.10;}

// ===== BLOCK SYSTEM =====
function getCurrentBlock(){return ZONES[game.zone].blocks[game.block];}
function getBlockHp(){return getCurrentBlock().hp;}
function getBlockDef(){return getCurrentBlock().def;}
let blockCurrentHp = 0;
function initBlock(){blockCurrentHp = getBlockHp();}

function calcDamage(){
  let dmg = getPickDamage();
  const def = getBlockDef();
  const ignore = getIgnoreDef();
  let effectiveDef = def*(1-ignore);
  if(effectiveDef<0) effectiveDef=0;
  dmg = Math.max(1, dmg - effectiveDef);
  let comboMult = 1;
  if(game.combo>0){
    comboMult = 1+game.combo*0.03;
    if(comboMult>3) comboMult=3;
  }
  dmg *= comboMult;
  let isCrit = false;
  if(Math.random()<getCritChance()){isCrit=true;dmg*=getCritMult();game.critCount++;}
  if(Math.random()<getDoubleChance()){dmg*=2;}
  dmg = Math.floor(dmg);
  return {dmg,isCrit,comboMult};
}

function spawnDmgNum(x,y,dmg,isCrit){
  if(!game.showDmg) return;
  const el = document.createElement('div');
  el.className = 'dmg';
  el.textContent = dmg;
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.color = isCrit?'#ff5555':'#ece8e0';
  el.style.fontSize = isCrit?'1.4rem':'1.05rem';
  if(isCrit) el.style.textShadow = '0 0 12px rgba(255,85,85,.6)';
  $('dmgL').appendChild(el);
  let opacity=1,top=y;
  const anim = setInterval(()=>{opacity-=0.022;top-=1.3;el.style.opacity=opacity;el.style.top=top+'px';if(opacity<=0){clearInterval(anim);el.remove();}},30);
}

function spawnParticles(x,y,color){
  if(!game.showParticles) return;
  for(let i=0;i<8;i++){
    const el = document.createElement('div');
    el.className = 'part';
    const size = rand(3,9);
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.background = color||'#c9a84c';
    el.style.left = x+'px';
    el.style.top = y+'px';
    $('fx').appendChild(el);
    const angle = rand(0,Math.PI*2);
    const speed = rand(2,8);
    let vx = Math.cos(angle)*speed, vy = Math.sin(angle)*speed-3;
    let px=x,py=y,op=1;
    const anim = setInterval(()=>{px+=vx;py+=vy;vy+=0.35;op-=0.03;el.style.left=px+'px';el.style.top=py+'px';el.style.opacity=op;if(op<=0){clearInterval(anim);el.remove();}},30);
  }
}

function shakeScreen(){
  if(!game.showShake) return;
  const app = document.querySelector('.app');
  app.style.transform = 'translate('+rand(-4,4)+'px,'+rand(-4,4)+'px)';
  setTimeout(()=>app.style.transform='none',80);
}

function mineAt(x,y){
  game.totalClicks++;
  game.combo++;
  if(game.combo>game.maxCombo) game.maxCombo=game.combo;
  const maxCombo = getComboMax();
  if(game.combo>maxCombo) game.combo=maxCombo;
  game.comboTimer = getComboDuration();
  if(Math.random()<getInstakillChance()){
    blockCurrentHp = 0;
    log('神之手! 直接摧毁!','g');
  }else{
    const {dmg,isCrit} = calcDamage();
    blockCurrentHp -= dmg;
    if(x&&y) spawnDmgNum(x,y,dmg,isCrit);
    spawnParticles(x||window.innerWidth/2,y||window.innerHeight/2);
    shakeScreen();
  }
  updateBlockUI();
  updateComboUI();
  checkBlockDead();
  checkAchievements();
}

function checkBlockDead(){
  if(blockCurrentHp<=0){
    const b = getCurrentBlock();
    let coins = Math.round(b.coins*getCoinMult());
    game.coins += coins; game.totalCoins += coins;
    let exp = Math.round(b.exp*getExpMult());
    game.exp += exp;
    const dm = getDropMult();
    for(const [mat,amt] of Object.entries(b.drops)){
      const final = Math.round(amt*dm*(0.8+Math.random()*0.4));
      game.materials[mat] = (game.materials[mat]||0)+final;
    }
    game.blocksBroken++;
    log('破坏 '+b.name+' +'+fmt(coins)+'金币 +'+exp+'EXP','gr');
    checkLevelUp();
    game.block++;
    if(game.block>=ZONES[game.zone].blocks.length){game.block=0;}
    initBlock();
    updateBlockUI();
    updateStatsUI();
    updateMatUI();
  }
}

function checkLevelUp(){
  const need = Math.floor(100*Math.pow(game.level,1.55));
  if(game.exp>=need){
    game.exp -= need;
    game.level++;
    game.talentPoints++;
    log('升级 Lv.'+game.level+'! 获得1天赋点','g');
    toast('升级 Lv.'+game.level,'success');
    checkLevelUp();
  }
}

function updatePickUI(){
  const list = $('pkL');
  list.innerHTML = '';
  for(const p of PICKAXES){
    const owned = game.pickaxesOwned.includes(p.id);
    const equipped = game.pickaxe===p.id;
    const canBuy = !owned && game.pickaxe===p.req && game.coins>=p.cost && hasMaterials(p.mat);
    const el = document.createElement('div');
    el.className = 'pk-r'+(equipped?' on':'')+(!owned&&!canBuy?' lock':'');
    let btn = '';
    if(equipped){btn = '<span class="pk-tg">已装备</span>';}
    else if(owned){btn = '<button class="pk-ac" onclick="equipPick('+p.id+')">装备</button>';}
    else if(canBuy){btn = '<button class="pk-ac" onclick="buyPick('+p.id+')">'+fmt(p.cost)+'</button>';}
    else{btn = '<button class="pk-ac" disabled>未解锁</button>';}
    let reqText = '';
    if(!owned && p.req!==null){
      reqText = '需'+PICKAXES[p.req].name;
      if(Object.keys(p.mat).length>0){reqText += ' '; for(const [k,v] of Object.entries(p.mat)) reqText += MATERIALS[k].name+'x'+v+' ';}
    }
    el.innerHTML = getPickSVG(p.id)+'<div class="pk-in"><div class="pk-nm">'+p.name+'</div><div class="pk-st">攻击 '+fmt(p.damage)+(reqText?' | '+reqText:'')+'</div></div>'+btn;
    list.appendChild(el);
  }
}

function hasMaterials(mat){
  for(const [k,v] of Object.entries(mat)){if((game.materials[k]||0)<v) return false;}
  return true;
}

function buyPick(id){
  const p = PICKAXES[id];
  if(game.coins<p.cost) return;
  if(!hasMaterials(p.mat)) return;
  game.coins -= p.cost;
  for(const [k,v] of Object.entries(p.mat)) game.materials[k]-=v;
  game.pickaxesOwned.push(id);
  game.pickaxe = id;
  toast('合成 '+p.name,'success');
  log('合成 '+p.name,'g');
  updatePickUI();
  updateMatUI();
  updateStatsUI();
  saveGame();
}

function equipPick(id){
  if(!game.pickaxesOwned.includes(id)) return;
  game.pickaxe = id;
  toast('装备 '+PICKAXES[id].name,'info');
  updatePickUI();
  updateStatsUI();
  saveGame();
}

    const unlocked = game.level>=z.req;
    const active = game.zone===z.id;
    const el = document.createElement('button');
    el.className = 'zc'+(active?' on':'')+(!unlocked?' lock':'');
    el.innerHTML = '<div class="z-geo">'+GEO[z.shape](z.stroke||z.blocks[0].color)+'</div><div class="z-nm">'+z.name+'</div><div class="z-rq">'+(unlocked?'已解锁':'需Lv.'+z.req)+'</div>';

function updateTalentUI(){
  $('tPt').textContent = game.talentPoints;

  tree.innerHTML = '';
  for(const branch of TALENTS){
    const div = document.createElement('div');
    div.className = 'tl-s';
    div.innerHTML = '<div class="tl-hd"><div class="tl-ico">'+GEO[branch.shape]('#c9a84c')+'</div><div class="tl-tl">'+branch.branch+'</div></div>';
    const grid = document.createElement('div');
    grid.className = 'tl-g';
    for(const s of branch.skills){
      const lvl = game.talents[s.id]||0;
      const maxed = lvl>=s.max;
      const node = document.createElement('div');
      node.className = 'tl-n'+(lvl>0?' on':'')+(maxed?' mx':'');
      node.innerHTML = '<div class="tn-geo">'+GEO[branch.shape](maxed?'#4a9b5e':lvl>0?'#c9a84c':'#5a554d')+'</div><div class="tn-lv">'+lvl+'/'+s.max+'</div><div class="tn-nm">'+s.name+'</div><div class="tl-tt"><div class="tt-nm">'+s.name+'</div><div class="tt-dc">'+s.desc+'</div><div class="tt-ct">'+(maxed?'已满级':'消耗 '+s.cost+' 点')+'</div></div>';
      node.onclick = ()=>upgradeTalent(s);

function upgradeTalent(s){
  const lvl = game.talents[s.id]||0;
  if(lvl>=s.max){toast('已满级','error');return;}
  if(game.talentPoints<s.cost){toast('天赋点不足','error');return;}
  game.talentPoints -= s.cost;
  game.talents[s.id] = lvl+1;
  toast(s.name+' Lv.'+(lvl+1),'success');
  updateTalentUI();
  updateStatsUI();
  saveGame();
}

$('resetTal').onclick = ()=>{
  if(game.coins<1000){toast('金币不足 (需1000)','error');return;}
  game.coins -= 1000;
  let refunded = 0;
  for(const branch of TALENTS){
    for(const s of branch.skills){
      const lvl = game.talents[s.id]||0;
      refunded += lvl*s.cost;
    }
  }
  game.talentPoints += refunded;
  game.talents = {};
  toast('天赋重置, 退还 '+refunded+' 点','success');
  updateTalentUI();
  updateStatsUI();
  saveGame();
};

    const canCraft = game.coins>=p.cost && hasMaterials(p.mat);

    let req = '金币x'+fmt(p.cost)+' ';

    el.innerHTML = '<div class="cf-geo">'+getPickSVG(p.id)+'</div><div class="cf-in"><div class="cf-nm">'+p.name+'</div><div class="cf-rq">'+req+'</div></div><button class="cf-bt" '+(canCraft?'':'disabled')+' onclick="buyPick('+p.id+')">合成</button>';
    list.appendChild(el);
  }
  if(list.children.length===0){
    list.innerHTML = '<div style="text-align:center;color:var(--text-tert);font-size:.85rem;padding:28px;">所有镐子已合成</div>';
  }

function updateAchieveUI(){
  const list = $('achL');
  list.innerHTML = '';
  const stats = {
    totalClicks:game.totalClicks,totalCoins:game.totalCoins,blocksBroken:game.blocksBroken,
    level:game.level,maxCombo:game.maxCombo,critCount:game.critCount,
    talentPointsSpent:Object.values(game.talents).reduce((a,b)=>a+b,0),
    maxZone:game.zone,pickaxesOwned:game.pickaxesOwned.length,
    hasEternalPick:game.pickaxesOwned.includes(20)?1:0,
    materials:game.materials,
  };
  for(const a of ACHIEVEMENTS){
    const completed = game.achievements[a.id];
    const canComplete = !completed && a.req(stats);
    if(canComplete){
      game.achievements[a.id]=true;
      game.coins += a.reward;
      toast('成就: '+a.name+' +'+fmt(a.reward)+'金币','success');
    }
    const el = document.createElement('div');
    el.className = 'ach-r'+(game.achievements[a.id]?' done':'');
    el.innerHTML = '<div class="ach-geo">'+GEO[game.achievements[a.id]?'crown':'lock'](game.achievements[a.id]?'#c9a84c':'#5a554d')+'</div><div class="ach-in"><div class="ach-nm">'+a.name+'</div><div class="ach-dc">'+a.desc+'</div></div><div class="ach-rw">+'+fmt(a.reward)+'</div>';
    list.appendChild(el);
  }
}

function checkAchievements(){updateAchieveUI();}

// ===== CHEST =====
function updateChestUI(){
  const ready = game.chestReady;
  $('chSts').textContent = ready?'点击开启在线宝箱':'宝箱冷却中...';
  if(ready){$('chGeo').classList.add('pulse');$('chGeo').style.cursor='pointer';}
  else{$('chGeo').classList.remove('pulse');$('chGeo').style.cursor='not-allowed';}
}

$('chGeo').onclick = ()=>{
  if(!game.chestReady){toast('宝箱冷却中','error');return;}
  game.chestReady = false;
  game.chestTimer = Date.now();
  $('chGeo').classList.add('shake');
  setTimeout(()=>$('chGeo').classList.remove('shake'),500);
  const rewards = [];
  const r = Math.random();
  let coins = 0;
  if(r<0.5) coins=randInt(50,200);
  else if(r<0.8) coins=randInt(200,600);
  else if(r<0.95) coins=randInt(600,1500);
  else coins=randInt(1500,5000);
  game.coins += coins; game.totalCoins += coins;
  rewards.push({text:fmt(coins)+'金币'});
  const mats = Object.keys(MATERIALS);
  const mat = mats[randInt(0,mats.length-1)];
  const matAmt = randInt(1,5);
  game.materials[mat] = (game.materials[mat]||0)+matAmt;
  rewards.push({text:MATERIALS[mat].name+'x'+matAmt});
  const exp = randInt(20,100);
  game.exp += exp;
  rewards.push({text:exp+'经验'});
  const cont = $('chRws');
  cont.innerHTML = '';
  for(const rw of rewards){
    const el = document.createElement('div');
    el.className = 'rw-cp';
    el.textContent = rw.text;
    cont.appendChild(el);
  }
  toast('开启宝箱!','success');
  checkLevelUp();
  updateStatsUI();
  updateMatUI();
  updateChestUI();
  saveGame();
};

// ===== SETTINGS =====
function toggleSwitch(id,key){
  const el = $(id);
  game[key] = !game[key];
  el.classList.toggle('on',game[key]);
  saveGame();
}
$('togAuto').onclick = ()=>{toggleSwitch('togAuto','autoMine');toggleAutoMine();};
$('togDmg').onclick = ()=>toggleSwitch('togDmg','showDmg');
$('togShake').onclick = ()=>toggleSwitch('togShake','showShake');
$('togPart').onclick = ()=>toggleSwitch('togPart','showParticles');

function toggleAutoMine(){
  if(game.autoMine){
    if(autoMineInterval) clearInterval(autoMineInterval);
    autoMineInterval = setInterval(()=>{
      const rect = $('mineTarget').getBoundingClientRect();
      mineAt(rect.left+rect.width/2,rect.top+rect.height/2);
    },1000/getAutoSpeed());
  }else{
    if(autoMineInterval){clearInterval(autoMineInterval);autoMineInterval=null;}
  }
}

// Code
$('cdBtn').onclick = ()=>{
  const code = $('cdIn').value.trim().toUpperCase();
  if(!code) return;
  if(game.usedCodes.includes(code)){toast('兑换码已使用','error');return;}
  const reward = CODES[code];
  if(!reward){toast('无效兑换码','error');return;}
  game.usedCodes.push(code);
  if(reward.coins){game.coins+=reward.coins;game.totalCoins+=reward.coins;}
  if(reward.exp){game.exp+=reward.exp;}
  if(reward.talentPoints){game.talentPoints+=reward.talentPoints;}
  if(reward.materials){for(const[k,v] of Object.entries(reward.materials)) game.materials[k]=(game.materials[k]||0)+v;}
  toast(reward.msg+'!','success');
  $('cdIn').value='';
  checkLevelUp();
  updateStatsUI();
  updateMatUI();
  updateTalentUI();
  updateCodeUI();
  saveGame();
};

function updateCodeUI(){
  const list = $('cdTs');
  list.innerHTML = '';
  for(const code of Object.keys(CODES)){
    const used = game.usedCodes.includes(code);
    const el = document.createElement('span');
    el.className = 'cd-tg'+(used?' used':'');
    el.textContent = code;
    list.appendChild(el);
  }
}

// Save slots
function updateSaveUI(){
  const grid = $('svG');
  grid.innerHTML = '';
  for(let i=0;i<3;i++){
    const data = localStorage.getItem('deepMine3_slot'+i);
    let info = '空存档';
    if(data){const s=JSON.parse(data);info='Lv.'+s.level+' '+fmt(s.coins)+'金币';}
    const el = document.createElement('div');
    el.className = 'sv-c'+(i===currentSlot?' on':'');
    el.innerHTML = '<div class="sv-nm">存档 '+(i+1)+'</div><div class="sv-in">'+info+'</div>';
    el.onclick = ()=>switchSlot(i);
    grid.appendChild(el);
  }
}

function switchSlot(i){
  if(i===currentSlot) return;
  if(loadGame(i)){toast('加载存档 '+(i+1),'info');}
  else{newGame(i);toast('新建存档 '+(i+1),'info');}
  initGame();
}

// Export/Import
$('btnExp').onclick = ()=>{
  $('txExp').value = btoa(JSON.stringify(game));
  $('mdExp').classList.add('on');
};
$('clExp').onclick = ()=>$('mdExp').classList.remove('on');
$('cpExp').onclick = ()=>{
  $('txExp').select();
  document.execCommand('copy');
  toast('已复制','success');
};
$('btnImp').onclick = ()=>$('mdImp').classList.add('on');
$('clImp').onclick = ()=>$('mdImp').classList.remove('on');
$('doImp').onclick = ()=>{
  try{
    const data = JSON.parse(atob($('txImp').value.trim()));
    game = data;
    saveGame();
    initGame();
    $('mdImp').classList.remove('on');
    toast('导入成功','success');
  }catch(e){toast('导入失败','error');}
};

// ===== OFFLINE =====
function calcOffline(){
  const now = Date.now();
  const offline = (now - game.lastOnline)/1000;
  if(offline<60) return;
  const hours = offline/3600;
  const mult = getOfflineMult();
  const dps = getPickDamage()*getAutoSpeed();
  const maxHours = 8;
  const effHours = Math.min(hours,maxHours);
  let coins=0,exp=0,mats={};
  const b = getCurrentBlock();
  const kills = Math.floor(dps*effHours*3600/b.hp*mult*0.3);
  if(kills>0){
    coins = Math.floor(kills*b.coins*getCoinMult());
    exp = Math.floor(kills*b.exp*getExpMult());
    for(const [k,v] of Object.entries(b.drops)) mats[k]=Math.floor(kills*v*getDropMult());
  }
  if(coins>0 || exp>0){
    $('offTime').textContent = '离线 '+Math.floor(offline/60)+' 分钟 (上限8小时)';
    const cont = $('offIt');
    cont.innerHTML = '';
    if(coins>0){const el=document.createElement('div');el.className='of-itm';el.textContent=fmt(coins)+'金币';cont.appendChild(el);}
    if(exp>0){const el=document.createElement('div');el.className='of-itm';el.textContent=fmt(exp)+'经验';cont.appendChild(el);}
    for(const [k,v] of Object.entries(mats)){if(v>0){const el=document.createElement('div');el.className='of-itm';el.textContent=MATERIALS[k].name+'x'+v;cont.appendChild(el);}}
    $('mdOff').classList.add('on');
    $('offBtn').onclick = ()=>{
      game.coins+=coins;game.totalCoins+=coins;game.exp+=exp;
      for(const [k,v] of Object.entries(mats)) game.materials[k]=(game.materials[k]||0)+v;
      game.lastOnline=now;
      $('mdOff').classList.remove('on');
      checkLevelUp();
      updateStatsUI();
      updateMatUI();
      saveGame();
    };
  }
}

// ===== TABS =====
document.querySelectorAll('.tab-bt').forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll('.tab-bt').forEach(t=>t.classList.remove('on'));
    document.querySelectorAll('.tab-p').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on');
    $('p-'+tab.dataset.tab).classList.add('on');
    if(tab.dataset.tab==='craft') updateCraftUI();
    if(tab.dataset.tab==='achieve') updateAchieveUI();
  };
});

// ===== INPUT =====
let longPress = false;
let longPressTimer = null;
$('mineTarget').onmousedown = (e)=>{longPress=false;longPressTimer=setTimeout(()=>longPress=true,300);};
$('mineTarget').onmouseup = (e)=>{if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}if(!longPress) mineAt(e.clientX,e.clientY);};
$('mineTarget').ontouchstart = (e)=>{longPress=false;longPressTimer=setTimeout(()=>longPress=true,300);};
$('mineTarget').ontouchend = (e)=>{if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}if(!longPress){const t=e.changedTouches[0];mineAt(t.clientX,t.clientY);}e.preventDefault();};

// Combo decay
function startComboDecay(){
  if(comboDecayInterval) clearInterval(comboDecayInterval);
  comboDecayInterval = setInterval(()=>{
    if(game.comboTimer>0){game.comboTimer-=0.1;if(game.comboTimer<=0){game.combo=0;updateComboUI();}}
  },100);
}

// Chest timer
chestInterval = setInterval(()=>{
  if(!game.chestReady){
    const elapsed = (Date.now()-game.chestTimer)/1000;
    if(elapsed>=300){game.chestReady=true;updateChestUI();}
  }
},1000);

// Play time
playTimeInterval = setInterval(()=>{game.playTime++;game.lastOnline=Date.now();updateStatsUI();},60);

// Auto save
saveInterval = setInterval(()=>saveGame(),30000);

// ===== INIT =====
function initGame(){
  initBlock();
  updateBlockUI();
  updateStatsUI();
  updateMatUI();
  updatePickUI();
  updateZoneUI();
  updateTalentUI();
  updateCraftUI();
  updateAchieveUI();
  updateChestUI();
  updateCodeUI();
  updateSaveUI();
  $('togAuto').classList.toggle('on',game.autoMine);
  $('togDmg').classList.toggle('on',game.showDmg);
  $('togShake').classList.toggle('on',game.showShake);
  $('togPart').classList.toggle('on',game.showParticles);
  if(game.autoMine) toggleAutoMine();
  setTimeout(()=>{$('loadBar').parentElement.classList.add('ready');setTimeout(()=>$('load').classList.add('done'),700);},500);
  calcOffline();
  startComboDecay();
}

const savedSlot = localStorage.getItem('deepMine3_slot');
if(savedSlot!==null && loadGame(parseInt(savedSlot))){
  currentSlot = parseInt(savedSlot);
} else if(!loadGame(0)){
  newGame(0);
}
initGame();
</script>
