<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Cat Gaming</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d14; }
  body { display: flex; align-items: center; justify-content: center; }
  svg {
    width: 100%; max-width: 1100px; height: auto; max-height: 100vh; display: block;
    image-rendering: pixelated; border-radius: 12px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }
  .screen { mix-blend-mode: screen; }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 192 144" xmlns="http://www.w3.org/2000/svg"
     shape-rendering="crispEdges" role="img" aria-label="Apple Cat playing on a computer in a cozy room at night">
  <defs>
    <radialGradient id="lampGlow" gradientUnits="userSpaceOnUse" cx="40" cy="56" r="78">
      <stop offset="0" stop-color="#ffc061" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#ff9a3c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb14d" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="screenGlow" gradientUnits="userSpaceOnUse" cx="88" cy="68" r="30">
      <stop id="sg0" offset="0" stop-color="#4aa8ff" stop-opacity=".75"/>
      <stop id="sg1" offset="1" stop-color="#4aa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kbGlow" gradientUnits="userSpaceOnUse" cx="104" cy="93" r="22">
      <stop offset="0" stop-color="#5fc8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5fc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" gradientUnits="userSpaceOnUse" cx="96" cy="70" r="125">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#05020a" stop-opacity=".6"/>
    </radialGradient>
  </defs>

  <g id="room"></g>
  <g id="sky"></g>
  <g id="roomFront"></g>
  <g id="cat"></g>
  <ellipse id="catGlow" class="screen" cx="88" cy="68" rx="28" ry="24" fill="url(#screenGlow)" shape-rendering="auto"/>
  <g id="desk"></g>
  <g id="paws"></g>
  <g id="deskFront"></g>
  <g id="steam"></g>
  <rect class="screen" x="82" y="86" width="44" height="14" fill="url(#kbGlow)" shape-rendering="auto"/>
  <polygon id="lampCone" class="screen" points="34,51 46,51 74,99 8,99" fill="url(#cone)" shape-rendering="auto"/>
  <rect id="lampGlowRect" class="screen" width="192" height="144" fill="url(#lampGlow)" shape-rendering="auto"/>
  <g id="fx"></g>
  <rect width="192" height="144" fill="url(#vignette)" shape-rendering="auto" pointer-events="none"/>
</svg>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mk = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };
  const G = (parent, attrs = {}) => mk('g', attrs, parent);
  const R = (g, x, y, w, h, c) => mk('rect', { x, y, width: w, height: h, fill: c }, g);

  // Draw a pixel sprite from strings; runs of the same colour are merged
  function sprite(g, x0, y0, rows, pal) {
    rows.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        const ch = row[x];
        if (!pal[ch]) { x++; continue; }
        let e = x;
        while (e < row.length && row[e] === ch) e++;
        R(g, x0 + x, y0 + y, e - x, 1, pal[ch]);
        x = e;
      }
    });
    return g;
  }
  // Rows [y, x0, x1] for a union of discs
  function discRows(discs) {
    const ys = discs.flatMap(d => [d.y - d.r, d.y + d.r]);
    const out = [];
    for (let y = Math.ceil(Math.min(...ys)); y <= Math.floor(Math.max(...ys)); y++) {
      let a = Infinity, b = -Infinity;
      for (const d of discs) {
        const dy = y - d.y;
        if (Math.abs(dy) > d.r) continue;
        const hw = Math.round(Math.sqrt(d.r * d.r - dy * dy));
        a = Math.min(a, d.x - hw); b = Math.max(b, d.x + hw);
      }
      if (a <= b) out.push([y, a, b]);
    }
    return out;
  }
  const fillRows = (g, rows, c) => rows.forEach(([y, a, b]) => R(g, a, y, b - a + 1, 1, c));
  function outlineRows(g, rows, c) {
    rows.forEach(([y, a, b]) => {
      R(g, a - 1, y, b - a + 3, 1, c);
      R(g, a, y - 1, b - a + 1, 1, c);
      R(g, a, y + 1, b - a + 1, 1, c);
    });
  }
  function line(g, x0, y0, x1, y1, c, t = 2) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= n; i++) {
      R(g, Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), t, t, c);
    }
  }
  // Seeded random so the room looks the same every load
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* ================= ROOM (back) ================= */
  const room = $('room');
  R(room, 0, 0, 192, 108, '#4a3642');            // wall
  R(room, 0, 0, 192, 2, '#3c2b36');
  for (let i = 0; i < 40; i++) R(room, Math.floor(rnd() * 190), Math.floor(rnd() * 100), 2, 1, '#513c49');

  // Shelf + books + picture + hanging plant pot
  R(room, 0, 18, 76, 3, '#8b5530'); R(room, 0, 18, 76, 1, '#b07040'); R(room, 0, 21, 76, 1, '#3a2014');
  R(room, 62, 22, 3, 5, '#5e3519');
  [[30, 3, 13, '#a12e2e'], [33, 4, 14, '#7a1f24'], [37, 3, 12, '#2f6b4a'], [40, 4, 14, '#c49a3a'], [44, 3, 11, '#2c4f7c']]
    .forEach(([x, w, h, c]) => { R(room, x, 18 - h, w, h, c); R(room, x, 18 - h, 1, h, 'rgba(255,255,255,.15)'); R(room, x, 18 - h + 3, w, 1, 'rgba(0,0,0,.25)'); });
  sprite(G(room), 52, 6, [
    'kkkkkkkkkkkk',
    'kffffffffffk',
    'kfccccccccfk',
    'kfcccgcccc' + 'fk',
    'kfccgggcccfk',
    'kfcgggggccfk',
    'kfccgggcccfk',
    'kfcgggggccfk',
    'kfccccbcccfk',
    'kfccccbcccfk',
    'kffffffffffk',
    'kkkkkkkkkkkk',
  ], { k: '#2a1810', f: '#8b5a34', c: '#e8dcc0', g: '#3d7a3a', b: '#6a4220' });
  sprite(G(room), 8, 10, [
    '.kkkkkkkkkkk.',
    'kpppppppppppk',
    '.kpppppppppk.',
    '.kpddddddddk.',
    '.kpdddddddpk.',
    '..kpppppppk..',
    '..kpppppppk..',
    '...kkkkkkk...',
  ], { k: '#3a1d12', p: '#d07a48', d: '#b35f35' });

  // Corkboard
  const cork = G(room);
  R(cork, 50, 24, 40, 21, '#6b4026'); R(cork, 51, 25, 38, 19, '#b07a45');
  for (let i = 0; i < 25; i++) R(cork, 51 + Math.floor(rnd() * 37), 25 + Math.floor(rnd() * 18), 1, 1, '#9a6738');
  sprite(cork, 53, 27, [
    'wwwwwwwwwwwww',
    'wsssssssssssw',
    'wsssssssssssw',
    'wsssssMssssw'.padEnd(12, 's') + 'w',
    'wssssMMMsssssw'.slice(0, 13),
    'wsssMMMMMssssw'.slice(0, 13),
    'wsgMMMMMMMgsw',
    'wgggMMMMMgggw',
    'wgggggggggggw',
    'wgggggggggggw',
    'wwwwwwwwwwwww',
  ], { w: '#f2ead8', s: '#8fc4e8', M: '#7c8aa0', g: '#5aa04a' });
  R(cork, 69, 27, 6, 6, '#f2d36a'); R(cork, 69, 27, 6, 1, '#e6c050');
  R(cork, 70, 35, 6, 6, '#e8e0cc');
  sprite(cork, 78, 31, [
    'wwwwwwwww',
    'wwrrwrrww',
    'wrrrrrrrw',
    'wrrrrrrrw',
    'wwrrrrrww',
    'wwwrrrwww',
    'wwwwrwwww',
    'wwwwwwwww',
  ], { w: '#f3ece0', r: '#d03a3a' });
  R(cork, 59, 26, 1, 1, '#e03a3a'); R(cork, 71, 26, 1, 1, '#3a7ae0'); R(cork, 82, 30, 1, 1, '#e0c03a');

  // Window frame
  R(room, 116, 4, 66, 55, '#5e3519'); R(room, 117, 5, 64, 53, '#7c4a28');

  /* ================= NIGHT SKY ================= */
  const sky = $('sky');
  R(sky, 119, 7, 58, 48, '#161b42'); R(sky, 119, 32, 58, 23, '#1e2552');
  R(sky, 119, 44, 58, 11, '#262d5e');
  sprite(G(sky), 160, 10, [
    '..yyy.',
    '.yyY..',
    'yyY...',
    'yyY...',
    'yyY...',
    '.yyY..',
    '..yyy.',
  ], { y: '#ffd76a', Y: '#e8b84a' });
  const stars = [];
  [[124, 11], [131, 18], [139, 9], [145, 24], [152, 14], [171, 22], [127, 27], [157, 30], [174, 33], [136, 31], [167, 39]]
    .forEach(([x, y], i) => stars.push({ el: R(sky, x, y, 1, 1, i % 3 ? '#fff4c8' : '#ffd76a'), ph: rnd() * 6 }));
  R(sky, 128, 29, 9, 2, '#2a3268'); R(sky, 126, 30, 14, 2, '#2a3268');   // little cloud
  const cityWins = [];
  [[119, 8, 14, '#232850'], [127, 6, 21, '#2b3160'], [133, 10, 11, '#232850'], [143, 5, 17, '#2b3160'],
   [150, 9, 23, '#232850'], [159, 7, 13, '#2b3160'], [166, 11, 18, '#232850']].forEach(([x, w, h, c]) => {
    R(sky, x, 55 - h, w, h, c);
    for (let wy = 55 - h + 2; wy < 53; wy += 3)
      for (let wx = x + 1; wx < x + w - 1; wx += 2)
        if (rnd() < .55) cityWins.push(R(sky, wx, wy, 1, 1, rnd() < .45 ? '#ffd36b' : '#3a417a'));
  });
  R(sky, 147, 7, 3, 48, '#7c4a28'); R(sky, 147, 7, 1, 48, '#93603a');   // mullion
  R(sky, 119, 7, 58, 1, '#0f1330');

  /* ================= ROOM (front of wall: bed, floor, chair) ================= */
  const rf = $('roomFront');
  R(rf, 114, 56, 70, 3, '#93603a'); R(rf, 114, 58, 70, 1, '#4a2a16');     // sill
  R(rf, 0, 108, 192, 36, '#5c321c');                                    // floor
  for (let y = 112; y < 144; y += 6) R(rf, 0, y, 192, 1, '#4a2614');
  for (let y = 108, k = 0; y < 144; y += 6, k++)
    for (let x = (k % 2) * 14; x < 192; x += 28) R(rf, x, y + 1, 1, 5, '#4a2614');
  for (let y = 124, r = 0; y < 144; y += 4, r++)                         // rug
    for (let x = 148, c = 0; x < 192; x += 4, c++) R(rf, x, y, 4, 4, (r + c) % 2 ? '#6d6a8c' : '#8f8cad');
  R(rf, 148, 123, 44, 1, '#4c4a66');
  // Bed
  R(rf, 146, 52, 4, 58, '#5e3519'); R(rf, 146, 52, 1, 58, '#8b5530'); R(rf, 145, 50, 6, 3, '#8b5530');
  R(rf, 150, 58, 42, 4, '#7c4a28'); R(rf, 150, 58, 42, 1, '#a06a40');
  sprite(G(rf), 152, 62, [
    '.kkkkkkkkkkkkkkkkkkkkkkkkkkkk.',
    'kwwwwwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwwwwsk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwwwssk',
    'kswwwwwwwwwwwwwwwwwwwwwwwwsssk',
    'ksssssssssssssssssssssssssssk.',
  ], { k: '#8a7f78', w: '#efe7de', s: '#cfc3b8' });
  for (let y = 69, r = 0; y < 104; y += 4, r++)
    for (let x = 150, c = 0; x < 192; x += 4, c++) R(rf, x, y, 4, 4, (r + c) % 2 ? '#dfe0ee' : '#566aa8');
  R(rf, 150, 69, 42, 1, '#3d4a7a');
  R(rf, 150, 103, 42, 7, '#6b3d20'); R(rf, 150, 103, 42, 1, '#8b5530');
  // Chair back
  R(rf, 121, 55, 17, 36, '#3a2014'); R(rf, 122, 56, 15, 34, '#6b4026');
  R(rf, 124, 58, 11, 30, '#eadcc0'); R(rf, 124, 58, 11, 1, '#fff3dc'); R(rf, 133, 59, 2, 29, '#cdbd9c');

  /* ================= APPLE CAT ================= */
  const cat = $('cat');
  const catBody = G(cat);
  const O = 4; // horizontal offset of the cat
  const apple = discRows([{ x: 95 + O, y: 70, r: 19 }, { x: 105 + O, y: 70, r: 19 }]);
  outlineRows(catBody, apple, '#3a0b0f');
  fillRows(catBody, apple, '#a3161e');
  const lit = discRows([{ x: 93 + O, y: 68, r: 18 }, { x: 103 + O, y: 68, r: 18 }]);
  lit.forEach(([y, a, b]) => {
    const base = apple.find(r => r[0] === y);
    if (!base) return;
    const s = Math.max(a, base[1]), e = Math.min(b, base[2]);
    if (s <= e) R(catBody, s, y, e - s + 1, 1, '#d8282d');
  });
  sprite(catBody, 84 + O, 56, [
    '..hhh',
    '.hhhw',
    'hhhh.',
    'hhh..',
    'hh...',
    'h....',
  ], { h: '#ff6d5e', w: '#ffd0c8' });
  // stem + leaf
  const stem = G(cat);
  R(stem, 98 + O, 43, 4, 9, '#2a1408'); R(stem, 99 + O, 44, 2, 8, '#6a3a18'); R(stem, 99 + O, 44, 1, 8, '#8a5228');
  const leaf = sprite(G(cat), 101 + O, 39, [
    '...kkkk.',
    '.kkggggk',
    'kgggGggk',
    'kGGGggk.',
    '.kkkkk..',
  ], { k: '#1c3a12', g: '#76c04f', G: '#3f8030' });
  // face
  sprite(G(cat), 87 + O, 59, [
    '.kk....................kk.',
    '.kwk..................kwk.',
    '.kwpk................kpwk.',
    '.kwppk..............kppwk.',
    '.kwpppwkkkkkkkkkkkkwpppwk.',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwwk',
    'kwwwwwwwwwwwwwwwwwwwwwwwsk',
    'kwwwwwwwwwwwwwwwwwwwwwwssk',
    'kswwwwwwwwwwwwwwwwwwwwsssk',
    '.ksswwwwwwwwwwwwwwwwssssk.',
    '..kkkkkkkkkkkkkkkkkkkkkk..',
  ], { k: '#1b1012', w: '#fbf6ee', p: '#f2a0ab', s: '#e6ddd2' });
  const face = G(cat);
  R(face, 94 + O, 72, 3, 1, '#f4a0ac'); R(face, 111 + O, 72, 3, 1, '#f4a0ac');
  [[101, 72], [102, 73], [103, 72], [104, 72], [105, 73], [106, 72]].forEach(([x, y]) => R(face, x + O, y, 1, 1, '#1b1012'));
  const eyesOpen = G(face);
  [97, 109].forEach(x => { R(eyesOpen, x + O, 67, 2, 3, '#1b1012'); R(eyesOpen, x + O + 1, 67, 1, 1, '#ffffff'); });
  const eyesShut = G(face, { visibility: 'hidden' });
  [97, 109].forEach(x => R(eyesShut, x + O, 69, 2, 1, '#1b1012'));
  const eyesHappy = G(face, { visibility: 'hidden' });
  [96, 108].forEach(x => {
    R(eyesHappy, x + O, 69, 1, 1, '#1b1012'); R(eyesHappy, x + O + 1, 68, 2, 1, '#1b1012'); R(eyesHappy, x + O + 3, 69, 1, 1, '#1b1012');
  });

  /* ================= DESK + ITEMS ================= */
  const desk = $('desk');
  R(desk, 4, 87, 152, 1, '#5a2e14');
  R(desk, 4, 88, 152, 12, '#c47a3c');
  for (let i = 0; i < 60; i++) {
    R(desk, 4 + Math.floor(rnd() * 140), 88 + Math.floor(rnd() * 11), 3 + Math.floor(rnd() * 10), 1, rnd() < .5 ? '#b56c32' : '#d08848');
  }
  R(desk, 4, 99, 152, 2, '#e39a55');
  // books standing on the desk
  [[4, 4, 18, '#2c5a4a'], [8, 3, 15, '#7a1f24'], [11, 4, 19, '#2c4f7c'], [15, 3, 16, '#a12e2e']]
    .forEach(([x, w, h, c]) => { R(desk, x, 90 - h, w, h, c); R(desk, x, 90 - h, 1, h, 'rgba(255,255,255,.18)'); R(desk, x, 90 - h + 3, w, 1, '#e8c060'); R(desk, x + w - 1, 90 - h, 1, h, 'rgba(0,0,0,.3)'); });
  // little plant
  sprite(G(desk), 19, 69, [
    '....g..g....',
    '..g.gg.gg...',
    '.ggg.gggg.g.',
    '..gGgggGggg.',
    '...gGgGgGg..',
    '....GGgGG...',
    '.....GGG....',
    '..kkkkkkkk..',
    '..kppppppk..',
    '..kppppppk..',
    '...kppppk...',
    '...kssssk...',
    '....kkkk....',
  ], { g: '#7ac25a', G: '#3f8030', k: '#3a2014', p: '#e8e2d6', s: '#c8c0b2' });
  // Lamp
  const lamp = G(desk);
  R(lamp, 30, 88, 13, 3, '#2a1a10'); R(lamp, 31, 88, 11, 1, '#6a4a32'); R(lamp, 31, 89, 11, 1, '#4a3222');
  line(lamp, 36, 87, 27, 63, '#4a3222'); line(lamp, 27, 63, 35, 50, '#4a3222');
  R(lamp, 26, 62, 3, 3, '#6a4a32');
  sprite(lamp, 31, 43, [
    '....kkkkk....',
    '..kkbbbbbkk..',
    '.kbbbbbbbbbk.',
    'kbbbbbbbbbbbk',
    'kkkkkkkkkkkkk',
    '.kyyyyyyyyyk.',
  ], { k: '#24160c', b: '#6a4428', y: '#fff0b0' });
  // Pencil cup
  sprite(G(desk), 21, 84, [
    '.y...r..',
    '.y..rb..',
    '.y.rb.g.',
    '.yr.b.g.',
    'kkkkkkkk',
    'kmmmmmmk',
    'kmmmmmmk',
    'kmmmmmmk',
    'kmmmmmmk',
    'kmmmmmmk',
    'kmmmmmmk',
    '.kkkkkk.',
  ], { y: '#e8c040', r: '#d04040', b: '#4060c0', g: '#50a050', k: '#1e1a18', m: '#5a5650' });
  // Monitor (back facing us, screen facing the cat)
  const mon = G(desk);
  R(mon, 62, 84, 7, 8, '#22222a'); R(mon, 63, 84, 2, 8, '#3a3a46');
  R(mon, 55, 91, 21, 3, '#1a1a20'); R(mon, 56, 91, 19, 1, '#44444f');
  R(mon, 45, 49, 42, 37, '#141419'); R(mon, 46, 50, 40, 35, '#30303a');
  R(mon, 46, 50, 40, 1, '#4a4a58'); R(mon, 46, 50, 2, 35, '#424250'); R(mon, 84, 51, 2, 34, '#25252d');
  for (let y = 76; y <= 80; y += 2) R(mon, 54, y, 24, 1, '#24242c');
  sprite(mon, 63, 58, [
    '...k..',
    '..k...',
    '.rrrr.',
    'rrrrrr',
    'rrrrrr',
    '.rrrr.',
  ], { k: '#55555f', r: '#55555f' });
  const screenEdge = R(mon, 87, 50, 2, 35, '#4aa8ff');
  const screenEdge2 = R(mon, 89, 52, 1, 31, '#4aa8ff');
  screenEdge2.setAttribute('opacity', '.5');
  // Keyboard
  const kb = G(desk);
  R(kb, 87, 89, 35, 7, '#121218'); R(kb, 88, 90, 33, 5, '#24242f');
  const keys = [];
  for (let r = 0; r < 2; r++)
    for (let c = 0; c < 10; c++) keys.push(R(kb, 90 + c * 3, 91 + r * 2, 2, 1, '#2f5c96'));
  R(kb, 96, 95, 0, 0, 'none');
  // Mouse pad + mouse
  R(desk, 125, 93, 22, 6, '#2a2a30'); R(desk, 125, 93, 22, 1, '#3c3c44');
  sprite(G(desk), 132, 91, [
    '.kkkk.',
    'kmmlmk',
    'kmmmmk',
    'kmmmmk',
    '.kkkk.',
  ], { k: '#101014', m: '#34343e', l: '#5fd0ff' });

  /* ================= PAWS ================= */
  const pawRows = [
    '.kkkkk.',
    'kwwwwwk',
    'kwwwwwk',
    'kwkwkwk',
    '.kkkkk.',
  ];
  const pawPal = { k: '#1b1012', w: '#fbf6ee' };
  const pawL = sprite(G($('paws')), 0, 0, pawRows, pawPal);
  const pawR = sprite(G($('paws')), 0, 0, pawRows, pawPal);

  /* ================= DESK FRONT + MUG ================= */
  const df = $('deskFront');
  R(df, 4, 101, 152, 43, '#7a4220'); R(df, 4, 101, 152, 2, '#4a2412');
  R(df, 152, 101, 4, 43, '#5e3218');
  [[12, 106, 40, 16], [100, 106, 46, 14], [100, 124, 46, 14]].forEach(([x, y, w, h]) => {
    R(df, x, y, w, h, '#4a2412'); R(df, x + 1, y + 1, w - 2, h - 2, '#8a4c26'); R(df, x + 1, y + 1, w - 2, 1, '#a05c30');
    R(df, x + w / 2 - 3, y + Math.floor(h / 2), 6, 2, '#d8a050'); R(df, x + w / 2 - 3, y + Math.floor(h / 2) + 1, 6, 1, '#8a6020');
  });
  R(df, 70, 98, 14, 2, '#5a3018');
  sprite(G(df), 72, 89, [
    'kkkkkkkkk..',
    'kRccccccRk.',
    'krrrrrrrkkk',
    'krrrrrrrk.k',
    'krrrrrrrk.k',
    'krrrrrrdkkk',
    'krrrrrrdk..',
    'kdrrrrddk..',
    '.kkkkkkk...',
  ], { k: '#3a0b0f', R: '#e85a4f', c: '#e2c28e', r: '#c8262c', d: '#8f1a1f' });

  /* ================= STEAM & FX ================= */
  const steamParts = [];
  for (let col = 0; col < 3; col++)
    for (let i = 0; i < 3; i++)
      steamParts.push({ el: R($('steam'), 0, 0, 1, 2, '#ffffff'), col, ph: i / 3 });

  const fx = $('fx');
  const heartRows = ['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'];
  const starRows = ['..y..', '.yyy.', 'yyyyy', '.yyy.', '..y..'];
  const pool = [];
  for (let i = 0; i < 8; i++) {
    const g = G(fx, { visibility: 'hidden' });
    sprite(g, 0, 0, i % 2 ? starRows : heartRows, i % 2 ? { y: '#ffe36a' } : { r: '#ff5a7a' });
    pool.push({ g, active: false });
  }
  const bang = G(fx, { visibility: 'hidden' });
  sprite(bang, 0, 0, ['kk', 'kk', 'kk', 'kk', '..', 'kk'], { k: '#ffe36a' });

  /* ================= ANIMATION ================= */
  const glowColors = ['#4aa8ff', '#6f7bff', '#3ee0c8', '#b06bff', '#5fd0ff', '#ff6fb0'];
  const sg0 = $('sg0'), sg1 = $('sg1');
  const lampGlow = $('lampGlowRect'), lampCone = $('lampCone');
  const vis = (el, on) => el.setAttribute('visibility', on ? 'visible' : 'hidden');

  let nextTap = 0, tapPaw = 0, tapUntil = 0, litKey = null, litUntil = 0;
  let nextBlink = 2500, blinkUntil = 0;
  let nextGlow = 0, glow = glowColors[0];
  let nextWin = 6000, winUntil = 0;
  let nextCity = 0;

  function setGlow(c) {
    glow = c;
    sg0.setAttribute('stop-color', c); sg1.setAttribute('stop-color', c);
    screenEdge.setAttribute('fill', c); screenEdge2.setAttribute('fill', c);
  }

  function tick(now) {
    const winning = now < winUntil;

    // Breathing bob
    const bob = winning ? -2 : (Math.floor(now / 650) % 2);
    cat.setAttribute('transform', `translate(0,${bob})`);
    leaf.setAttribute('transform', `translate(0,${Math.floor(now / 900) % 2 ? -1 : 0})`);

    // Typing
    if (!winning && now > nextTap) {
      tapPaw = rnd() < .8 ? 1 - tapPaw : tapPaw;
      tapUntil = now + 90;
      nextTap = now + 130 + rnd() * 140;
      if (litKey) litKey.setAttribute('fill', '#2f5c96');
      const c = tapPaw === 0 ? 1 + Math.floor(rnd() * 4) : 5 + Math.floor(rnd() * 4);
      litKey = keys[c + (rnd() < .5 ? 0 : 10)];
      litKey.setAttribute('fill', '#a8e6ff');
      litUntil = now + 160;
    }
    if (litKey && now > litUntil) { litKey.setAttribute('fill', '#2f5c96'); litKey = null; }
    let yL = 86, yR = 86;
    if (winning) { const up = Math.floor(now / 150) % 2; yL = 80 + up; yR = 81 - up; }
    else if (now < tapUntil) { if (tapPaw === 0) { yL = 87; yR = 85; } else { yR = 87; yL = 85; } }
    pawL.setAttribute('transform', `translate(${94 + O},${yL})`);
    pawR.setAttribute('transform', `translate(${107 + O},${yR})`);

    // Eyes
    if (now > nextBlink) { blinkUntil = now + 130; nextBlink = now + 2200 + rnd() * 2600; }
    const blinking = now < blinkUntil;
    vis(eyesHappy, winning); vis(eyesShut, !winning && blinking); vis(eyesOpen, !winning && !blinking);

    // Screen glow flicker (the game!)
    if (now > nextGlow) {
      setGlow(winning ? (Math.floor(now / 120) % 2 ? '#ffe36a' : '#ff6fb0') : glowColors[Math.floor(rnd() * glowColors.length)]);
      nextGlow = now + (winning ? 120 : 280 + rnd() * 420);
    }

    // Victory!
    if (now > nextWin) {
      winUntil = now + 1700; nextWin = now + 7000 + rnd() * 4000;
      pool.forEach((p, i) => {
        p.active = true; p.born = now + i * 90;
        p.x = 70 + rnd() * 30; p.vx = (rnd() - .5) * 14;
      });
    }
    pool.forEach(p => {
      if (!p.active) return;
      const age = (now - p.born) / 1000;
      if (age < 0) { vis(p.g, false); return; }
      if (age > 1.6) { p.active = false; vis(p.g, false); return; }
      vis(p.g, Math.floor(age * 10) % 7 !== 6 || age < 1.2);
      p.g.setAttribute('transform', `translate(${Math.round(p.x + p.vx * age)},${Math.round(44 - age * 30)})`);
    });
    vis(bang, winning);
    bang.setAttribute('transform', `translate(${103 + O},${Math.round(30 + bob + (Math.floor(now / 200) % 2))})`);

    // Steam
    steamParts.forEach(s => {
      const p = ((now / 2200) + s.ph) % 1;
      s.el.setAttribute('x', Math.round(74 + s.col * 3 + Math.sin(p * 7 + s.col * 2) * 1.3));
      s.el.setAttribute('y', Math.round(87 - p * 16));
      s.el.setAttribute('opacity', ((1 - p) * .55).toFixed(2));
    });

    // Stars twinkle, city windows toggle
    stars.forEach(s => s.el.setAttribute('opacity', Math.sin(now / 500 + s.ph) > -.3 ? 1 : .25));
    if (now > nextCity) {
      const w = cityWins[Math.floor(rnd() * cityWins.length)];
      w.setAttribute('fill', w.getAttribute('fill') === '#ffd36b' ? '#3a417a' : '#ffd36b');
      nextCity = now + 700 + rnd() * 900;
    }

    // Lamp breathing
    const lg = .9 + Math.sin(now / 900) * .06 + (rnd() < .01 ? -.12 : 0);
    lampGlow.setAttribute('opacity', lg.toFixed(2));
    lampCone.setAttribute('opacity', lg.toFixed(2));

    requestAnimationFrame(tick);
  }
  setGlow(glow);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
