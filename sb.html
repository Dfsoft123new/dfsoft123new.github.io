<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; touch-action:none; }
body { background:#010108; overflow:hidden; font-family:'Microsoft YaHei',sans-serif; color:#fff; }
#gameCanvas { display:block; position:fixed; top:0; left:0; }
.panel {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(6,10,28,0.97); border:2px solid #3366dd; border-radius:18px;
  padding:24px; max-width:920px; width:93%; max-height:94vh; overflow-y:auto;
  box-shadow:0 0 80px rgba(51,102,221,0.35), inset 0 0 50px rgba(51,102,221,0.06);
}
.panel h1 { text-align:center; color:#66ccff; font-size:28px; margin-bottom:14px; text-shadow:0 0 25px #4488ff; }
.panel h2 { color:#ffaa44; font-size:18px; margin:12px 0 8px; }
.btn {
  display:inline-block; padding:10px 24px; margin:6px; border:none; border-radius:10px;
  color:#fff; font-size:15px; cursor:pointer; transition:all 0.2s; font-weight:bold;
  background:linear-gradient(135deg,#2244aa,#4488ff);
  box-shadow:0 4px 18px rgba(34,68,170,0.45);
}
.btn:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(68,136,255,0.55); }
.btn:active { transform:translateY(0); }
.btn:disabled { background:#2a2a3a; cursor:not-allowed; opacity:0.45; }
.btn-gold { background:linear-gradient(135deg,#cc7700,#ffaa00); box-shadow:0 4px 18px rgba(204,136,0,0.45); }
.btn-red { background:linear-gradient(135deg,#aa2222,#ff4444); }
.btn-green { background:linear-gradient(135deg,#228844,#44cc66); }

.weapon-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:14px 0; }
@media(max-width:600px){ .weapon-grid{grid-template-columns:repeat(2,1fr);} }
.weapon-card {
  background:rgba(20,28,55,0.95); border:2px solid #2a3a66; border-radius:14px;
  padding:16px 10px; text-align:center; cursor:pointer; transition:all 0.25s; position:relative;
}
.weapon-card:hover { border-color:#5588dd; transform:scale(1.04); box-shadow:0 0 25px rgba(85,136,221,0.25); }
.weapon-card.selected { border-color:#ffcc00; background:rgba(65,50,12,0.95); box-shadow:0 0 30px rgba(255,204,0,0.4), inset 0 0 25px rgba(255,204,0,0.08); }
.weapon-card.selected::after { content:'✓'; position:absolute; top:6px; right:10px; color:#ffcc00; font-size:20px; font-weight:bold; text-shadow:0 0 8px #ffcc00; }
.weapon-card .w-icon { font-size:34px; margin-bottom:6px; filter:drop-shadow(0 0 6px rgba(255,255,255,0.25)); }
.weapon-card .w-name { font-size:14px; font-weight:bold; color:#ffdd88; }
.weapon-card .w-desc { font-size:11px; color:#777; margin-top:4px; line-height:1.4; }

.upgrade-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0; }
@media(max-width:600px){ .upgrade-grid{grid-template-columns:1fr;} }
.upgrade-card { background:rgba(20,28,55,0.95); border:2px solid #2a3a66; border-radius:12px; padding:14px; text-align:center; }
.upgrade-card .u-name { font-size:14px; font-weight:bold; color:#ffdd88; }
.upgrade-card .u-desc { font-size:12px; color:#888; margin:6px 0; }
.upgrade-card .u-level { font-size:12px; color:#66ccff; margin-bottom:6px; }
.upgrade-card .u-cost { font-size:13px; color:#ffcc00; font-weight:bold; }

.stat-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.stat-row span:first-child { color:#777; }
.stat-row span:last-child { color:#66ccff; font-weight:bold; }

.gold-display {
  position:fixed; top:10px; right:10px; z-index:100;
  background:rgba(0,0,0,0.75); border:2px solid #dd9900; border-radius:22px;
  padding:7px 18px; font-size:17px; font-weight:bold; color:#ffcc00;
  text-shadow:0 0 12px rgba(255,204,0,0.5);

.difficulty-select { display:flex; gap:12px; justify-content:center; margin:14px 0; flex-wrap:wrap; }
.diff-btn { padding:9px 22px; border-radius:24px; border:2px solid #333; background:rgba(25,35,60,0.9); color:#888; cursor:pointer; font-weight:bold; transition:all 0.2s; }
.diff-btn.selected { border-color:#ffcc00; background:rgba(70,55,15,0.95); color:#fff; box-shadow:0 0 20px rgba(255,204,0,0.35); }

.talent-options { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:18px 0; }
.talent-card {
  background:rgba(35,25,65,0.96); border:2px solid #7744cc; border-radius:16px;

.talent-card:hover { transform:translateY(-6px) scale(1.03); border-color:#aa66ff; box-shadow:0 16px 45px rgba(136,85,204,0.4); }
.talent-card .t-type { font-size:11px; color:#ffaa66; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
.talent-card .t-name { font-size:16px; font-weight:bold; color:#ddbbff; margin-bottom:6px; }
.talent-card .t-desc { font-size:12px; color:#aaa; line-height:1.5; }
.talent-card .t-rank { font-size:11px; color:#ffaa66; margin-top:8px; }

#mobileControls { display:none; position:fixed; bottom:0; left:0; width:100%; height:180px; z-index:60; pointer-events:none; }
.joystick-area { position:absolute; bottom:20px; left:20px; width:140px; height:140px; pointer-events:auto; }
.joystick-base { position:absolute; width:100%; height:100%; border:3px solid rgba(255,255,255,0.2); border-radius:50%; background:rgba(255,255,255,0.03); }
.joystick-knob { position:absolute; top:50%; left:50%; width:55px; height:55px; transform:translate(-50%,-50%); background:rgba(68,136,255,0.55); border-radius:50%; border:2px solid #66aaff; box-shadow:0 0 20px rgba(68,136,255,0.4); }
.skill-btn { position:absolute; bottom:35px; right:35px; width:90px; height:90px; border-radius:50%; background:rgba(255,50,50,0.55); border:3px solid #ff4444; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; color:#fff; box-shadow:0 0 25px rgba(255,50,50,0.35); }
.skill-btn.cooldown { background:rgba(50,50,50,0.5); border-color:#444; color:#777; }

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:rgba(0,0,0,0.3); }
::-webkit-scrollbar-thumb { background:#3366dd; border-radius:3px; }
</style>

function updateJoystick(t){
  const maxR=38;
  let dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
  joyKnob.style.left=(65+dx)+'px';joyKnob.style.top=(65+dy)+'px';
  joystick.dx=dx/maxR;joystick.dy=dy/maxR;
}

function getWaveConfig(wave){
  const d=game.diffMul;
  const types=ENEMY_TYPES.slice(0,Math.min(3+Math.floor(wave/3),ENEMY_TYPES.length));
  const count=Math.min(5+wave*2.5,40);
  const hpMul=Math.pow(1.09,wave-1)*d.hp;
  const spdMul=Math.min(1+wave*0.035,2.5)*d.speed;
  return{types,count,hpMul,spdMul};
}

function spawnEnemy(forceType){
  const cfg=getWaveConfig(game.wave);
  const type=forceType||cfg.types[Math.floor(Math.random()*cfg.types.length)];
  const side=Math.floor(Math.random()*3);
  let x,y;
  if(side===0){x=Math.random()*W;y=-40;}
  else if(side===1){x=-40;y=Math.random()*H*0.5;}
  else{x=W+40;y=Math.random()*H*0.5;}
  const e={
    x,y,r:type.r,hp:type.hp*cfg.hpMul,maxHp:type.hp*cfg.hpMul,
    speed:type.speed*cfg.spdMul,dmg:type.dmg*game.diffMul.dmg,
    score:type.score,color:type.color,pattern:type.pattern,
    fireRate:type.fireRate,bulletSpeed:type.bulletSpeed*game.diffMul.bullet,

    angle:Math.PI/2,type:type.name,elite:false,status:{burn:0,poison:0,bleed:0,stun:0}

  game.enemies.push(e);

function update(dt){
  if(!game)return;
  if(game.state==='dead'||game.state==='victory')return;
  globalTime+=dt;
  if(game.state!=='playing'&&game.state!=='talent')return;
  const p=game.player;

  // MOUSE SLIDE CONTROL
  let tx,ty;
  if(joystick.active){tx=p.x+joystick.dx*400;ty=p.y+joystick.dy*400;}
  else{tx=mouse.x;ty=mouse.y;}
  const dx=tx-p.x,dy=ty-p.y;
  const dist=Math.hypot(dx,dy);
  if(dist>2){
    const moveSpeed=p.speed*(dt/16);
    const ratio=Math.min(1,moveSpeed/dist);
    p.x+=dx*ratio;p.y+=dy*ratio;
  }
  p.x=Math.max(p.r,Math.min(W-p.r,p.x));
  p.y=Math.max(p.r,Math.min(H-p.r,p.y));

  // Weapon switch
  for(let i=1;i<=8;i++){
    if(keys['Digit'+i]&&i<=p.weapons.length){
      p.weaponIdx=i-1;
      addText(p.x,p.y-40,p.weapons[i-1].name,p.weapons[i-1].color,18,1000);
      for(let k=0;k<10;k++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,2+Math.random()*4,p.weapons[i-1].color,600);
    }
  }

  // Fire
  p.fireCooldown-=dt;
  if(p.fireCooldown<=0){
    fireWeapon();
    const w=p.weapons[p.weaponIdx];
    let frMul=1;
    p.commonTalents.forEach(t=>{if(t.effect==='firerate_all')frMul*=1-t.value;});
    const wt=p.weaponTalents[w.id]||[];
    wt.forEach(t=>{if(t.effect==='firerate')frMul*=1-t.value;});
    p.fireCooldown=w.fireRate*p.fireRateMul*frMul/(1+meta.upgrades.fireRate*0.06);
  }
  if(keys['Space']&&p.skillCooldown<=0)activateSkill();

  // Skill
  p.skillCooldown-=dt;
  if(p.skillActive&&Date.now()>p.skillEndTime){
    p.skillActive=false;
    let cdMul=1;
    p.commonTalents.forEach(t=>{if(t.effect==='cd')cdMul*=1-t.value;});
    p.skillCooldown=Math.max(0,12000*cdMul);
  }

  // Passive effects
  p.regen=0;p.shieldRegen=0;p.lifeSteal=0;p.dodgeChance=0;
  p.commonTalents.forEach(t=>{
    if(t.effect==='regen')p.regen+=t.value;
    if(t.effect==='dodge')p.dodgeChance+=t.value;
  });
  p.weapons.forEach(w=>{
    const wt=p.weaponTalents[w.id]||[];
    wt.forEach(t=>{if(t.effect==='lifesteal')p.lifeSteal+=t.value;});
  });

  if(p.regen>0)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*p.regen*dt/1000);
  if(p.shieldRegen>0)p.shield=Math.min(p.maxShield,p.shield+p.shieldRegen*dt/1000);
  if(p.invincible>0)p.invincible-=dt;
  if(p.comboTime>0){p.comboTime-=dt;if(p.comboTime<=0)p.combo=0;}

  // Wave
  if(!game.boss){
    const cfg=getWaveConfig(game.wave);
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0&&game.waveSpawned<cfg.count){
      spawnEnemy();
      game.waveSpawned++;
      game.spawnTimer=500*game.diffMul.spawn/(1+game.wave*0.015);
    }
    const living=game.enemies.filter(e=>e!==game.boss).length;
    if(game.waveSpawned>=cfg.count&&living===0){
      game.wave++;game.waveSpawned=0;
      addText(W/2,H/2,`第 ${game.wave} 波`,'#66ccff',38,2000);
      screenShake=6;
      for(let i=0;i<25;i++)spawnParticle(W/2,H/2,Math.random()*Math.PI*2,4+Math.random()*7,'#66ccff',1200);
      if(game.wave%5===0&&game.wave<50)spawnBoss(true);
      else if(game.wave%10===0)spawnBoss(false);
      else if(game.wave===50)spawnBoss(false);
      if(game.wave===game.nextTalentWave)showTalentSelect();
    }
  }

  if(game.boss)updateBoss(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateEBullets(dt);
  updateParticles(dt);
  updateDrops(dt);
  updateTexts(dt);
  updateMeteors(dt);

  game.stars.forEach(s=>{s.y+=s.sp*(1+s.layer*0.5);if(s.y>H){s.y=0;s.x=Math.random()*W;}});
  game.nebulas.forEach(n=>{n.x+=n.dx;n.y+=n.dy;if(n.x<-n.r)n.x=W+n.r;if(n.x>W+n.r)n.x=-n.r;if(n.y<-n.r)n.y=H+n.r;if(n.y>H+n.r)n.y=-n.r;});

  if(screenShake>0)screenShake*=0.9;
  if(screenShake<0.3)screenShake=0;
  if(game.screenFlash>0)game.screenFlash-=dt*0.001;
  if(slowMotion>0)slowMotion-=dt;

  document.getElementById('goldDisplay').textContent=`💰 ${Math.floor(game.gold)}`;
  if(p.hp<=0)handleDeath();
}

function getWeaponDamage(w){
  const p=game.player;
  let dmg=w.damage*(1+w.level*0.3);
  // Common talents
  p.commonTalents.forEach(t=>{if(t.effect==='damage_all')dmg*=1+t.value;});
  // Weapon specific damage
  const wt=p.weaponTalents[w.id]||[];
  wt.forEach(t=>{if(t.effect==='damage')dmg*=1+t.value;});
  // Meta upgrades
  dmg*=p.dmgMul*(1+meta.upgrades.damage*0.10);
  return Math.max(1,dmg);
}

function fireWeapon(){
  const p=game.player;
  const w=p.weapons[p.weaponIdx];
  const baseDmg=getWeaponDamage(w);
  let count=w.count;
  let pierce=w.pierce;
  let spread=w.spread;
  let speed=w.speed;
  let size=(w.melee?p.r+30:6+w.level*1.5);
  let homing=w.homing;
  let life=w.life;

  const wt=p.weaponTalents[w.id]||[];
  wt.forEach(t=>{
    if(t.effect==='count')count+=t.value;
    if(t.effect==='pierce')pierce+=t.value;
    if(t.effect==='spread')spread*=1+t.value;
    if(t.effect==='speed')speed*=1+t.value;
    if(t.effect==='size')size*=1+t.value;
    if(t.effect==='homing')homing=Math.min(1,homing+t.value);
    if(t.effect==='life')life*=1+t.value;
  });

  const crit=Math.random()<p.critChance;
  let finalDmg=baseDmg*(crit?2.5:1);

  // Melee
  if(w.melee){
    const angle=Math.atan2(mouse.y-p.y,mouse.x-p.x);
    let swingCount=3;
    wt.forEach(t=>{if(t.effect==='spin')swingCount=8;});
    for(let i=0;i<swingCount;i++){
      const a=angle+(i-swingCount/2)*0.35;
      game.bullets.push({
        x:p.x,y:p.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,
        r:size,dmg:finalDmg,color:w.color,life:life*1000,pierce,homing:0,
        isMelee:true,angle:a,crit,bounce:0,trail:[],born:globalTime,weaponId:w.id
      });
    }
    return;
  }

  const baseAngle=w.homing>0?Math.random()*Math.PI*2:Math.atan2(mouse.y-p.y,mouse.x-p.x);

  for(let i=0;i<count;i++){
    let angle=baseAngle;
    if(w.ring)angle=(Math.PI*2/count)*i;
    else if(count>1&&w.homing===0)angle=baseAngle-spread*(count-1)/2+spread*i;
    else if(w.homing>0)angle=baseAngle+(Math.random()-0.5)*spread;

    game.bullets.push({
      x:p.x+Math.cos(angle)*24,y:p.y+Math.sin(angle)*24,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      r:size,dmg:finalDmg,color:w.color,life:life*1000,
      pierce,homing,weaponId:w.id,
      crit,bounce:0,trail:[],born:globalTime
    });
  }

  // Ult double shot
  if(p.skillActive&&w.id!==7){
    setTimeout(()=>{
      if(!game||game.state!=='playing')return;
      for(let i=0;i<count;i++){
        let angle=baseAngle;
        if(w.ring)angle=(Math.PI*2/count)*i+0.3;
        else if(count>1&&w.homing===0)angle=baseAngle-spread*(count-1)/2+spread*i;
        else if(w.homing>0)angle=baseAngle+(Math.random()-0.5)*spread;
        game.bullets.push({
          x:p.x+Math.cos(angle)*24,y:p.y+Math.sin(angle)*24,
          vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
          r:size,dmg:finalDmg*0.7,color:w.color,life:life*1000,
          pierce,homing,weaponId:w.id,crit,bounce:0,trail:[],born:globalTime
        });
      }
    },80);
  }
}

function activateSkill(){
  const p=game.player;
  if(p.skillCooldown>0||p.skillActive)return;
  p.skillActive=true;
  p.skillEndTime=Date.now()+5000;
  addText(p.x,p.y-50,'⚡ 大招释放!','#ffdd00',24,1500);
  screenShake=15;slowMotion=300;

  const w=p.weapons[p.weaponIdx];
  const wt=p.weaponTalents[w.id]||[];

  // Weapon-specific ult
  if(w.id===0){ // Scatter - shockwave
    for(let ring=0;ring<4;ring++){
      setTimeout(()=>{
        if(!game)return;
        for(let i=0;i<40;i++){
          const a=(Math.PI*2/40)*i;
          game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*(7+ring*2),vy:Math.sin(a)*(7+ring*2),r:8,dmg:getWeaponDamage(w)*(3+ring),color:ring===0?'#ffdd44':ring===1?'#ff8844':ring===2?'#ff4444':'#ff2222',life:800,pierce:99,homing:0,isSkill:true,trail:[],born:globalTime,weaponId:w.id});
        }
      },ring*100);
    }
  }else if(w.id===1){ // Laser - rotating beams
    for(let i=0;i<6;i++){
      const a=(Math.PI*2/6)*i;
      game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,r:6,dmg:getWeaponDamage(w)*4,color:'#22ff77',life:3000,pierce:99,homing:0,isLaser:true,isSkill:true,trail:[],born:globalTime,weaponId:w.id,rotSpeed:0.03});
    }
  }else if(w.id===2){ // Homing - missile storm
    for(let i=0;i<20;i++){
      const a=Math.random()*Math.PI*2;
      game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,r:7,dmg:getWeaponDamage(w)*2.5,color:'#ffaa22',life:4000,pierce:3,homing:0.08,isSkill:true,trail:[],born:globalTime,weaponId:w.id});
    }
  }else if(w.id===3){ // Shotgun - triple ring
    for(let round=0;round<3;round++){
      setTimeout(()=>{
        if(!game)return;
        for(let i=0;i<16;i++){
          const a=(Math.PI*2/16)*i+round*0.2;
          game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,r:5,dmg:getWeaponDamage(w)*2,color:'#ff2222',life:1000,pierce:5,homing:0,isSkill:true,trail:[],born:globalTime,weaponId:w.id});
        }
      },round*150);
    }
  }else if(w.id===4){ // Ring - vortex
    for(let i=0;i<30;i++){
      const a=(Math.PI*2/30)*i;
      game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,r:6,dmg:getWeaponDamage(w)*2.5,color:'#9944ff',life:5000,pierce:5,homing:0,isSkill:true,trail:[],born:globalTime,weaponId:w.id,accel:0.05,angle:a});
    }
  }else if(w.id===5){ // Sniper - giant shots
    for(let i=0;i<3;i++){
      const a=Math.atan2(mouse.y-p.y,mouse.x-p.x)+i*0.15;
      game.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*20,vy:Math.sin(a)*20,r:15,dmg:getWeaponDamage(w)*8,color:'#2299ff',life:3000,pierce:99,homing:0,isSkill:true,trail:[],born:globalTime,weaponId:w.id});
    }
  }else if(w.id===6){ // Missile - nuke
    game.bullets.push({x:p.x,y:p.y,vx:0,vy:-3,r:25,dmg:getWeaponDamage(w)*10,color:'#ff6622',life:3000,pierce:0,homing:0,isSkill:true,isNuke:true,trail:[],born:globalTime,weaponId:w.id});
  }else if(w.id===7){ // Melee - frenzy
    // Handled in fireWeapon via skillActive check
  }

  for(let i=0;i<40;i++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,3+Math.random()*6,'#ffdd44',1000);
}

function updateEnemies(dt){
  game.enemies.forEach((e,ei)=>{
    if(e===game.boss)return;
    // Status effects
    if(e.status.burn>0){e.hp-=0.8*dt/16;e.status.burn-=dt/1000;}
    if(e.status.poison>0){e.hp-=0.5*dt/16;e.status.poison-=dt/1000;}
    if(e.status.bleed>0){e.hp-=0.6*dt/16;e.status.bleed-=dt/1000;}
    if(e.status.stun>0){e.status.stun-=dt/1000;return;}

    const dx=game.player.x-e.x,dy=game.player.y-e.y;
    const dist=Math.hypot(dx,dy);
    e.x+=(dx/dist||0)*e.speed*(dt/16);
    e.y+=(dy/dist||0)*e.speed*(dt/16);
    e.angle=Math.atan2(dy,dx);
    e.fireTimer-=dt;
    if(e.fireTimer<=0&&dist<600){
      fireEnemyPattern(e);
      e.fireTimer=e.fireRate;
    }
    if(dist<e.r+game.player.r&&game.player.invincible<=0){
      damagePlayer(e.dmg);
      e.hp-=30;
      spawnParticle(e.x,e.y,Math.atan2(e.y-game.player.y,e.x-game.player.x),4,'#ff4444',500);
      if(e.hp<=0)killEnemy(e,ei);
    }
  });
}

function fireEnemyPattern(e){
  const px=game.player.x,py=game.player.y;
  const angle=Math.atan2(py-e.y,px-e.x);
  switch(e.pattern){
    case 'aim':spawnEBullet(e.x,e.y,angle,e.bulletSpeed,e.dmg,'#ff4444');break;
    case 'spread':
      for(let i=-1;i<=1;i++)spawnEBullet(e.x,e.y,angle+i*0.3,e.bulletSpeed,e.dmg*0.65,'#ffaa22');break;
    case 'ring':
      for(let i=0;i<e.bulletCount;i++)spawnEBullet(e.x,e.y,(Math.PI*2/e.bulletCount)*i,e.bulletSpeed,e.dmg*0.5,'#aa3333');break;
    case 'burst':
      for(let i=0;i<e.bulletCount;i++)spawnEBullet(e.x,e.y,angle+(Math.random()-0.5)*0.8,e.bulletSpeed*(0.8+Math.random()*0.4),e.dmg*0.45,'#ffdd44');break;
    case 'mix':
      spawnEBullet(e.x,e.y,angle,e.bulletSpeed,e.dmg,'#ff3388',0.35);
      for(let i=-1;i<=1;i++)spawnEBullet(e.x,e.y,angle+i*0.4,e.bulletSpeed*0.85,e.dmg*0.55,'#ff3388');break;
    case 'accel':
      for(let i=0;i<e.bulletCount;i++){
        const a=angle+(i-e.bulletCount/2)*0.18;
        game.eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,r:5,dmg:e.dmg*0.5,color:'#aa55ff',life:4000,accel:0.1,angle:a,trail:[]});
      }break;
    case 'laser':
      for(let i=-2;i<=2;i++)spawnEBullet(e.x,e.y,angle+i*0.25,e.bulletSpeed*1.7,e.dmg*0.85,'#33ffaa');
      game.flashTexts.push({x1:e.x,y1:e.y,x2:px,y2:py,life:500,color:'#ff0000'});break;
    case 'homing':
      for(let i=0;i<e.bulletCount;i++){
        const a=angle+(Math.random()-0.5)*0.6;
        game.eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.bulletSpeed*0.7,vy:Math.sin(a)*e.bulletSpeed*0.7,r:6,dmg:e.dmg*0.65,color:'#ff77cc',life:3500,homing:0.04,trail:[]});
      }break;
  }
}

function spawnEBullet(x,y,angle,speed,dmg,color,homing){
  game.eBullets.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:5,dmg:Math.abs(dmg),color,life:4000,homing:homing||0,accel:0,trail:[]});
}

function updateBoss(dt){
  const b=game.boss;
  b.phaseTimer+=dt;
  b.x+=Math.sin(globalTime*0.001)*b.speed*(dt/16);
  b.x=Math.max(b.r,Math.min(W-b.r,b.x));
  const hpRatio=b.hp/b.maxHp;
  if(!b.isMini){
    if(hpRatio<0.28&&b.phase<2){b.phase=2;b.fireRate*=0.6;addText(W/2,220,'🔥 绝望模式!','#ff0000',34,3000);screenShake=30;slowMotion=800;}
    else if(hpRatio<0.55&&b.phase<1){b.phase=1;b.fireRate*=0.75;addText(W/2,220,'⚡ 狂暴模式!','#ff4444',30,3000);screenShake=18;}
  }
  b.fireTimer-=dt;
  if(b.fireTimer<=0){bossAttack(b);b.fireTimer=b.fireRate;}
  if(b.hp<=0)killBoss();
}

function bossAttack(b){
  const px=game.player.x,py=game.player.y;
  const angle=Math.atan2(py-b.y,px-b.x);
  b.attackIdx=(b.attackIdx+1)%6;
  const idx=b.attackIdx;
  const mult=b.isMini?1:(1+b.phase*0.5);
  if(idx===0){
    const n=Math.floor((b.isMini?16:28)*mult);
    for(let i=0;i<n;i++)spawnEBullet(b.x,b.y,(Math.PI*2/n)*i,b.bulletSpeed,b.dmg*0.45,b.color);
  }else if(idx===1){
    const n=Math.floor((b.isMini?7:12)*mult);
    for(let i=0;i<n;i++)spawnEBullet(b.x,b.y,angle+(i-n/2)*0.18,b.bulletSpeed,b.dmg*0.55,b.color);
  }else if(idx===2){
    const layers=b.isMini?3:5;
    for(let l=0;l<layers;l++)for(let i=0;i<10;i++)spawnEBullet(b.x,b.y,globalTime*0.005+(Math.PI*2/10)*i+l*0.3,b.bulletSpeed*(0.6+l*0.1),b.dmg*0.35,b.color);
  }else if(idx===3){
    const n=Math.floor((b.isMini?6:12)*mult);
    for(let i=0;i<n;i++)game.eBullets.push({x:b.x,y:b.y,vx:Math.cos(Math.random()*Math.PI*2)*2.5,vy:Math.sin(Math.random()*Math.PI*2)*2.5,r:6,dmg:b.dmg*0.45,color:b.color,life:4000,homing:0.04,trail:[]});
  }else if(idx===4){
    const n=Math.floor((b.isMini?12:24)*mult);
    for(let i=0;i<n;i++){const a=angle+(Math.random()-0.5)*2;game.eBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8,r:5,dmg:b.dmg*0.35,color:b.color,life:4000,accel:0.07,angle:a,trail:[]});}
  }else if(idx===5){
    for(let i=0;i<16;i++)spawnEBullet(b.x,b.y,(Math.PI*2/16)*i,b.bulletSpeed*0.85,b.dmg*0.3,b.color);
    for(let i=0;i<5;i++)spawnEBullet(b.x,b.y,angle+(i-2)*0.25,b.bulletSpeed*1.3,b.dmg*0.7,b.color);
  }
}

function updateBullets(dt){
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i];
    b.life-=dt;
    if(b.life<=0){game.bullets.splice(i,1);continue;}
    if(b.trail){b.trail.push({x:b.x,y:b.y});if(b.trail.length>12)b.trail.shift();}

    if(b.homing>0){
      let nearest=null,nd=Infinity;
      game.enemies.forEach(e=>{const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<nd&&d<500){nd=d;nearest=e;}});
      if(nearest){
        const ta=Math.atan2(nearest.y-b.y,nearest.x-b.x);
        const ca=Math.atan2(b.vy,b.vx);
        let da=ta-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
        const na=ca+da*b.homing;
        const s=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;
      }
    }
    if(b.accel>0){b.vx+=Math.cos(b.angle)*b.accel;b.vy+=Math.sin(b.angle)*b.accel;}
    if(b.rotSpeed){b.vx=Math.cos(Math.atan2(b.vy,b.vx)+b.rotSpeed)*Math.hypot(b.vx,b.vy);b.vy=Math.sin(Math.atan2(b.vy,b.vx)+b.rotSpeed)*Math.hypot(b.vx,b.vy);}

    b.x+=b.vx*(dt/16);b.y+=b.vy*(dt/16);

    if(b.isMelee){
      b.x=game.player.x+Math.cos(b.angle)*40;
      b.y=game.player.y+Math.sin(b.angle)*40;
    }

    if(b.x<-70||b.x>W+70||b.y<-70||b.y>H+70){
      if(b.bounce>0){if(b.x<0||b.x>W)b.vx*=-1;if(b.y<0||b.y>H)b.vy*=-1;b.bounce--;}
      else{game.bullets.splice(i,1);continue;}
    }

    let hit=false;
    for(let j=game.enemies.length-1;j>=0;j--){
      const e=game.enemies[j];
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        const isBoss=e===game.boss;
        let dmg=Math.abs(b.dmg);
        dmg*=(isBoss?game.player.bossDmg:1);
        // Common damage boost
        game.player.commonTalents.forEach(t=>{if(t.effect==='damage_all')dmg*=1+t.value;});
        e.hp-=dmg;

        // Life steal
        if(game.player.lifeSteal>0)game.player.hp=Math.min(game.player.maxHp,game.player.hp+dmg*game.player.lifeSteal);

        // Crit effect
        if(b.crit){
          addText(e.x,e.y-30,'暴击!','#ff66ff',18,700);
          screenShake=5;
          for(let k=0;k<8;k++)spawnParticle(e.x,e.y,Math.random()*Math.PI*2,3+Math.random()*5,'#ff66ff',600);
          game.particles.push({x:e.x,y:e.y,r:2,maxR:30,life:400,color:'#ff66ff',type:'shock'});
        }

        // Status effects from weapon talents
        const wt=game.player.weaponTalents[b.weaponId]||[];
        wt.forEach(t=>{
          if(t.effect==='burn')e.status.burn=Math.max(e.status.burn,t.value);
          if(t.effect==='poison')e.status.poison=Math.max(e.status.poison,t.value);
          if(t.effect==='bleed')e.status.bleed=Math.max(e.status.bleed,t.value);
          if(t.effect==='stun')e.status.stun=Math.max(e.status.stun,t.value);
          if(t.effect==='knock'){e.x+=b.vx*2;e.y+=b.vy*2;}
        });

        // Explosive
        if(b.isExplosive||b.isNuke){
          const r=b.isNuke?120:game.player.explodeRadius*(1+(game.player.talentCounts['爆裂弹头']||0)*0.3);
          game.enemies.forEach(en=>{if(Math.hypot(en.x-b.x,en.y-b.y)<r){en.hp-=Math.abs(b.dmg)*0.6;if(en.hp<=0&&en!==e)killEnemy(en,game.enemies.indexOf(en));}});
          for(let k=0;k<20;k++)spawnParticle(b.x,b.y,Math.random()*Math.PI*2,4+Math.random()*5,'#ff6622',800);
          game.particles.push({x:b.x,y:b.y,r:5,maxR:r,life:700,color:'#ff6622',type:'explosion'});
          if(b.isNuke)screenShake=20;
        }

        // Split on hit
        wt.forEach(t=>{
          if(t.effect==='split'&&Math.random()<0.4){
            for(let s=0;s<t.value;s++){
              const a=Math.random()*Math.PI*2;
              game.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,r:4,dmg:Math.abs(b.dmg)*0.4,color:b.color,life:1500,pierce:1,homing:0.6,trail:[],born:globalTime,weaponId:b.weaponId});
            }
          }
        });

        b.pierce--;
        if(b.pierce<0){hit=true;break;}
        if(e.hp<=0){if(isBoss)killBoss();else killEnemy(e,j);}
      }
    }
    if(hit)game.bullets.splice(i,1);
  }
}

function updateEBullets(dt){
  for(let i=game.eBullets.length-1;i>=0;i--){
    const b=game.eBullets[i];
    b.life-=dt;
    if(b.life<=0){game.eBullets.splice(i,1);continue;}
    if(b.trail){b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();}
    if(b.accel>0){b.vx+=Math.cos(b.angle)*b.accel;b.vy+=Math.sin(b.angle)*b.accel;}
    if(b.homing>0){
      const ta=Math.atan2(game.player.y-b.y,game.player.x-b.x);
      const ca=Math.atan2(b.vy,b.vx);
      let da=ta-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      const na=ca+da*b.homing;
      const s=Math.hypot(b.vx,b.vy);
      b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;
    }
    b.x+=b.vx*(dt/16);b.y+=b.vy*(dt/16);
    const p=game.player;
    if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r&&p.invincible<=0){
      damagePlayer(Math.abs(b.dmg));game.eBullets.splice(i,1);
      for(let k=0;k<6;k++)spawnParticle(b.x,b.y,Math.random()*Math.PI*2,2+Math.random()*4,'#ff4444',500);
    }else if(b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){
      game.eBullets.splice(i,1);
    }
  }
}

function damagePlayer(dmg){
  const p=game.player;
  if(Math.random()<p.dodgeChance){addText(p.x,p.y-35,'闪避!','#88ff88',18,800);return;}
  let reduction=1;
  p.commonTalents.forEach(t=>{if(t.effect==='armor')reduction*=1-t.value;});
  let actual=Math.abs(dmg)*reduction;
  if(p.shield>0){const absorb=Math.min(p.shield,actual);p.shield-=absorb;actual-=absorb;}
  p.hp-=actual;
  p.invincible=500;
  game.screenFlash=1.5;
  screenShake=10;
  for(let i=0;i<8;i++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,3+Math.random()*4,'#ff4444',600);

  if(p.hp<=0){
    let hasRevive=false;
    p.commonTalents.forEach(t=>{if(t.effect==='revive')hasRevive=true;});
    if(hasRevive&&p.revives===0){
      p.revives=1;
      p.hp=p.maxHp*0.5;
      p.shield=p.maxShield*0.4;
      p.invincible=3000;
      addText(p.x,p.y-60,'🔥 涅槃重生!','#ff4444',28,3000);
      screenShake=25;slowMotion=600;
      for(let i=0;i<50;i++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,5+Math.random()*6,'#ff4444',1500);
    }
  }
}

function killEnemy(e,idx){
  game.enemies.splice(idx,1);
  game.kills++;meta.totalKills++;
  const p=game.player;
  p.combo++;p.comboTime=3500;
  let comboMax=3.5;
  p.commonTalents.forEach(t=>{if(t.effect==='combo')comboMax=5;});
  const comboMul=Math.min(1+p.combo*0.07,comboMax);
  const baseScore=e.score*game.diffMul.score*comboMul;
  const baseGold=e.score*0.2*game.diffMul.gold*p.goldMul;
  game.score+=Math.floor(baseScore);
  game.gold+=baseGold;
  addText(e.x,e.y,`+${Math.floor(baseScore)}`,'#ffcc00',16,1000);

  // EPIC death
  for(let i=0;i<16;i++)spawnParticle(e.x,e.y,Math.random()*Math.PI*2,3+Math.random()*6,e.color,1000+Math.random()*600);
  for(let i=0;i<10;i++)spawnParticle(e.x,e.y,Math.random()*Math.PI*2,1.5+Math.random()*3,'#ffffff',700);
  game.particles.push({x:e.x,y:e.y,r:3,maxR:60,life:600,color:e.color,type:'shock'});
  game.particles.push({x:e.x,y:e.y,r:2,maxR:35,life:400,color:'#ffffff',type:'shock'});

  if(p.combo>5)screenShake=Math.min(p.combo,14);

  // Death proc
  const wt=p.weaponTalents[p.weapons[p.weaponIdx].id]||[];
  wt.forEach(t=>{
    if(t.effect==='proc'&&Math.random()<t.value){
      for(let i=0;i<6;i++){const a=(Math.PI*2/6)*i;game.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,r:5,dmg:20,color:'#ff6622',life:800,pierce:2,homing:0,trail:[],born:globalTime,weaponId:p.weapons[p.weaponIdx].id});}
    }
    if(t.effect==='chain'&&Math.random()<t.value){
      game.enemies.forEach(en=>{if(Math.hypot(en.x-e.x,en.y-e.y)<100)en.hp-=40;});
      game.particles.push({x:e.x,y:e.y,r:5,maxR:100,life:500,color:'#ff6622',type:'explosion'});
    }
  });

  const luck=meta.upgrades.luck*0.06;
  if(Math.random()<0.2+luck){
    const types=['hp','shield','gold','weapon'];
    const type=types[Math.floor(Math.random()*types.length)];
    game.drops.push({x:e.x,y:e.y,r:11,type,life:12000,vx:(Math.random()-0.5)*1.5,vy:(Math.random()-0.5)*1.5});
  }
}

function killBoss(){
  const b=game.boss;
  game.boss=null;
  game.kills++;meta.totalKills++;
  const p=game.player;
  let comboMax=3.5;
  p.commonTalents.forEach(t=>{if(t.effect==='combo')comboMax=5;});
  const comboMul=Math.min(1+p.combo*0.07,comboMax);
  const baseScore=b.score*game.diffMul.score*comboMul;
  const baseGold=b.score*0.3*game.diffMul.gold*p.goldMul;
  game.score+=Math.floor(baseScore);
  game.gold+=baseGold;
  addText(W/2,H/2-40,`☠️ ${b.name} 陨落!`,'#ff4444',38,3500);
  addText(W/2,H/2+25,`+${Math.floor(baseScore)} 分`,'#ffcc00',26,3500);
  screenShake=35;slowMotion=1500;
  for(let i=0;i<100;i++)spawnParticle(b.x,b.y,Math.random()*Math.PI*2,4+Math.random()*8,b.color,2000+Math.random()*1000);
  for(let i=0;i<15;i++)game.particles.push({x:b.x,y:b.y,r:3,maxR:120+i*30,life:800+i*150,color:b.color,type:'shock'});
  if(b.isFinal){
    game.state='victory';
    setTimeout(()=>showGameOver(true),3000);
  }
}

function spawnParticle(x,y,angle,speed,color,life){
  game.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color,life,maxLife:life,r:2+Math.random()*4,type:'normal',rot:Math.random()*Math.PI*2,rotSpd:(Math.random()-0.5)*0.3});
}

function updateParticles(dt){
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.life-=dt;
    if(p.life<=0){game.particles.splice(i,1);continue;}
    if(p.type==='normal'){
      p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);
      p.vx*=0.96;p.vy*=0.96;
      p.rot+=p.rotSpd*(dt/16);
    }else if(p.type==='shock'){
      p.r+=(p.maxR-p.r)*0.1*(dt/16);
    }else if(p.type==='explosion'){
      p.r+=(p.maxR-p.r)*0.12*(dt/16);
    }
  }
}

function updateMeteors(dt){
  if(Math.random()<0.003){
    const x=Math.random()*W;
    game.meteors.push({x,y:-20,vx:(Math.random()-0.5)*3,vy:4+Math.random()*5,r:1+Math.random()*2.5,life:4000,color:'#ffffff'});
  }
  for(let i=game.meteors.length-1;i>=0;i--){
    const m=game.meteors[i];
    m.life-=dt;m.x+=m.vx*(dt/16);m.y+=m.vy*(dt/16);
    if(m.y>H+30||m.life<=0)game.meteors.splice(i,1);
  }
}

function updateDrops(dt){
  for(let i=game.drops.length-1;i>=0;i--){
    const d=game.drops[i];
    d.life-=dt;
    if(d.life<=0){game.drops.splice(i,1);continue;}
    d.x+=d.vx*(dt/16);d.y+=d.vy*(dt/16);
    const p=game.player;
    const dist=Math.hypot(d.x-p.x,d.y-p.y);
    const range=p.pickupRange*(1+(p.talentCounts['引力场']||0)*0.5);
    if(dist<range){
      const angle=Math.atan2(p.y-d.y,p.x-d.x);
      d.x+=Math.cos(angle)*8*(dt/16);d.y+=Math.sin(angle)*8*(dt/16);
    }
    if(dist<d.r+p.r){
      if(d.type==='hp'){p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.25);addText(d.x,d.y,'+HP','#44ff44',16,700);}
      else if(d.type==='shield'){p.shield=Math.min(p.maxShield,p.shield+50);addText(d.x,d.y,'+护盾','#4488ff',16,700);}
      else if(d.type==='gold'){game.gold+=20;addText(d.x,d.y,'+20💰','#ffcc00',16,700);}
      else if(d.type==='weapon'){
        const avail=WEAPONS.filter(w=>!p.weapons.find(pw=>pw.id===w.id));
        if(avail.length>0){
          const nw=avail[Math.floor(Math.random()*avail.length)];
          p.weapons.push({...nw,level:1,xp:0});
          p.weaponTalents[nw.id]=[];
          addText(d.x,d.y,`获得 ${nw.name}!`,'#ffcc00',20,1800);
        }else{
          p.weapons.forEach(w=>w.level=Math.min(5,w.level+1));
          addText(d.x,d.y,'全武器升级!','#ffaa00',20,1800);
        }
      }
      for(let k=0;k<10;k++)spawnParticle(d.x,d.y,Math.random()*Math.PI*2,2+Math.random()*4,'#ffcc00',600);
      game.drops.splice(i,1);
    }
  }
}

function addText(x,y,text,color,size,life){
  game.texts.push({x,y,text,color,size,life,vy:-1.3,alpha:1});
}

function updateTexts(dt){
  for(let i=game.texts.length-1;i>=0;i--){
    const t=game.texts[i];
    t.life-=dt;t.y+=t.vy*(dt/16);
    t.alpha=Math.min(1,t.life/400);
    if(t.life<=0)game.texts.splice(i,1);
  }
}

function handleDeath(){
  game.state='dead';
  screenShake=30;slowMotion=1000;
  for(let i=0;i<70;i++)spawnParticle(game.player.x,game.player.y,Math.random()*Math.PI*2,5+Math.random()*7,'#ff4444',2500);
  for(let i=0;i<25;i++)game.particles.push({x:game.player.x,y:game.player.y,r:3,maxR:80+i*20,life:700+i*120,color:'#ff4444',type:'shock'});
  setTimeout(()=>showGameOver(false),2500);
}

function showGameOver(victory){
  document.getElementById('goldDisplay').style.display='none';
  document.getElementById('gameOverScreen').style.display='block';
  document.getElementById('goTitle').textContent=victory?'🎉 任务完成！':'💀 任务失败';
  document.getElementById('goTitle').style.color=victory?'#44ff88':'#ff4444';
  document.getElementById('goWave').textContent=game.wave;
  document.getElementById('goKills').textContent=game.kills;
  document.getElementById('goScore').textContent=Math.floor(game.score);
  document.getElementById('goGoldEarned').textContent=Math.floor(game.gold);
  const ratio=game.score/(game.wave*600+1);
  let rank='F';
  if(victory)rank='SSS';
  else if(ratio>12)rank='S';
  else if(ratio>7)rank='A';
  else if(ratio>4)rank='B';
  else if(ratio>2.5)rank='C';
  else if(ratio>1.2)rank='D';
  document.getElementById('goRank').textContent=rank;
  document.getElementById('goRank').style.color=rank==='SSS'?'#ffdd44':rank==='S'?'#ff8844':rank==='A'?'#44ff88':'#aaa';
  meta.gold+=Math.floor(game.gold);
  if(game.wave>meta.highWave)meta.highWave=game.wave;
  saveMeta();
}

function showTalentSelect(){
  game.state='talent';
  document.getElementById('talentScreen').style.display='block';
  document.getElementById('talentWave').textContent=game.wave;
  const w=game.player.weapons[game.player.weaponIdx];
  document.getElementById('talentWeaponName').textContent=w.name;
  document.getElementById('talentWeaponName').style.color=w.color;
  const opts=document.getElementById('talentOptions');
  opts.innerHTML='';
  const choices=[];

  // Weapon-specific talents (not yet taken)
  const wt=game.player.weaponTalents[w.id]||[];
  const wPool=(WEAPON_TALENTS[w.id]||[]).filter(t=>!wt.find(taken=>taken.name===t.name));
  for(let i=0;i<2;i++){
    if(wPool.length===0)break;
    const idx=Math.floor(Math.random()*wPool.length);
    choices.push({...wPool[idx],isWeapon:true,weaponName:w.name,weaponColor:w.color});
    wPool.splice(idx,1);
  }

  // Common talents (not yet taken or repeatable within limit)
  const ct=game.player.commonTalents;
  const cPool=COMMON_TALENTS.filter(t=>{
    const count=ct.filter(c=>c.name===t.name).length;
    return count<1; // Each common talent can only be taken once
  });
  for(let i=0;i<2;i++){
    if(cPool.length===0)break;
    const idx=Math.floor(Math.random()*cPool.length);
    choices.push({...cPool[idx],isWeapon:false});
    cPool.splice(idx,1);
  }

  // Shuffle
  for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}

  choices.forEach(t=>{
    const div=document.createElement('div');
    div.className='talent-card';
    const typeLabel=t.isWeapon?`<div class="t-type">${t.weaponName} 专属</div>`:'<div class="t-type">通用天赋</div>';
    div.innerHTML=`${typeLabel}<div class="t-name">${t.icon||'✨'} ${t.name}</div><div class="t-desc">${t.desc}</div>`;
    div.onclick=()=>selectTalent(t);
    opts.appendChild(div);
  });
  game.nextTalentWave+=5;
}

function selectTalent(t){
  const p=game.player;
  if(t.isWeapon){
    const wId=p.weapons[p.weaponIdx].id;
    if(!p.weaponTalents[wId])p.weaponTalents[wId]=[];
    p.weaponTalents[wId].push(t);
  }else{
    p.commonTalents.push(t);
    if(t.effect==='hp')p.maxHp*=1+t.value;
    if(t.effect==='shield')p.shield=Math.min(p.maxShield,p.shield+t.value);
    if(t.effect==='speed')p.speed*=1+t.value;
    if(t.effect==='pickup')p.pickupRange*=1+t.value;
  }
  document.getElementById('talentScreen').style.display='none';
  game.state='playing';
  addText(game.player.x,game.player.y-50,`✨ ${t.name}`,'#bb88ff',22,2000);
  for(let i=0;i<15;i++)spawnParticle(game.player.x,game.player.y,Math.random()*Math.PI*2,2+Math.random()*5,'#bb88ff',1000);
}

// ==================== RENDER ====================
function draw(){
  ctx.fillStyle='#010108';ctx.fillRect(0,0,W,H);
  if(!game)return;

  ctx.save();
  if(screenShake>0){
    const sx=(Math.random()-0.5)*screenShake;
    const sy=(Math.random()-0.5)*screenShake;
    ctx.translate(sx,sy);
  }

  // Nebulas
  game.nebulas.forEach(n=>{
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,n.c);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
  });

  // Stars with twinkle
  game.stars.forEach(s=>{
    const twinkle=0.4+0.6*Math.sin(globalTime*s.twinkleSpeed+s.x*0.02);
    ctx.fillStyle=`rgba(255,255,255,${s.b*twinkle})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
  });

  // Meteors
  game.meteors.forEach(m=>{
    const alpha=m.life/4000;
    ctx.strokeStyle=`rgba(255,255,255,${alpha*0.9})`;
    ctx.lineWidth=m.r;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*10,m.y-m.vy*10);ctx.stroke();
  });

  // Particles
  game.particles.forEach(p=>{
    if(p.type==='shock'||p.type==='explosion'){
      ctx.strokeStyle=p.color;ctx.lineWidth=p.type==='explosion'?3:2;
      ctx.globalAlpha=Math.min(1,p.life/(p.type==='explosion'?700:500))*0.5;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }else{
      const alpha=p.life/p.maxLife;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.globalAlpha=alpha;
      ctx.beginPath();
      ctx.moveTo(p.r,0);ctx.lineTo(-p.r*0.6,p.r*0.6);ctx.lineTo(-p.r*0.6,-p.r*0.6);
      ctx.closePath();ctx.fill();
      ctx.restore();ctx.globalAlpha=1;
    }
  });

  // Drops
  game.drops.forEach(d=>{
    const colors={hp:'#44ff66',shield:'#4488ff',gold:'#ffcc00',weapon:'#ff66ff'};
    const icons={hp:'♥',shield:'🛡',gold:'💰',weapon:'🔫'};
    ctx.shadowColor=colors[d.type];ctx.shadowBlur=20;
    ctx.fillStyle=colors[d.type];ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icons[d.type],d.x,d.y);
    const pulse=4+Math.sin(globalTime*0.01)*3;
    ctx.strokeStyle=colors[d.type];ctx.globalAlpha=0.25+0.2*Math.sin(globalTime*0.008);
    ctx.lineWidth=2;ctx.beginPath();ctx.arc(d.x,d.y,d.r+pulse,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  });

  // ========== PLAYER BULLETS - UNIQUE PER WEAPON ==========
  game.bullets.forEach(b=>{
    const wid=b.weaponId;

    // Trails
    if(b.trail&&b.trail.length>1){
      for(let i=1;i<b.trail.length;i++){
        const tAlpha=(i/b.trail.length)*0.35;
        ctx.strokeStyle=b.color;ctx.globalAlpha=tAlpha;
        ctx.lineWidth=wid===1?b.r*0.4:b.r*(i/b.trail.length)*0.7;
        ctx.beginPath();ctx.moveTo(b.trail[i-1].x,b.trail[i-1].y);ctx.lineTo(b.trail[i].x,b.trail[i].y);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    if(b.isMelee){
      // Sword slash
      ctx.save();ctx.translate(game.player.x,game.player.y);ctx.rotate(b.angle);
      const grad=ctx.createLinearGradient(0,0,50,0);
      grad.addColorStop(0,'rgba(255,100,255,0.9)');grad.addColorStop(0.5,'rgba(255,150,255,0.5)');grad.addColorStop(1,'rgba(255,100,255,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(50,-2);ctx.lineTo(55,0);ctx.lineTo(50,2);ctx.lineTo(0,4);ctx.closePath();ctx.fill();
      ctx.shadowColor='#ff66ff';ctx.shadowBlur=25;
      ctx.strokeStyle='#ffccff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(52,0);ctx.stroke();
      ctx.shadowBlur=0;ctx.restore();
      return;
    }

    if(wid===0){ // Scatter - Orange orb with glow
      ctx.shadowColor=b.color;ctx.shadowBlur=18;
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffddaa';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.35,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }else if(wid===1){ // Laser - Green beam
      ctx.shadowColor=b.color;ctx.shadowBlur=20;
      const angle=Math.atan2(b.vy,b.vx);
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(angle);
      const grad=ctx.createLinearGradient(-b.r*2,0,b.r*2,0);
      grad.addColorStop(0,'rgba(34,255,119,0)');grad.addColorStop(0.5,'rgba(34,255,119,0.9)');grad.addColorStop(1,'rgba(34,255,119,0)');
      ctx.fillStyle=grad;ctx.fillRect(-b.r*2,-b.r*0.4,b.r*4,b.r*0.8);
      ctx.fillStyle='#aaffcc';ctx.fillRect(-b.r*1.5,-1,b.r*3,2);
      ctx.restore();ctx.shadowBlur=0;
    }else if(wid===2){ // Homing - Gold diamond
      ctx.shadowColor=b.color;ctx.shadowBlur=15;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(globalTime*0.005);
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.moveTo(0,-b.r);ctx.lineTo(b.r*0.7,0);ctx.lineTo(0,b.r);ctx.lineTo(-b.r*0.7,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffeeaa';ctx.beginPath();ctx.moveTo(0,-b.r*0.4);ctx.lineTo(b.r*0.3,0);ctx.lineTo(0,b.r*0.4);ctx.lineTo(-b.r*0.3,0);ctx.closePath();ctx.fill();
      ctx.restore();ctx.shadowBlur=0;
    }else if(wid===3){ // Shotgun - Small red pellets
      ctx.shadowColor=b.color;ctx.shadowBlur=8;
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.8,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffaaaa';ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.3,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }else if(wid===4){ // Ring - Purple hex star
      ctx.shadowColor=b.color;ctx.shadowBlur=16;
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(globalTime*0.008);
      ctx.fillStyle=b.color;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=(Math.PI*2/6)*i-Math.PI/2;
        const r=i%2===0?b.r:b.r*0.5;
        if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#ddbbff';ctx.beginPath();ctx.arc(0,0,b.r*0.25,0,Math.PI*2);ctx.fill();
      ctx.restore();ctx.shadowBlur=0;
    }else if(wid===5){ // Sniper - Blue needle
      ctx.shadowColor=b.color;ctx.shadowBlur=22;
      const angle=Math.atan2(b.vy,b.vx);
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(angle);
      const grad=ctx.createLinearGradient(-b.r*3,0,b.r*3,0);
      grad.addColorStop(0,'rgba(34,153,255,0)');grad.addColorStop(0.3,'rgba(34,153,255,0.8)');grad.addColorStop(1,'rgba(170,220,255,1)');
      ctx.fillStyle=grad;ctx.fillRect(-b.r*3,-1.5,b.r*6,3);
      ctx.fillStyle='#ffffff';ctx.fillRect(b.r*2,-0.5,4,1);
      ctx.restore();ctx.shadowBlur=0;
    }else if(wid===6){ // Missile - Orange rocket
      ctx.shadowColor=b.color;ctx.shadowBlur=18;
      const angle=Math.atan2(b.vy,b.vx);
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(angle);
      ctx.fillStyle=b.color;
      ctx.beginPath();ctx.moveTo(b.r*1.5,0);ctx.lineTo(-b.r*0.8,b.r*0.6);ctx.lineTo(-b.r*0.5,0);ctx.lineTo(-b.r*0.8,-b.r*0.6);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffcc88';ctx.beginPath();ctx.arc(0,0,b.r*0.3,0,Math.PI*2);ctx.fill();
      ctx.restore();ctx.shadowBlur=0;
      // Smoke trail
      if(Math.random()<0.4)spawnParticle(b.x,b.y,Math.PI+angle+(Math.random()-0.5)*0.5,1+Math.random()*2,'rgba(150,150,150,0.5)',600);
    }else if(wid===7){ // Melee handled above
    }

    // Crit sparkle
    if(b.crit){
      ctx.strokeStyle='#ff66ff';ctx.lineWidth=1.5;ctx.globalAlpha=0.7;
      for(let i=0;i<4;i++){
        const a=(Math.PI*2/4)*i+globalTime*0.015;
        ctx.beginPath();ctx.moveTo(b.x+Math.cos(a)*b.r*1.8,b.y+Math.sin(a)*b.r*1.8);
        ctx.lineTo(b.x+Math.cos(a)*b.r*3,b.y+Math.sin(a)*b.r*3);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  });

  // Enemy bullets
  game.eBullets.forEach(b=>{
    if(b.trail&&b.trail.length>1){
      for(let i=1;i<b.trail.length;i++){
        const tAlpha=(i/b.trail.length)*0.3;
        ctx.strokeStyle=b.color;ctx.globalAlpha=tAlpha;ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(b.trail[i-1].x,b.trail[i-1].y);ctx.lineTo(b.trail[i].x,b.trail[i].y);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.shadowColor=b.color;ctx.shadowBlur=14;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffdddd';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.3,0,Math.PI*2);ctx.fill();
  });

  // Laser warnings
  game.flashTexts.forEach((ft,i)=>{
    ft.life-=16;
    if(ft.life<=0){game.flashTexts.splice(i,1);return;}
    ctx.strokeStyle=`rgba(255,50,50,${ft.life/500*0.7})`;ctx.lineWidth=2.5;ctx.setLineDash([10,10]);
    ctx.beginPath();ctx.moveTo(ft.x1,ft.y1);ctx.lineTo(ft.x2,ft.y2);ctx.stroke();ctx.setLineDash([]);
  });

  // Enemies
  game.enemies.forEach(e=>{
    ctx.save();ctx.translate(e.x,e.y);
    if(e===game.boss){
      const pulse=1+Math.sin(globalTime*0.003)*0.07;
      const rotSpd=e.isFinal?0.01:0.006;
      ctx.rotate(globalTime*rotSpd);
      ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=30;
      ctx.beginPath();
      const spikes=e.isFinal?16:12;
      for(let i=0;i<spikes*2;i++){
        const angle=(Math.PI*2/(spikes*2))*i;
        const r=i%2===0?e.r*pulse:e.r*0.5*pulse;
        if(i===0)ctx.moveTo(Math.cos(angle)*r,Math.sin(angle)*r);else ctx.lineTo(Math.cos(angle)*r,Math.sin(angle)*r);
      }
      ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,e.r*0.55,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,e.r*0.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      const ex=Math.cos(e.angle)*e.r*0.08,ey=Math.sin(e.angle)*e.r*0.08;
      ctx.beginPath();ctx.arc(ex,ey,e.r*0.1,0,Math.PI*2);ctx.fill();
      // HP bar
      const barW=e.r*2.4;
      ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(-barW/2,-e.r-18,barW,9);
      const hpGrad=ctx.createLinearGradient(-barW/2,-e.r-18,barW/2,-e.r-18);
      hpGrad.addColorStop(0,'#ff3333');hpGrad.addColorStop(0.5,'#ffaa00');hpGrad.addColorStop(1,'#44ff66');
      ctx.fillStyle=hpGrad;ctx.fillRect(-barW/2,-e.r-18,barW*(e.hp/e.maxHp),9);
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(-barW/2,-e.r-18,barW,9);
      // Name
      ctx.fillStyle='#ffaaaa';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
      ctx.fillText(e.name,0,-e.r-24);
    }else{
      ctx.rotate(e.angle+Math.PI/2);
      if(e.elite){ctx.shadowColor='#ffdd22';ctx.shadowBlur=22;}
      else{ctx.shadowColor=e.color;ctx.shadowBlur=12;}
      ctx.fillStyle=e.elite?'#ffdd22':e.color;
      ctx.beginPath();
      ctx.moveTo(0,-e.r);ctx.lineTo(e.r*0.8,e.r*0.6);ctx.lineTo(0,e.r*0.35);ctx.lineTo(-e.r*0.8,e.r*0.6);
      ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      // Engine
      const flameH=10+Math.random()*8;
      const fGrad=ctx.createLinearGradient(0,e.r*0.4,0,e.r*0.4+flameH);
      fGrad.addColorStop(0,'rgba(255,200,50,0.9)');fGrad.addColorStop(1,'rgba(255,50,0,0)');
      ctx.fillStyle=fGrad;
      ctx.beginPath();ctx.moveTo(-5,e.r*0.4);ctx.lineTo(0,e.r*0.4+flameH);ctx.lineTo(5,e.r*0.4);ctx.fill();
      // Status indicators
      if(e.status.burn>0){ctx.fillStyle='rgba(255,100,0,0.6)';ctx.beginPath();ctx.arc(0,0,e.r+3,0,Math.PI*2);ctx.fill();}
      if(e.status.poison>0){ctx.fillStyle='rgba(100,255,0,0.4)';ctx.beginPath();ctx.arc(0,0,e.r+5,0,Math.PI*2);ctx.fill();}
      // HP bar
      if(e.hp<e.maxHp){
        const bw=e.r*1.8;
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-bw/2,-e.r-12,bw,4);
        ctx.fillStyle='#ff4444';ctx.fillRect(-bw/2,-e.r-12,bw*(e.hp/e.maxHp),4);
      }
    }
    ctx.restore();
  });

  // Player
  const p=game.player;
  ctx.save();ctx.translate(p.x,p.y);
  if(p.invincible>0&&Math.floor(globalTime/70)%2===0)ctx.globalAlpha=0.35;
  ctx.shadowColor='#4488ff';ctx.shadowBlur=25;
  ctx.fillStyle='#2266cc';
  ctx.beginPath();ctx.moveTo(0,-p.r-8);ctx.lineTo(p.r+5,p.r+3);ctx.lineTo(0,p.r*0.7);ctx.lineTo(-p.r-5,p.r+3);ctx.closePath();ctx.fill();
  ctx.fillStyle='#5599ff';
  ctx.beginPath();ctx.moveTo(0,-p.r-3);ctx.lineTo(p.r*0.5,p.r*0.3);ctx.lineTo(0,p.r*0.15);ctx.lineTo(-p.r*0.5,p.r*0.3);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // Engine
  const flameH=14+Math.random()*12;
  const fGrad=ctx.createLinearGradient(0,p.r,0,p.r+flameH);
  fGrad.addColorStop(0,'rgba(255,220,80,0.95)');fGrad.addColorStop(0.4,'rgba(255,120,20,0.7)');fGrad.addColorStop(1,'rgba(255,50,0,0)');
  ctx.fillStyle=fGrad;
  ctx.beginPath();ctx.moveTo(-6,p.r);ctx.quadraticCurveTo(0,p.r+flameH+6,6,p.r);ctx.fill();
  if(Math.random()<0.6)spawnParticle(p.x,p.y+p.r+6,Math.PI/2+(Math.random()-0.5)*0.5,1.5+Math.random()*2.5,'#ffaa33',500);
  ctx.globalAlpha=1;ctx.restore();

  // Skill aura
  if(p.skillActive){
    ctx.strokeStyle='rgba(255,220,50,0.35)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(p.x,p.y,38+Math.sin(globalTime*0.012)*6,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,220,50,0.06)';
    ctx.beginPath();ctx.arc(p.x,p.y,32,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,220,50,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(p.x,p.y,50+Math.sin(globalTime*0.008)*8,0,Math.PI*2);ctx.stroke();
  }

  // Texts
  game.texts.forEach(t=>{
    ctx.fillStyle=t.color;ctx.globalAlpha=t.alpha;
    ctx.font=`bold ${t.size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=t.color;ctx.shadowBlur=12;
    ctx.fillText(t.text,t.x,t.y);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  });

  // HUD
  if(game.state==='playing'||game.state==='talent'){
    const hpGrad=ctx.createLinearGradient(12,14,212,14);
    hpGrad.addColorStop(0,'#ff2222');hpGrad.addColorStop(0.5,'#ffaa00');hpGrad.addColorStop(1,'#44ff66');
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(12,8,200,20);
    ctx.fillStyle=hpGrad;ctx.fillRect(12,8,200*(p.hp/p.maxHp),20);
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;ctx.strokeRect(12,8,200,20);
    ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='left';
    ctx.fillText(`HP ${Math.ceil(p.hp)}/${p.maxHp}`,16,22);

    if(p.maxShield>0){
      ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(12,30,200,11);
      const shGrad=ctx.createLinearGradient(12,30,212,30);
      shGrad.addColorStop(0,'#2244aa');shGrad.addColorStop(1,'#66aaff');
      ctx.fillStyle=shGrad;ctx.fillRect(12,30,200*(p.shield/p.maxShield),11);
      ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.strokeRect(12,30,200,11);
    }

    ctx.fillStyle='#66ccff';ctx.font='bold 22px sans-serif';ctx.textAlign='left';
    ctx.shadowColor='#4488ff';ctx.shadowBlur=12;
    ctx.fillText(`波次 ${game.wave}/50`,12,62);
    ctx.shadowBlur=0;

    ctx.fillStyle='#ffcc00';ctx.font='14px sans-serif';
    ctx.fillText(`分数: ${Math.floor(game.score)}`,12,82);

    const w=p.weapons[p.weaponIdx];
    ctx.fillStyle=w.color;ctx.font='bold 15px sans-serif';
    ctx.fillText(`${w.icon} ${w.name} Lv.${w.level}`,12,102);

    // Weapon talent count
    const wtCount=(p.weaponTalents[w.id]||[]).length;
    if(wtCount>0){ctx.fillStyle='#bb88ff';ctx.font='12px sans-serif';ctx.fillText(`天赋:${wtCount}`,12,118);}

    const cx=55,cy=H-55,r=26;
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    const skillRatio=Math.max(0,1-Math.max(0,p.skillCooldown)/12000);
    const skillColor=p.skillActive?'#ffdd44':skillRatio>=1?'#44ff88':'#ff4444';
    ctx.strokeStyle=skillColor;ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*skillRatio);ctx.stroke();
    ctx.fillStyle=skillColor;ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.skillActive?'⚡':Math.ceil(Math.max(0,p.skillCooldown)/1000)+'s',cx,cy);

    if(p.combo>1){
      const comboSize=18+Math.min(p.combo,14)*1.8;
      ctx.fillStyle='#ff8844';ctx.font=`bold ${comboSize}px sans-serif`;ctx.textAlign='center';
      ctx.shadowColor='#ff8844';ctx.shadowBlur=18;
      ctx.fillText(`${p.combo}x 连击!`,W/2,50);
      ctx.shadowBlur=0;
    }

    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(W-100,8,90,70);
    ctx.fillStyle='#ff4444';ctx.font='12px sans-serif';ctx.textAlign='right';
    ctx.fillText(`敌人 ${game.enemies.length}`,W-14,24);
    ctx.fillStyle='#ffaa00';ctx.fillText(`弹幕 ${game.eBullets.length}`,W-14,42);
    ctx.fillStyle='#66ccff';ctx.fillText(`击杀 ${game.kills}`,W-14,60);

    if(game.eBullets.length>50){
      ctx.fillStyle=`rgba(255,0,0,${0.12+0.08*Math.sin(globalTime*0.012)})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  ctx.restore();

  if(game.screenFlash>0){
    ctx.fillStyle=`rgba(255,0,0,${Math.min(0.6,game.screenFlash*0.2)})`;
    ctx.fillRect(0,0,W,H);
  }
  if(game.state==='victory'){
    ctx.fillStyle=`rgba(255,255,200,${0.12+0.08*Math.sin(globalTime*0.005)})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ==================== MAIN LOOP ====================
function loop(timestamp){
  if(!lastTime)lastTime=timestamp;
  let dt=timestamp-lastTime;
  lastTime=timestamp;
  if(dt>100)dt=100;
  if(slowMotion>0)dt*=0.2;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== UI LOGIC ====================
let selectedDiff='easy';
let selectedWeapon=0;

function initTitle(){
  loadMeta();
  document.getElementById('metaGold').textContent=meta.gold;
  document.getElementById('metaWave').textContent=meta.highWave;
  document.getElementById('metaKills').textContent=meta.totalKills;
  document.getElementById('metaGames').textContent=meta.gamesPlayed;

  const grid=document.getElementById('weaponSelect');
  grid.innerHTML='';
  WEAPONS.forEach((w,i)=>{
    const div=document.createElement('div');
    div.className='weapon-card'+(i===0?' selected':'');
    div.dataset.id=w.id;
    div.innerHTML=`<div class="w-icon">${w.icon}</div><div class="w-name">${w.name}</div><div class="w-desc">${w.desc}</div>`;
    div.onclick=()=>selectSingleWeapon(w.id,div);
    grid.appendChild(div);
  });

  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDiff=btn.dataset.diff;
    };
  });
}

function selectSingleWeapon(id,el){
  selectedWeapon=id;
  document.querySelectorAll('.weapon-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

document.getElementById('startBtn').onclick=()=>{
  startGame(selectedDiff,selectedWeapon);
};

document.getElementById('shopBtn').onclick=()=>{
  document.getElementById('titleScreen').style.display='none';
  document.getElementById('shopScreen').style.display='block';
  refreshShop();
};

document.getElementById('backBtn').onclick=()=>{
  document.getElementById('shopScreen').style.display='none';
  document.getElementById('titleScreen').style.display='block';
  initTitle();
};

document.getElementById('resetBtn').onclick=()=>{
  if(confirm('确定重置所有存档吗？此操作不可恢复！')){resetMeta();initTitle();}
};

document.getElementById('restartBtn').onclick=()=>{
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('titleScreen').style.display='block';
  initTitle();
};

document.getElementById('goShopBtn').onclick=()=>{
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('shopScreen').style.display='block';
  refreshShop();
};

function refreshShop(){
  document.getElementById('shopGold').textContent=meta.gold;
  const grid=document.getElementById('upgradeGrid');
  grid.innerHTML='';
  UPGRADES.forEach(u=>{
    const level=meta.upgrades[u.id];
    const cost=Math.floor(u.baseCost*Math.pow(1.4,level));
    const maxed=level>=u.max;
    const div=document.createElement('div');
    div.className='upgrade-card';
    div.innerHTML=`<div class="u-name">${u.name}</div><div class="u-desc">${u.desc}</div><div class="u-level">等级 ${level}/${u.max}</div><div class="u-cost">${maxed?'已满级':`💰 ${cost}`}</div><button class="btn btn-gold" style="margin-top:8px;font-size:13px;padding:6px 18px;" ${maxed||meta.gold<cost?'disabled':''} onclick="buyUpgrade('${u.id}')">${maxed?'已满级':'升级'}</button>`;
    grid.appendChild(div);
  });
}

function buyUpgrade(id){
  const u=UPGRADES.find(x=>x.id===id);
  const level=meta.upgrades[id];
  if(level>=u.max)return;
  const cost=Math.floor(u.baseCost*Math.pow(1.4,level));
  if(meta.gold<cost)return;
  meta.gold-=cost;
  meta.upgrades[id]++;
  saveMeta();
  refreshShop();
}

// Init
document.addEventListener('DOMContentLoaded',initTitle);
</script>
