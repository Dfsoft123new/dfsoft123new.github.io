<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>星际猎手：终极进化 v8.0</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; touch-action:none; }
body { background:#02020a; overflow:hidden; font-family:'Microsoft YaHei',sans-serif; color:#fff; }
#gameCanvas { display:block; position:fixed; top:0; left:0; }

.panel {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  background:rgba(8,12,30,0.96); border:2px solid #4488ff; border-radius:16px;
  padding:24px; max-width:900px; width:92%; max-height:92vh; overflow-y:auto;
  box-shadow:0 0 60px rgba(68,136,255,0.4), inset 0 0 40px rgba(68,136,255,0.05);
  backdrop-filter:blur(10px);
}
.panel h1 { text-align:center; color:#66ccff; font-size:26px; margin-bottom:12px; text-shadow:0 0 20px #4488ff; }
.panel h2 { color:#ffaa44; font-size:18px; margin:10px 0 6px; }
.panel p { color:#aaa; font-size:13px; line-height:1.5; margin:3px 0; }

.btn {
  display:inline-block; padding:10px 24px; margin:6px; border:none; border-radius:8px;
  color:#fff; font-size:15px; cursor:pointer; transition:all 0.2s; font-weight:bold;
  background:linear-gradient(135deg,#2266cc,#4488ff);
  box-shadow:0 4px 15px rgba(34,102,204,0.4);
}
.btn:hover { transform:translateY(-2px); box-shadow:0 6px 25px rgba(68,136,255,0.6); }
.btn:active { transform:translateY(0); }
.btn:disabled { background:#333; cursor:not-allowed; opacity:0.5; }
.btn-gold { background:linear-gradient(135deg,#cc8800,#ffaa00); box-shadow:0 4px 15px rgba(204,136,0,0.4); }
.btn-gold:hover { box-shadow:0 6px 25px rgba(255,170,0,0.6); }
.btn-red { background:linear-gradient(135deg,#cc2222,#ff4444); }
.btn-green { background:linear-gradient(135deg,#22aa44,#44cc66); }

.weapon-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0; }
@media(max-width:600px){ .weapon-grid{grid-template-columns:repeat(2,1fr);} }
.weapon-card {
  background:rgba(25,35,65,0.9); border:2px solid #335588; border-radius:12px;
  padding:14px 8px; text-align:center; cursor:pointer; transition:all 0.25s; position:relative;
}
.weapon-card:hover { border-color:#66aaff; transform:scale(1.04); box-shadow:0 0 20px rgba(102,170,255,0.2); }
.weapon-card.selected { border-color:#ffcc00; background:rgba(70,55,15,0.95); box-shadow:0 0 25px rgba(255,204,0,0.35), inset 0 0 20px rgba(255,204,0,0.1); }
.weapon-card.selected::after { content:'✓'; position:absolute; top:4px; right:8px; color:#ffcc00; font-size:18px; font-weight:bold; }
.weapon-card .w-icon { font-size:32px; margin-bottom:6px; filter:drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
.weapon-card .w-name { font-size:13px; font-weight:bold; color:#ffdd88; }
.weapon-card .w-desc { font-size:11px; color:#888; margin-top:4px; }

.upgrade-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:12px 0; }
@media(max-width:600px){ .upgrade-grid{grid-template-columns:1fr;} }
.upgrade-card {
  background:rgba(25,35,65,0.9); border:2px solid #335588; border-radius:10px;
  padding:12px; text-align:center;
}
.upgrade-card .u-name { font-size:14px; font-weight:bold; color:#ffdd88; margin-bottom:4px; }
.upgrade-card .u-desc { font-size:12px; color:#999; margin-bottom:6px; }
.upgrade-card .u-level { font-size:12px; color:#66ccff; margin-bottom:6px; }
.upgrade-card .u-cost { font-size:13px; color:#ffcc00; font-weight:bold; }

.stat-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
.stat-row span:first-child { color:#888; }
.stat-row span:last-child { color:#66ccff; font-weight:bold; }

.gold-display {
  position:fixed; top:10px; right:10px; z-index:100;
  background:rgba(0,0,0,0.7); border:2px solid #ffaa00; border-radius:20px;
  padding:6px 16px; font-size:16px; font-weight:bold; color:#ffcc00;
  text-shadow:0 0 10px rgba(255,204,0,0.5);
}

.difficulty-select { display:flex; gap:10px; justify-content:center; margin:12px 0; flex-wrap:wrap; }
.diff-btn { padding:8px 20px; border-radius:20px; border:2px solid #444; background:rgba(30,40,70,0.8); color:#ccc; cursor:pointer; font-weight:bold; transition:all 0.2s; }
.diff-btn.selected { border-color:#ffcc00; background:rgba(80,60,20,0.9); color:#fff; box-shadow:0 0 15px rgba(255,204,0,0.3); }

.talent-options { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:16px 0; }
.talent-card {
  background:rgba(40,30,70,0.95); border:2px solid #8855cc; border-radius:14px;
  padding:16px; width:220px; text-align:center; cursor:pointer; transition:all 0.25s;
  box-shadow:0 4px 15px rgba(0,0,0,0.3);
}
.talent-card:hover { transform:translateY(-5px) scale(1.02); border-color:#bb88ff; box-shadow:0 12px 35px rgba(136,85,204,0.35); }
.talent-card .t-name { font-size:15px; font-weight:bold; color:#ddbbff; margin-bottom:6px; }
.talent-card .t-desc { font-size:12px; color:#aaa; }
.talent-card .t-rank { font-size:11px; color:#ffaa66; margin-top:6px; }

#mobileControls { display:none; position:fixed; bottom:0; left:0; width:100%; height:180px; z-index:60; pointer-events:none; }
.joystick-area { position:absolute; bottom:20px; left:20px; width:130px; height:130px; pointer-events:auto; }
.joystick-base { position:absolute; width:100%; height:100%; border:3px solid rgba(255,255,255,0.25); border-radius:50%; background:rgba(255,255,255,0.04); }
.joystick-knob { position:absolute; top:50%; left:50%; width:50px; height:50px; transform:translate(-50%,-50%); background:rgba(68,136,255,0.6); border-radius:50%; border:2px solid #66aaff; box-shadow:0 0 15px rgba(68,136,255,0.4); transition:none; }
.skill-btn { position:absolute; bottom:35px; right:35px; width:85px; height:85px; border-radius:50%; background:rgba(255,60,60,0.5); border:3px solid #ff5555; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; color:#fff; box-shadow:0 0 20px rgba(255,60,60,0.3); }
.skill-btn.cooldown { background:rgba(60,60,60,0.5); border-color:#555; color:#888; }

::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:rgba(0,0,0,0.3); }
::-webkit-scrollbar-thumb { background:#4488ff; border-radius:3px; }
</style>
<base target="_blank">
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="gold-display" id="goldDisplay" style="display:none">💰 0</div>

<div id="titleScreen" class="panel">
  <h1>🚀 星际猎手：终极进化</h1>
  <p style="text-align:center;color:#88ccff;margin-bottom:10px;font-size:14px;">v8.0 | 弹幕地狱 · 局外成长 · 单武器开局</p>
  <div id="metaStats" style="margin:10px 0;padding:12px;background:rgba(0,0,0,0.35);border-radius:10px;border:1px solid rgba(255,255,255,0.08);">
    <div class="stat-row"><span>💰 持有金币</span><span id="metaGold">0</span></div>
    <div class="stat-row"><span>🏆 最高波次</span><span id="metaWave">0</span></div>
    <div class="stat-row"><span>💀 总击杀</span><span id="metaKills">0</span></div>
    <div class="stat-row"><span>🎮 游戏次数</span><span id="metaGames">0</span></div>
  </div>
  <h2>🎯 选择难度</h2>
  <div class="difficulty-select">
    <div class="diff-btn selected" data-diff="easy">😊 简单</div>
    <div class="diff-btn" data-diff="normal">😐 普通</div>
    <div class="diff-btn" data-diff="hard">😈 困难</div>
    <div class="diff-btn" data-diff="hell">🔥 地狱</div>
  </div>
  <h2>🔫 选择开局武器（单选）</h2>
  <div class="weapon-grid" id="weaponSelect"></div>
  <p style="text-align:center;color:#888;font-size:12px;margin-top:6px;">点击选择一种开局武器，游戏中可拾取掉落解锁更多</p>
  <div style="text-align:center;margin-top:14px;">
    <button class="btn btn-green" id="startBtn" style="font-size:17px;padding:12px 36px;">🚀 开始任务</button>
    <button class="btn btn-gold" id="shopBtn">🏪 升级商店</button>
    <button class="btn" id="resetBtn">🗑️ 重置存档</button>
  </div>
  <p style="text-align:center;color:#666;font-size:11px;margin-top:8px;">🖱️ 鼠标滑动控制飞船移动 · 自动射击 · 空格释放大招</p>
</div>

<div id="shopScreen" class="panel" style="display:none;">
  <h1>🏪 局外升级商店</h1>
  <p style="text-align:center;color:#ffcc00;font-size:16px;margin-bottom:12px;">💰 金币: <span id="shopGold">0</span></p>
  <div class="upgrade-grid" id="upgradeGrid"></div>
  <div style="text-align:center;margin-top:16px;">
    <button class="btn" id="backBtn">⬅️ 返回主菜单</button>
  </div>
</div>

<div id="talentScreen" class="panel" style="display:none;">
  <h1>✨ 天赋选择</h1>
  <p style="text-align:center;color:#ffaa66;">第 <span id="talentWave">5</span> 波突破！选择一项天赋：</p>
  <div class="talent-options" id="talentOptions"></div>
</div>

<div id="gameOverScreen" class="panel" style="display:none;">
  <h1 id="goTitle">💀 任务失败</h1>
  <div style="margin:14px 0;">
    <div class="stat-row"><span>📊 到达波次</span><span id="goWave">0</span></div>
    <div class="stat-row"><span>💀 击杀敌人</span><span id="goKills">0</span></div>
    <div class="stat-row"><span>⭐ 获得分数</span><span id="goScore">0</span></div>
    <div class="stat-row"><span>💰 获得金币</span><span id="goGoldEarned" style="color:#ffcc00;">0</span></div>
    <div class="stat-row"><span>🎖️ 评价</span><span id="goRank">F</span></div>
  </div>
  <div style="text-align:center;">
    <button class="btn btn-green" id="restartBtn">🔄 再来一局</button>
    <button class="btn btn-gold" id="goShopBtn">🏪 去商店</button>
  </div>
</div>

<div id="mobileControls">
  <div class="joystick-area" id="joystickArea">
    <div class="joystick-base"></div>
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>
  <div class="skill-btn" id="skillBtn">大招</div>
</div>

<script>
// ==================== SAVE ====================
const SAVE_KEY='space_shooter_meta_v8';
let meta={gold:0,totalKills:0,highWave:0,gamesPlayed:0,upgrades:{damage:0,health:0,speed:0,fireRate:0,goldGain:0,critChance:0,shield:0,luck:0}};
function loadMeta(){try{const d=localStorage.getItem(SAVE_KEY);if(d){const p=JSON.parse(d);meta={...meta,...p,upgrades:{...meta.upgrades,...(p.upgrades||{})}};}}catch(e){}}
function saveMeta(){localStorage.setItem(SAVE_KEY,JSON.stringify(meta));}
function resetMeta(){meta={gold:0,totalKills:0,highWave:0,gamesPlayed:0,upgrades:{damage:0,health:0,speed:0,fireRate:0,goldGain:0,critChance:0,shield:0,luck:0}};saveMeta();}

// ==================== DATA ====================
const WEAPONS=[
  {id:0,name:'散射炮',icon:'🔫',desc:'3发扇形散射，均衡稳定',color:'#ff6644',damage:14,fireRate:210,speed:7.5,spread:0.28,count:3,pierce:0,homing:0,life:1.1},
  {id:1,name:'激光炮',icon:'⚡',desc:'贯穿直线，高伤低攻速',color:'#44ff88',damage:40,fireRate:420,speed:13,spread:0,count:1,pierce:6,homing:0,life:0.7,laser:true},
  {id:2,name:'追踪弹',icon:'🎯',desc:'自动追踪，精准打击',color:'#ffaa44',damage:20,fireRate:260,speed:5.2,spread:0.12,count:2,pierce:0,homing:1,life:2.2},
  {id:3,name:'霰弹枪',icon:'💥',desc:'近距离爆发，伤害极高',color:'#ff4444',damage:9,fireRate:330,speed:6.2,spread:0.55,count:8,pierce:0,homing:0,life:0.65},
  {id:4,name:'环形炮',icon:'🌀',desc:'360°全方位覆盖',color:'#aa66ff',damage:15,fireRate:380,speed:5.8,spread:0,count:12,pierce:1,homing:0,life:1.0,ring:true},
  {id:5,name:'狙击炮',icon:'🎯',desc:'超远射程，一击必杀',color:'#44aaff',damage:90,fireRate:650,speed:16,spread:0,count:1,pierce:12,homing:0,life:2.8,sniper:true},
  {id:6,name:'导弹巢',icon:'🚀',desc:'慢速高伤，范围爆炸',color:'#ff6644',damage:50,fireRate:480,speed:3.8,spread:0.22,count:2,pierce:0,homing:0.85,life:3.2,explosive:true},
  {id:7,name:'光束剑',icon:'⚔️',desc:'近战武器，持续伤害',color:'#ff88ff',damage:6,fireRate:45,speed:0,spread:0,count:1,pierce:99,homing:0,life:0.12,melee:true}
];

const TALENTS=[
  {name:'极速射击',desc:'攻击速度+15%',type:'atk',effect:0.15,max:3},{name:'火力强化',desc:'子弹伤害+20%',type:'atk',effect:0.20,max:3},
  {name:'暴击精通',desc:'暴击率+12%',type:'atk',effect:0.12,max:3},{name:'穿透强化',desc:'子弹穿透+2',type:'atk',effect:2,max:3},
  {name:'多重射击',desc:'子弹数量+1',type:'atk',effect:1,max:3},{name:'爆裂弹头',desc:'击杀爆炸范围+30%',type:'atk',effect:0.30,max:3},
  {name:'Boss杀手',desc:'对Boss伤害+25%',type:'atk',effect:0.25,max:3},{name:'巨化弹体',desc:'子弹体积+25%',type:'atk',effect:0.25,max:3},
  {name:'生命强化',desc:'最大生命+25%',type:'def',effect:0.25,max:3},{name:'护盾充能',desc:'获得50点护盾',type:'def',effect:50,max:3},
  {name:'生命恢复',desc:'每秒回复2%生命',type:'def',effect:0.02,max:3},{name:'生命偷取',desc:'造成伤害的5%转化为生命',type:'def',effect:0.05,max:3},
  {name:'坚韧护甲',desc:'受到伤害-15%',type:'def',effect:0.15,max:3},{name:'涅槃重生',desc:'死亡时满血复活1次',type:'def',effect:1,max:1},
  {name:'护盾再生',desc:'护盾每秒回复3点',type:'def',effect:3,max:3},{name:'闪避步法',desc:'有10%几率闪避伤害',type:'def',effect:0.10,max:3},
  {name:'机动强化',desc:'移动速度+15%',type:'mob',effect:0.15,max:3},{name:'引力场',desc:'拾取范围+50%',type:'mob',effect:0.50,max:3},
  {name:'幸运之星',desc:'掉落率+20%',type:'mob',effect:0.20,max:3},{name:'连击延长',desc:'连击持续时间+2秒',type:'mob',effect:2,max:3},
  {name:'赏金猎人',desc:'击杀金币+30%',type:'mob',effect:0.30,max:3},{name:'冷却缩减',desc:'技能冷却-15%',type:'mob',effect:0.15,max:3},
  {name:'死亡绽放',desc:'死亡时对全屏敌人造成伤害',type:'mob',effect:1,max:1},{name:'子弹弹射',desc:'子弹可弹射1次',type:'mob',effect:1,max:2}
];

const UPGRADES=[
  {id:'damage',name:'火力核心',desc:'所有武器基础伤害+8%',baseCost:50,max:20,perLevel:0.08},{id:'health',name:'生命增幅',desc:'最大生命值+10%',baseCost:50,max:20,perLevel:0.10},
  {id:'speed',name:'推进引擎',desc:'移动速度+5%',baseCost:60,max:15,perLevel:0.05},{id:'fireRate',name:'快速装填',desc:'攻击速度+5%',baseCost:60,max:15,perLevel:0.05},
  {id:'goldGain',name:'财富印记',desc:'金币获取+10%',baseCost:80,max:15,perLevel:0.10},{id:'critChance',name:'暴击透镜',desc:'暴击率+3%',baseCost:100,max:20,perLevel:0.03},
  {id:'shield',name:'护盾矩阵',desc:'开局护盾+25',baseCost:70,max:15,perLevel:25},{id:'luck',name:'幸运符咒',desc:'稀有掉落+5%',baseCost:90,max:15,perLevel:0.05}
];

const DIFFICULTY={
  easy:{hp:0.5,speed:0.55,dmg:0.35,bullet:0.4,gold:0.7,score:0.5,spawn:1.5},
  normal:{hp:1.0,speed:1.0,dmg:1.0,bullet:1.0,gold:1.0,score:1.0,spawn:1.0},
  hard:{hp:1.9,speed:1.35,dmg:1.8,bullet:1.35,gold:1.4,score:1.7,spawn:0.75},
  hell:{hp:3.5,speed:1.75,dmg:3.2,bullet:1.8,gold:2.0,score:2.6,spawn:0.6}
};

// ==================== CANVAS ====================
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
resize();

// ==================== INPUT ====================
const keys={};
const mouse={x:W/2,y:H/2,down:false};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
window.addEventListener('keyup',e=>keys[e.code]=false);
window.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
window.addEventListener('mousedown',()=>mouse.down=true);
window.addEventListener('mouseup',()=>mouse.down=false);

// Mobile detection & joystick
const isMobile=/Android|iPhone|iPad|iPod|webOS|BlackBerry/i.test(navigator.userAgent)||(window.innerWidth<800&&'ontouchstart' in window);
if(isMobile)document.getElementById('mobileControls').style.display='block';

let joystick={active:false,dx:0,dy:0};
const joyArea=document.getElementById('joystickArea');
const joyKnob=document.getElementById('joystickKnob');
let joyCenter={x:0,y:0};

function getTouchPos(t){const rect=joyArea.getBoundingClientRect();return{x:t.clientX-rect.left,y:t.clientY-rect.top};}

joyArea.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.touches[0];joyCenter={x:t.clientX,y:t.clientY};joystick.active=true;updateJoystick(t);
},{passive:false});
joyArea.addEventListener('touchmove',e=>{
  e.preventDefault();if(joystick.active)updateJoystick(e.touches[0]);
},{passive:false});
joyArea.addEventListener('touchend',e=>{
  e.preventDefault();joystick.active=false;joystick.dx=0;joystick.dy=0;
  joyKnob.style.transform='translate(-50%,-50%)';joyKnob.style.left='50%';joyKnob.style.top='50%';
},{passive:false});

function updateJoystick(t){
  const maxR=35;
  let dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>maxR){dx=dx/dist*maxR;dy=dy/dist*maxR;}
  joyKnob.style.left=(60+dx)+'px';joyKnob.style.top=(60+dy)+'px';
  joystick.dx=dx/maxR;joystick.dy=dy/maxR;
}

document.getElementById('skillBtn').addEventListener('touchstart',e=>{e.preventDefault();activateSkill();});
document.getElementById('skillBtn').addEventListener('touchend',e=>e.preventDefault());

// ==================== GAME STATE ====================
let game=null;
let lastTime=0;
let screenShake=0;
let slowMotion=0;
let globalTime=0;

function startGame(diff,startWeaponId){
  const d=DIFFICULTY[diff];
  const up=meta.upgrades;
  game={
    state:'playing',diff,wave:1,score:0,kills:0,gold:0,
    player:{
      x:W/2,y:H*0.85,r:18,hp:100*(1+up.health*0.10),maxHp:100*(1+up.health*0.10),
      shield:up.shield*25,maxShield:250,
      speed:5.5*(1+up.speed*0.05),
      weapons:[{...WEAPONS[startWeaponId],level:1,xp:0}],
      weaponIdx:0,invincible:0,fireCooldown:0,
      skillActive:false,skillEndTime:0,skillCooldown:0,
      talents:[],talentCounts:{},combo:0,comboTime:0,revives:0,
      critChance:0.05+up.critChance*0.03,dodgeChance:0,lifeSteal:0,regen:0,shieldRegen:0,
      dmgMul:1,fireRateMul:1,bulletSizeMul:1,pierceAdd:0,countAdd:0,
      pickupRange:70,goldMul:1+up.goldGain*0.10,bossDmg:1,explodeRadius:45,
      bounce:0,autoFire:true
    },
    enemies:[],bullets:[],eBullets:[],particles:[],
    drops:[],texts:[],stars:[],nebulas:[],meteors:[],
    waveTimer:0,waveSpawned:0,
    boss:null,nextTalentWave:5,
    diffMul:d,spawnTimer:0,
    screenFlash:0,killStreak:0,flashTexts:[]
  };
  initBackground();
  document.getElementById('titleScreen').style.display='none';
  document.getElementById('shopScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('talentScreen').style.display='none';
  document.getElementById('goldDisplay').style.display='block';
  meta.gamesPlayed++;saveMeta();
}

function initBackground(){
  game.stars=[];game.nebulas=[];game.meteors=[];
  for(let i=0;i<200;i++)game.stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2.5+0.3,sp:Math.random()*0.6+0.08,b:Math.random()*0.6+0.2,layer:Math.random()});
  for(let i=0;i<6;i++)game.nebulas.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*250+120,c:`hsla(${Math.random()*80+180},55%,25%,0.06)`,dx:(Math.random()-0.5)*0.15,dy:(Math.random()-0.5)*0.15});
}

// ==================== ENEMIES ====================

  {name:'高速突击机',hp:20,r:11,speed:4.2,dmg:6,score:15,color:'#ffaa33',pattern:'spread',fireRate:1300,bulletSpeed:5.2,bulletCount:3},
  {name:'重型坦克',hp:85,r:21,speed:1.2,dmg:16,score:32,color:'#aa3333',pattern:'ring',fireRate:2400,bulletSpeed:3.2,bulletCount:8},
  {name:'蜂群机',hp:14,r:9,speed:3.6,dmg:5,score:8,color:'#ffdd55',pattern:'burst',fireRate:850,bulletSpeed:4.6,bulletCount:2},
  {name:'精英战机',hp:58,r:16,speed:2.6,dmg:13,score:26,color:'#ff3388',pattern:'mix',fireRate:1500,bulletSpeed:4.6,bulletCount:4},
  {name:'分裂怪',hp:42,r:15,speed:2.9,dmg:11,score:21,color:'#aa55ff',pattern:'accel',fireRate:1900,bulletSpeed:3.2,bulletCount:5},

  {name:'追踪机',hp:28,r:12,speed:3.2,dmg:8,score:19,color:'#ff77cc',pattern:'homing',fireRate:1600,bulletSpeed:3.6,bulletCount:2}
];

function getWaveConfig(wave){
  const d=game.diffMul;
  const types=ENEMY_TYPES.slice(0,Math.min(3+Math.floor(wave/4),ENEMY_TYPES.length));
  const count=Math.min(4+wave*2,30);
  const hpMul=Math.pow(1.08,wave-1)*d.hp;
  const spdMul=Math.min(1+wave*0.028,2.3)*d.speed;
  return{types,count,hpMul,spdMul};
}

function spawnEnemy(forceType){
  const cfg=getWaveConfig(game.wave);
  const type=forceType||cfg.types[Math.floor(Math.random()*cfg.types.length)];
  const side=Math.floor(Math.random()*3);
  let x,y;
  if(side===0){x=Math.random()*W;y=-35;}
  else if(side===1){x=-35;y=Math.random()*H*0.55;}
  else{x=W+35;y=Math.random()*H*0.55;}
  const e={
    x,y,r:type.r,hp:type.hp*cfg.hpMul,maxHp:type.hp*cfg.hpMul,
    speed:type.speed*cfg.spdMul,dmg:type.dmg*game.diffMul.dmg,
    score:type.score,color:type.color,pattern:type.pattern,
    fireRate:type.fireRate,bulletSpeed:type.bulletSpeed*game.diffMul.bullet,
    bulletCount:type.bulletCount,fireTimer:Math.random()*800,
    angle:Math.PI/2,type:type.name,elite:false,spawnTime:globalTime
  };
  if(Math.random()<0.07+game.wave*0.004){e.elite=true;e.hp*=2.8;e.maxHp*=2.8;e.r*=1.35;e.fireRate*=0.65;e.color='#ffdd33';}
  game.enemies.push(e);
}

function spawnBoss(isMini){
  const d=game.diffMul,w=game.wave;
  if(isMini){
    game.boss={
      x:W/2,y:85,r:38,hp:1000*Math.pow(1.11,w)*d.hp,maxHp:1000*Math.pow(1.11,w)*d.hp,
      speed:1.6*d.speed,dmg:24*d.dmg,score:700,color:'#ff3333',pattern:'mini',
      fireRate:750,bulletSpeed:4.8*d.bullet,phase:0,phaseTimer:0,attackIdx:0,
      isMini:true,name:'狂暴猎手'
    };
  }else{
    const isFinal=w>=50;
    game.boss={
      x:W/2,y:110,r:isFinal?58:48,hp:(isFinal?8000:3200)*Math.pow(1.09,w)*d.hp,
      maxHp:(isFinal?8000:3200)*Math.pow(1.09,w)*d.hp,
      speed:1.3*d.speed,dmg:(isFinal?45:30)*d.dmg,score:isFinal?8000:3000,
      color:isFinal?'#ff0000':'#aa2244',pattern:'boss',
      fireRate:isFinal?500:800,bulletSpeed:5.2*d.bullet,phase:0,phaseTimer:0,attackIdx:0,
      isMini:false,name:isFinal?'宇宙毁灭者':'虚空领主',isFinal
    };
  }
  game.enemies.push(game.boss);
  addText(W/2,160,`⚠️ ${game.boss.name} 降临!`,'#ff3333',30,3000);
  screenShake=20;
  slowMotion=300;
  for(let i=0;i<40;i++)spawnParticle(W/2,100,Math.random()*Math.PI*2,3+Math.random()*5,'#ff3333',1200);

// ==================== UPDATE ====================
function update(dt){
  if(!game||game.state!=='playing')return;
  globalTime+=dt;
  const p=game.player;

  // MOUSE SLIDE CONTROL - Ship moves toward mouse with speed limit
  let tx,ty;
  if(joystick.active){
    tx=p.x+joystick.dx*300;ty=p.y+joystick.dy*300;
  }else{
    tx=mouse.x;ty=mouse.y;
  }
  const dx=tx-p.x,dy=ty-p.y;
  const dist=Math.hypot(dx,dy);
  if(dist>3){
    const moveSpeed=p.speed*(dt/16);
    const ratio=Math.min(1,moveSpeed/dist);
    p.x+=dx*ratio;p.y+=dy*ratio;
  }
  p.x=Math.max(p.r,Math.min(W-p.r,p.x));
  p.y=Math.max(p.r,Math.min(H-p.r,p.y));

  // Weapon switch (only if have that many weapons)
  for(let i=1;i<=8;i++){
    if(keys['Digit'+i]&&i<=p.weapons.length){
      p.weaponIdx=i-1;
      addText(p.x,p.y-35,p.weapons[i-1].name,p.weapons[i-1].color,16,900);
      for(let k=0;k<8;k++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,2+Math.random()*3,p.weapons[i-1].color,500);
    }
  }

  // Auto fire + skill
  p.fireCooldown-=dt;
  if(p.fireCooldown<=0){
    fireWeapon();
    const w=p.weapons[p.weaponIdx];
    p.fireCooldown=w.fireRate*p.fireRateMul/(1+meta.upgrades.fireRate*0.05);
  }
  if(keys['Space']&&p.skillCooldown<=0)activateSkill();

  p.skillCooldown-=dt;
  if(p.skillActive&&Date.now()>p.skillEndTime){
    p.skillActive=false;
    p.skillCooldown=12000*(1-(p.talentCounts['冷却缩减']||0)*0.15);
  }

  // Passive talents
  p.regen=(p.talentCounts['生命恢复']||0)*0.02;
  p.shieldRegen=(p.talentCounts['护盾再生']||0)*3;
  p.lifeSteal=(p.talentCounts['生命偷取']||0)*0.05;
  p.dodgeChance=(p.talentCounts['闪避步法']||0)*0.10;
  p.bounce=(p.talentCounts['子弹弹射']||0);

  if(p.regen>0)p.hp=Math.min(p.maxHp,p.hp+p.maxHp*p.regen*dt/1000);
  if(p.shieldRegen>0)p.shield=Math.min(p.maxShield,p.shield+p.shieldRegen*dt/1000);
  if(p.invincible>0)p.invincible-=dt;
  if(p.comboTime>0){p.comboTime-=dt;if(p.comboTime<=0)p.combo=0;}

  // Wave logic
  game.waveTimer+=dt;
  if(!game.boss){
    const cfg=getWaveConfig(game.wave);
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0&&game.waveSpawned<cfg.count){
      spawnEnemy();
      game.waveSpawned++;
      game.spawnTimer=550*game.diffMul.spawn/(1+game.wave*0.018);
    }
    const living=game.enemies.filter(e=>e!==game.boss).length;
    if(game.waveSpawned>=cfg.count&&living===0){
      game.wave++;
      game.waveSpawned=0;
      addText(W/2,H/2,`第 ${game.wave} 波`,'#66ccff',36,1800);
      screenShake=5;
      for(let i=0;i<20;i++)spawnParticle(W/2,H/2,Math.random()*Math.PI*2,4+Math.random()*6,'#66ccff',1000);
      if(game.wave%5===0&&game.wave<50)spawnBoss(true);
      else if(game.wave%10===0)spawnBoss(false);
      else if(game.wave===50)spawnBoss(false);
      if(game.wave===game.nextTalentWave)showTalentSelect();
    }
  }

  if(game.boss)updateBoss(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateEBullets(dt);
  updateParticles(dt);
  updateDrops(dt);
  updateTexts(dt);
  updateMeteors(dt);

  // Background
  game.stars.forEach(s=>{s.y+=s.sp*(1+s.layer);if(s.y>H){s.y=0;s.x=Math.random()*W;}});
  game.nebulas.forEach(n=>{n.x+=n.dx;n.y+=n.dy;if(n.x<-n.r)n.x=W+n.r;if(n.x>W+n.r)n.x=-n.r;if(n.y<-n.r)n.y=H+n.r;if(n.y>H+n.r)n.y=-n.r;});

  // Effects
  if(screenShake>0)screenShake*=0.92;
  if(screenShake<0.3)screenShake=0;
  if(game.screenFlash>0)game.screenFlash-=dt*0.0015;
  if(slowMotion>0)slowMotion-=dt;

  document.getElementById('goldDisplay').textContent=`💰 ${Math.floor(game.gold)}`;
  if(p.hp<=0)handleDeath();
}

function fireWeapon(){
  const p=game.player;
  const w=p.weapons[p.weaponIdx];
  const dmg=w.damage*(1+w.level*0.28)*p.dmgMul*(1+meta.upgrades.damage*0.08);
  const count=w.count+p.countAdd+(p.talentCounts['多重射击']||0);
  const pierce=w.pierce+p.pierceAdd+(p.talentCounts['穿透强化']||0)*2;
  const size=(w.melee?p.r+28:5+w.level*1.2)*p.bulletSizeMul*(1+(p.talentCounts['巨化弹体']||0)*0.25);
  const crit=Math.random()<p.critChance;
  const finalDmg=dmg*(crit?2.2:1);

  if(w.melee){
    const angle=Math.atan2(mouse.y-p.y,mouse.x-p.x);
    for(let a=-0.5;a<=0.5;a+=0.25){
      game.bullets.push({
        x:p.x,y:p.y,vx:Math.cos(angle+a)*3,vy:Math.sin(angle+a)*3,
        r:size,dmg:finalDmg,color:w.color,life:w.life*1000,pierce,homing:0,
        isMelee:true,angle:angle+a,crit,bounce:p.bounce,trail:[],born:globalTime
      });
    }
    return;
  }

  const baseAngle=w.homing?Math.random()*Math.PI*2:Math.atan2(mouse.y-p.y,mouse.x-p.x);
  for(let i=0;i<count;i++){
    let angle=baseAngle;
    if(w.ring)angle=(Math.PI*2/count)*i;
    else if(count>1&&!w.homing)angle=baseAngle-w.spread*(count-1)/2+w.spread*i;
    else if(w.homing)angle=baseAngle+(Math.random()-0.5)*w.spread;
    const spd=w.speed*(1+(p.talentCounts['极速射击']||0)*0.08);
    game.bullets.push({
      x:p.x+Math.cos(angle)*22,y:p.y+Math.sin(angle)*22,
      vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,
      r:size,dmg:finalDmg,color:w.color,life:w.life*1000,
      pierce,homing:w.homing,isLaser:w.laser,isSniper:w.sniper,
      isExplosive:w.explosive,crit,bounce:p.bounce,trail:[],born:globalTime
    });
  }

  if(p.skillActive&&w.id!==7){
    setTimeout(()=>{
      if(!game||game.state!=='playing')return;
      for(let i=0;i<count;i++){
        let angle=baseAngle;
        if(w.ring)angle=(Math.PI*2/count)*i+0.25;
        else if(count>1&&!w.homing)angle=baseAngle-w.spread*(count-1)/2+w.spread*i;
        else if(w.homing)angle=baseAngle+(Math.random()-0.5)*w.spread;
        game.bullets.push({
          x:p.x+Math.cos(angle)*22,y:p.y+Math.sin(angle)*22,
          vx:Math.cos(angle)*w.speed,vy:Math.sin(angle)*w.speed,
          r:size,dmg:finalDmg*0.65,color:w.color,life:w.life*1000,
          pierce,homing:w.homing,crit,bounce:p.bounce,trail:[],born:globalTime
        });
      }
    },70);
  }
}

function activateSkill(){
  const p=game.player;
  if(p.skillCooldown>0||p.skillActive)return;
  p.skillActive=true;
  p.skillEndTime=Date.now()+4500;
  addText(p.x,p.y-45,'⚡ 大招释放!','#ffdd00',22,1200);
  screenShake=12;
  slowMotion=200;
  // Shockwave ring
  for(let ring=0;ring<3;ring++){
    setTimeout(()=>{
      if(!game)return;
      for(let i=0;i<36;i++){
        const a=(Math.PI*2/36)*i;
        game.bullets.push({
          x:p.x,y:p.y,vx:Math.cos(a)*(6+ring*2),vy:Math.sin(a)*(6+ring*2),
          r:7+ring*2,dmg:p.weapons[p.weaponIdx].damage*(2.5+ring*0.5),color:ring===0?'#ffdd44':ring===1?'#ff8844':'#ff4444',
          life:700,pierce:99,homing:0,isSkill:true,trail:[],born:globalTime
        });
      }
      for(let i=0;i<20;i++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,3+Math.random()*5,'#ffdd44',800);
    },ring*120);
  }
}

function updateEnemies(dt){
  game.enemies.forEach((e,ei)=>{
    if(e===game.boss)return;
    const dx=game.player.x-e.x,dy=game.player.y-e.y;
    const dist=Math.hypot(dx,dy);
    e.x+=(dx/dist||0)*e.speed*(dt/16);
    e.y+=(dy/dist||0)*e.speed*(dt/16);
    e.angle=Math.atan2(dy,dx);
    e.fireTimer-=dt;
    if(e.fireTimer<=0&&dist<550){
      fireEnemyPattern(e);
      e.fireTimer=e.fireRate;
    }
    if(dist<e.r+game.player.r&&game.player.invincible<=0){
      damagePlayer(e.dmg);
      e.hp-=25;
      spawnParticle(e.x,e.y,Math.atan2(e.y-game.player.y,e.x-game.player.x),3,'#ff4444',400);
      if(e.hp<=0)killEnemy(e,ei);
    }
  });
}

function fireEnemyPattern(e){
  const px=game.player.x,py=game.player.y;
  const angle=Math.atan2(py-e.y,px-e.x);
  switch(e.pattern){
    case 'aim':spawnEBullet(e.x,e.y,angle,e.bulletSpeed,e.dmg,'#ff5555');break;
    case 'spread':
      for(let i=-1;i<=1;i++)spawnEBullet(e.x,e.y,angle+i*0.28,e.bulletSpeed,e.dmg*0.7,'#ffaa33');
      break;
    case 'ring':
      for(let i=0;i<e.bulletCount;i++)spawnEBullet(e.x,e.y,(Math.PI*2/e.bulletCount)*i,e.bulletSpeed,e.dmg*0.55,'#aa3333');
      break;
    case 'burst':
      for(let i=0;i<e.bulletCount;i++)spawnEBullet(e.x,e.y,angle+(Math.random()-0.5)*0.7,e.bulletSpeed*(0.8+Math.random()*0.4),e.dmg*0.5,'#ffdd55');
      break;
    case 'mix':
      spawnEBullet(e.x,e.y,angle,e.bulletSpeed,e.dmg,'#ff3388',0.35);
      for(let i=-1;i<=1;i++)spawnEBullet(e.x,e.y,angle+i*0.4,e.bulletSpeed*0.85,e.dmg*0.55,'#ff3388');
      break;
    case 'accel':
      for(let i=0;i<e.bulletCount;i++){
        const a=angle+(i-e.bulletCount/2)*0.18;
        game.eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,r:5,dmg:e.dmg*0.55,color:'#aa55ff',life:4000,accel:0.09,angle:a,trail:[]});
      }
      break;
    case 'laser':
      for(let i=-2;i<=2;i++)spawnEBullet(e.x,e.y,angle+i*0.22,e.bulletSpeed*1.6,e.dmg*0.85,'#33ffaa');
      // Laser warning
      game.flashTexts.push({x1:e.x,y1:e.y,x2:px,y2:py,life:400,color:'#ff0000'});
      break;
    case 'homing':
      for(let i=0;i<e.bulletCount;i++){
        const a=angle+(Math.random()-0.5)*0.6;
        game.eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.bulletSpeed*0.65,vy:Math.sin(a)*e.bulletSpeed*0.65,r:6,dmg:e.dmg*0.7,color:'#ff77cc',life:3500,homing:0.04,trail:[]});
      }
      break;
  }
}

function spawnEBullet(x,y,angle,speed,dmg,color,homing){
  game.eBullets.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:5,dmg,color,life:4000,homing:homing||0,accel:0,trail:[]});
}

function updateBoss(dt){
  const b=game.boss;
  b.phaseTimer+=dt;
  b.x+=Math.sin(globalTime*0.0012)*b.speed*(dt/16);
  b.x=Math.max(b.r,Math.min(W-b.r,b.x));
  const hpRatio=b.hp/b.maxHp;
  if(!b.isMini){
    if(hpRatio<0.3&&b.phase<2){b.phase=2;b.fireRate*=0.65;addText(W/2,210,'🔥 绝望模式!','#ff0000',32,2500);screenShake=25;slowMotion=600;}
    else if(hpRatio<0.6&&b.phase<1){b.phase=1;b.fireRate*=0.78;addText(W/2,210,'⚡ 狂暴模式!','#ff4444',28,2500);screenShake=15;}
  }
  b.fireTimer-=dt;
  if(b.fireTimer<=0){bossAttack(b);b.fireTimer=b.fireRate;}
  if(b.hp<=0)killBoss();
}

function bossAttack(b){
  const px=game.player.x,py=game.player.y;
  const angle=Math.atan2(py-b.y,px-b.x);
  b.attackIdx=(b.attackIdx+1)%6;
  const idx=b.attackIdx;
  const mult=b.isMini?1:(1+b.phase*0.45);
  if(idx===0){
    const n=Math.floor((b.isMini?14:24)*mult);
    for(let i=0;i<n;i++)spawnEBullet(b.x,b.y,(Math.PI*2/n)*i,b.bulletSpeed,b.dmg*0.5,b.color);
  }else if(idx===1){
    const n=Math.floor((b.isMini?6:11)*mult);
    for(let i=0;i<n;i++)spawnEBullet(b.x,b.y,angle+(i-n/2)*0.18,b.bulletSpeed,b.dmg*0.6,b.color);
  }else if(idx===2){
    const layers=b.isMini?2:4;
    for(let l=0;l<layers;l++)for(let i=0;i<10;i++)spawnEBullet(b.x,b.y,globalTime*0.004+(Math.PI*2/10)*i+l*0.25,b.bulletSpeed*(0.65+l*0.12),b.dmg*0.4,b.color);
  }else if(idx===3){
    const n=Math.floor((b.isMini?5:10)*mult);
    for(let i=0;i<n;i++)game.eBullets.push({x:b.x,y:b.y,vx:Math.cos(Math.random()*Math.PI*2)*2.5,vy:Math.sin(Math.random()*Math.PI*2)*2.5,r:6,dmg:b.dmg*0.5,color:b.color,life:4000,homing:0.038,trail:[]});
  }else if(idx===4){
    const n=Math.floor((b.isMini?10:20)*mult);
    for(let i=0;i<n;i++){const a=angle+(Math.random()-0.5)*1.8;game.eBullets.push({x:b.x,y:b.y,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8,r:5,dmg:b.dmg*0.4,color:b.color,life:4000,accel:0.065,angle:a,trail:[]});}
  }else if(idx===5){
    for(let i=0;i<14;i++)spawnEBullet(b.x,b.y,(Math.PI*2/14)*i,b.bulletSpeed*0.85,b.dmg*0.35,b.color);
    for(let i=0;i<5;i++)spawnEBullet(b.x,b.y,angle+(i-2)*0.22,b.bulletSpeed*1.3,b.dmg*0.75,b.color);
  }
}

function updateBullets(dt){
  for(let i=game.bullets.length-1;i>=0;i--){
    const b=game.bullets[i];
    b.life-=dt;
    if(b.life<=0){game.bullets.splice(i,1);continue;}
    if(b.trail){b.trail.push({x:b.x,y:b.y});if(b.trail.length>10)b.trail.shift();}
    if(b.homing>0){
      let nearest=null,nd=Infinity;
      game.enemies.forEach(e=>{const d=Math.hypot(e.x-b.x,e.y-b.y);if(d<nd&&d<450){nd=d;nearest=e;}});
      if(nearest){
        const ta=Math.atan2(nearest.y-b.y,nearest.x-b.x);
        const ca=Math.atan2(b.vy,b.vx);
        let da=ta-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
        const na=ca+da*b.homing;
        const s=Math.hypot(b.vx,b.vy);
        b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;
      }
    }
    b.x+=b.vx*(dt/16);b.y+=b.vy*(dt/16);
    if(b.isMelee){
      b.x=game.player.x+Math.cos(b.angle)*35;
      b.y=game.player.y+Math.sin(b.angle)*35;
    }
    if(b.x<-60||b.x>W+60||b.y<-60||b.y>H+60){
      if(b.bounce>0){if(b.x<0||b.x>W)b.vx*=-1;if(b.y<0||b.y>H)b.vy*=-1;b.bounce--;}
      else{game.bullets.splice(i,1);continue;}
    }
    let hit=false;
    for(let j=game.enemies.length-1;j>=0;j--){
      const e=game.enemies[j];
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        const isBoss=e===game.boss;
        const dmg=b.dmg*(isBoss?game.player.bossDmg:1)*(1+(game.player.talentCounts['火力强化']||0)*0.20);
        e.hp-=dmg;
        if(game.player.lifeSteal>0)game.player.hp=Math.min(game.player.maxHp,game.player.hp+dmg*game.player.lifeSteal);
        if(b.crit){addText(e.x,e.y-25,'暴击!','#ff66ff',18,600);screenShake=4;for(let k=0;k<6;k++)spawnParticle(e.x,e.y,Math.random()*Math.PI*2,2+Math.random()*4,'#ff66ff',500);}
        if(b.isExplosive){
          const r=game.player.explodeRadius*(1+(game.player.talentCounts['爆裂弹头']||0)*0.30);
          game.enemies.forEach(en=>{if(Math.hypot(en.x-b.x,en.y-b.y)<r){en.hp-=b.dmg*0.55;if(en.hp<=0&&en!==e)killEnemy(en,game.enemies.indexOf(en));}});
          for(let k=0;k<16;k++)spawnParticle(b.x,b.y,Math.random()*Math.PI*2,3+Math.random()*4,'#ff6644',700);
          game.particles.push({x:b.x,y:b.y,r:5,maxR:r,life:500,color:'#ff6644',type:'explosion'});
        }
        b.pierce--;
        if(b.pierce<0){hit=true;break;}
        if(e.hp<=0){if(isBoss)killBoss();else killEnemy(e,j);}
      }
    }
    if(hit)game.bullets.splice(i,1);
  }
}

function updateEBullets(dt){
  for(let i=game.eBullets.length-1;i>=0;i--){
    const b=game.eBullets[i];
    b.life-=dt;
    if(b.life<=0){game.eBullets.splice(i,1);continue;}
    if(b.trail){b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();}
    if(b.accel>0){b.vx+=Math.cos(b.angle)*b.accel;b.vy+=Math.sin(b.angle)*b.accel;}
    if(b.homing>0){
      const ta=Math.atan2(game.player.y-b.y,game.player.x-b.x);
      const ca=Math.atan2(b.vy,b.vx);
      let da=ta-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      const na=ca+da*b.homing;
      const s=Math.hypot(b.vx,b.vy);
      b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;
    }
    b.x+=b.vx*(dt/16);b.y+=b.vy*(dt/16);
    const p=game.player;
    if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r&&p.invincible<=0){
      damagePlayer(b.dmg);game.eBullets.splice(i,1);
      for(let k=0;k<5;k++)spawnParticle(b.x,b.y,Math.random()*Math.PI*2,2+Math.random()*3,'#ff4444',400);
    }else if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40){
      game.eBullets.splice(i,1);
    }
  }
}

function damagePlayer(dmg){
  const p=game.player;
  if(Math.random()<p.dodgeChance){addText(p.x,p.y-35,'闪避!','#88ff88',17,700);return;}
  const reduction=1-(p.talentCounts['坚韧护甲']||0)*0.15;
  let actual=dmg*reduction;
  if(p.shield>0){const absorb=Math.min(p.shield,actual);p.shield-=absorb;actual-=absorb;}
  p.hp-=actual;
  p.invincible=450;
  game.screenFlash=1.2;
  screenShake=8;
  if(p.hp<=0&&(p.talentCounts['涅槃重生']||0)>p.revives){
    p.revives++;
    p.hp=p.maxHp*0.55;
    p.shield=p.maxShield*0.35;
    p.invincible=2500;
    addText(p.x,p.y-55,'🔥 涅槃重生!','#ff4444',26,2500);
    screenShake=20;
    slowMotion=400;
    for(let i=0;i<40;i++)spawnParticle(p.x,p.y,Math.random()*Math.PI*2,4+Math.random()*5,'#ff4444',1200);
  }
}

function killEnemy(e,idx){
  game.enemies.splice(idx,1);
  game.kills++;meta.totalKills++;
  const p=game.player;
  p.combo++;p.comboTime=3000+(p.talentCounts['连击延长']||0)*2000;
  const comboMul=Math.min(1+p.combo*0.06,3.5);
  const baseScore=e.score*game.diffMul.score*comboMul;
  const baseGold=e.score*0.18*game.diffMul.gold*p.goldMul*(1+(p.talentCounts['赏金猎人']||0)*0.30);
  game.score+=Math.floor(baseScore);
  game.gold+=baseGold;
  addText(e.x,e.y,`+${Math.floor(baseScore)}`,'#ffcc00',15,900);

  // Epic death effects
  for(let i=0;i<14;i++)spawnParticle(e.x,e.y,Math.random()*Math.PI*2,2+Math.random()*5,e.color,900+Math.random()*500);
  for(let i=0;i<8;i++)spawnParticle(e.x,e.y,Math.random()*Math.PI*2,1+Math.random()*2,'#ffffff',700);
  game.particles.push({x:e.x,y:e.y,r:2,maxR:50,life:500,color:e.color,type:'shock'});
  game.particles.push({x:e.x,y:e.y,r:2,maxR:30,life:350,color:'#ffffff',type:'shock'});

  // Screen shake on combo
  if(p.combo>5)screenShake=Math.min(p.combo*0.8,12);

  const luck=meta.upgrades.luck*0.05;
  if(Math.random()<0.18+luck){
    const types=['hp','shield','gold','weapon'];
    const type=types[Math.floor(Math.random()*types.length)];
    game.drops.push({x:e.x,y:e.y,r:10,type,life:10000,vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2});
  }
  if((p.talentCounts['死亡绽放']||0)>0&&Math.random()<0.18){
    for(let i=0;i<14;i++){const a=(Math.PI*2/14)*i;game.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,r:5,dmg:p.weapons[p.weaponIdx].damage*2.2,color:'#ff4444',life:900,pierce:4,homing:0,trail:[]});}
  }
}

function killBoss(){
  const b=game.boss;
  game.boss=null;
  game.kills++;meta.totalKills++;
  const p=game.player;
  const comboMul=Math.min(1+p.combo*0.06,3.5);
  const baseScore=b.score*game.diffMul.score*comboMul;
  const baseGold=b.score*0.25*game.diffMul.gold*p.goldMul;
  game.score+=Math.floor(baseScore);
  game.gold+=baseGold;
  addText(W/2,H/2-30,`☠️ ${b.name} 陨落!`,'#ff4444',36,3000);
  addText(W/2,H/2+20,`+${Math.floor(baseScore)} 分`,'#ffcc00',24,3000);
  screenShake=30;slowMotion=1200;
  for(let i=0;i<80;i++)spawnParticle(b.x,b.y,Math.random()*Math.PI*2,3+Math.random()*7,b.color,1500+Math.random()*800);
  for(let i=0;i<12;i++)game.particles.push({x:b.x,y:b.y,r:2,maxR:100+i*25,life:700+i*120,color:b.color,type:'shock'});
  if(b.isFinal){
    game.state='victory';
    setTimeout(()=>showGameOver(true),3000);
  }
}

function spawnParticle(x,y,angle,speed,color,life){
  game.particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color,life,maxLife:life,r:2+Math.random()*4,type:'normal',rot:Math.random()*Math.PI*2,rotSpd:(Math.random()-0.5)*0.2});
}

function updateParticles(dt){
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.life-=dt;
    if(p.life<=0){game.particles.splice(i,1);continue;}
    if(p.type==='normal'){
      p.x+=p.vx*(dt/16);p.y+=p.vy*(dt/16);
      p.vx*=0.97;p.vy*=0.97;
      p.rot+=p.rotSpd*(dt/16);
    }else if(p.type==='shock'){
      p.r+=(p.maxR-p.r)*0.12*(dt/16);
    }else if(p.type==='explosion'){
      p.r+=(p.maxR-p.r)*0.15*(dt/16);
    }
  }
}

function updateMeteors(dt){
  if(Math.random()<0.002){
    const x=Math.random()*W;
    game.meteors.push({x,y:-20,vx:(Math.random()-0.5)*2,vy:3+Math.random()*4,r:1+Math.random()*2,life:3000,color:'#ffffff'});
  }
  for(let i=game.meteors.length-1;i>=0;i--){
    const m=game.meteors[i];
    m.life-=dt;m.x+=m.vx*(dt/16);m.y+=m.vy*(dt/16);
    if(m.y>H+20||m.life<=0)game.meteors.splice(i,1);
  }
}

function updateDrops(dt){
  for(let i=game.drops.length-1;i>=0;i--){
    const d=game.drops[i];
    d.life-=dt;
    if(d.life<=0){game.drops.splice(i,1);continue;}
    d.x+=d.vx*(dt/16);d.y+=d.vy*(dt/16);
    const p=game.player;
    const dist=Math.hypot(d.x-p.x,d.y-p.y);
    const range=p.pickupRange*(1+(p.talentCounts['引力场']||0)*0.50);
    if(dist<range){
      const angle=Math.atan2(p.y-d.y,p.x-d.x);
      d.x+=Math.cos(angle)*7*(dt/16);d.y+=Math.sin(angle)*7*(dt/16);
    }
    if(dist<d.r+p.r){
      if(d.type==='hp'){p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.25);addText(d.x,d.y,'+HP','#44ff44',15,700);}
      else if(d.type==='shield'){p.shield=Math.min(p.maxShield,p.shield+50);addText(d.x,d.y,'+护盾','#4488ff',15,700);}
      else if(d.type==='gold'){game.gold+=20;addText(d.x,d.y,'+20💰','#ffcc00',15,700);}
      else if(d.type==='weapon'){
        const avail=WEAPONS.filter(w=>!p.weapons.find(pw=>pw.id===w.id));
        if(avail.length>0){
          const nw=avail[Math.floor(Math.random()*avail.length)];
          p.weapons.push({...nw,level:1,xp:0});
          addText(d.x,d.y,`获得 ${nw.name}!`,'#ffcc00',18,1500);
        }else{
          p.weapons.forEach(w=>w.level=Math.min(5,w.level+1));
          addText(d.x,d.y,'全武器升级!','#ffaa00',18,1500);
        }
      }
      for(let k=0;k<8;k++)spawnParticle(d.x,d.y,Math.random()*Math.PI*2,2+Math.random()*3,'#ffcc00',500);
      game.drops.splice(i,1);
    }
  }
}

function addText(x,y,text,color,size,life){
  game.texts.push({x,y,text,color,size,life,vy:-1.2,alpha:1});
}

function updateTexts(dt){
  for(let i=game.texts.length-1;i>=0;i--){
    const t=game.texts[i];
    t.life-=dt;t.y+=t.vy*(dt/16);
    t.alpha=Math.min(1,t.life/400);
    if(t.life<=0)game.texts.splice(i,1);
  }
}

function handleDeath(){
  game.state='dead';
  screenShake=25;
  slowMotion=800;
  for(let i=0;i<60;i++)spawnParticle(game.player.x,game.player.y,Math.random()*Math.PI*2,4+Math.random()*6,'#ff4444',2000);
  for(let i=0;i<20;i++)game.particles.push({x:game.player.x,y:game.player.y,r:2,maxR:60+i*15,life:600+i*100,color:'#ff4444',type:'shock'});
  setTimeout(()=>showGameOver(false),2000);
}

function showGameOver(victory){
  document.getElementById('goldDisplay').style.display='none';
  document.getElementById('gameOverScreen').style.display='block';
  document.getElementById('goTitle').textContent=victory?'🎉 任务完成！':'💀 任务失败';
  document.getElementById('goTitle').style.color=victory?'#44ff88':'#ff4444';
  document.getElementById('goWave').textContent=game.wave;
  document.getElementById('goKills').textContent=game.kills;
  document.getElementById('goScore').textContent=Math.floor(game.score);
  document.getElementById('goGoldEarned').textContent=Math.floor(game.gold);
  const ratio=game.score/(game.wave*500+1);
  let rank='F';
  if(victory)rank='SSS';
  else if(ratio>10)rank='S';
  else if(ratio>6)rank='A';
  else if(ratio>3.5)rank='B';
  else if(ratio>2)rank='C';
  else if(ratio>1)rank='D';
  document.getElementById('goRank').textContent=rank;
  document.getElementById('goRank').style.color=rank==='SSS'?'#ffdd44':rank==='S'?'#ff8844':rank==='A'?'#44ff88':'#aaa';
  meta.gold+=Math.floor(game.gold);
  if(game.wave>meta.highWave)meta.highWave=game.wave;
  saveMeta();
}

function showTalentSelect(){
  game.state='talent';
  document.getElementById('talentScreen').style.display='block';
  document.getElementById('talentWave').textContent=game.wave;
  const opts=document.getElementById('talentOptions');
  opts.innerHTML='';
  const choices=[];
  const pool=TALENTS.filter(t=>{(game.player.talentCounts[t.name]||0)<t.max});
  for(let i=0;i<3;i++){
    if(pool.length===0)break;
    const idx=Math.floor(Math.random()*pool.length);
    choices.push(pool[idx]);
    pool.splice(idx,1);
  }
  choices.forEach(t=>{
    const count=game.player.talentCounts[t.name]||0;
    const div=document.createElement('div');
    div.className='talent-card';
    div.innerHTML=`<div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div><div class="t-rank">当前: ${count}/${t.max}</div>`;
    div.onclick=()=>selectTalent(t);
    opts.appendChild(div);
  });
  game.nextTalentWave+=5;
}

function selectTalent(t){
  game.player.talents.push(t);
  game.player.talentCounts[t.name]=(game.player.talentCounts[t.name]||0)+1;
  if(t.name==='生命强化')game.player.maxHp*=1.25;
  if(t.name==='护盾充能')game.player.shield=Math.min(game.player.maxShield,game.player.shield+50);
  if(t.name==='机动强化')game.player.speed*=1.15;
  if(t.name==='Boss杀手')game.player.bossDmg+=0.25;
  document.getElementById('talentScreen').style.display='none';
  game.state='playing';
  addText(game.player.x,game.player.y-45,`✨ ${t.name}`,'#bb88ff',20,1800);
  for(let i=0;i<12;i++)spawnParticle(game.player.x,game.player.y,Math.random()*Math.PI*2,2+Math.random()*4,'#bb88ff',800);
}

// ==================== RENDER ====================
function draw(){
  ctx.fillStyle='#02020a';ctx.fillRect(0,0,W,H);
  if(!game)return;

  ctx.save();
  if(screenShake>0){
    const sx=(Math.random()-0.5)*screenShake;
    const sy=(Math.random()-0.5)*screenShake;
    ctx.translate(sx,sy);
  }

  // Nebulas
  game.nebulas.forEach(n=>{
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,n.c);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
  });

  // Stars with twinkle
  game.stars.forEach(s=>{
    const twinkle=0.5+0.5*Math.sin(globalTime*0.003+s.x*0.01);
    ctx.fillStyle=`rgba(255,255,255,${s.b*twinkle})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
  });

  // Meteors
  game.meteors.forEach(m=>{
    ctx.strokeStyle=`rgba(255,255,255,${m.life/3000*0.8})`;
    ctx.lineWidth=m.r;
    ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*8,m.y-m.vy*8);ctx.stroke();
  });

  // Particles
  game.particles.forEach(p=>{
    if(p.type==='shock'||p.type==='explosion'){
      ctx.strokeStyle=p.color;ctx.lineWidth=p.type==='explosion'?3:2;
      ctx.globalAlpha=Math.min(1,p.life/(p.type==='explosion'?500:400))*0.6;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;
    }else{
      const alpha=p.life/p.maxLife;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.globalAlpha=alpha;
      ctx.beginPath();
      ctx.moveTo(p.r,0);ctx.lineTo(-p.r*0.5,p.r*0.5);ctx.lineTo(-p.r*0.5,-p.r*0.5);
      ctx.closePath();ctx.fill();
      ctx.restore();ctx.globalAlpha=1;
    }
  });

  // Drops with glow
  game.drops.forEach(d=>{
    const colors={hp:'#44ff44',shield:'#4488ff',gold:'#ffcc00',weapon:'#ff88ff'};
    const icons={hp:'♥',shield:'🛡',gold:'💰',weapon:'🔫'};
    ctx.shadowColor=colors[d.type];ctx.shadowBlur=15;
    ctx.fillStyle=colors[d.type];ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icons[d.type],d.x,d.y);
    // Pulse ring
    ctx.strokeStyle=colors[d.type];ctx.globalAlpha=0.3+0.3*Math.sin(globalTime*0.008);
    ctx.lineWidth=1;ctx.beginPath();ctx.arc(d.x,d.y,d.r+4+Math.sin(globalTime*0.01)*3,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  });

  // Player bullets with EPIC trails
  game.bullets.forEach(b=>{
    if(b.isMelee){
      ctx.save();ctx.translate(game.player.x,game.player.y);
      ctx.rotate(b.angle);
      const grad=ctx.createLinearGradient(0,0,40,0);
      grad.addColorStop(0,'rgba(255,136,255,0.9)');grad.addColorStop(1,'rgba(255,136,255,0)');
      ctx.fillStyle=grad;ctx.fillRect(0,-3,45,6);
      ctx.fillStyle='#ffffff';ctx.fillRect(0,-1,50,2);
      ctx.shadowColor='#ff88ff';ctx.shadowBlur=20;
      ctx.fillStyle='#ff88ff';ctx.beginPath();ctx.arc(42,0,4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;ctx.restore();
      return;
    }
    // Trail
    if(b.trail&&b.trail.length>1){
      for(let i=1;i<b.trail.length;i++){
        const tAlpha=(i/b.trail.length)*0.4;
        const tWidth=b.r*(i/b.trail.length)*0.8;
        ctx.strokeStyle=b.color;ctx.globalAlpha=tAlpha;ctx.lineWidth=tWidth;
        ctx.beginPath();ctx.moveTo(b.trail[i-1].x,b.trail[i-1].y);ctx.lineTo(b.trail[i].x,b.trail[i].y);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    // Bullet glow
    ctx.shadowColor=b.color;ctx.shadowBlur=15;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Core
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.35,0,Math.PI*2);ctx.fill();
    // Crit sparkle
    if(b.crit){
      ctx.strokeStyle='#ff66ff';ctx.lineWidth=1;ctx.globalAlpha=0.6;
      for(let i=0;i<4;i++){
        const a=(Math.PI*2/4)*i+globalTime*0.01;
        ctx.beginPath();ctx.moveTo(b.x+Math.cos(a)*b.r*1.5,b.y+Math.sin(a)*b.r*1.5);
        ctx.lineTo(b.x+Math.cos(a)*b.r*2.5,b.y+Math.sin(a)*b.r*2.5);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  });

  // Enemy bullets with danger glow
  game.eBullets.forEach(b=>{
    if(b.trail&&b.trail.length>1){
      for(let i=1;i<b.trail.length;i++){
        const tAlpha=(i/b.trail.length)*0.25;
        ctx.strokeStyle=b.color;ctx.globalAlpha=tAlpha;ctx.lineWidth=2.5;
        ctx.beginPath();ctx.moveTo(b.trail[i-1].x,b.trail[i-1].y);ctx.lineTo(b.trail[i].x,b.trail[i].y);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.shadowColor=b.color;ctx.shadowBlur=12;
    ctx.fillStyle=b.color;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffcccc';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*0.3,0,Math.PI*2);ctx.fill();
  });

  // Laser warnings
  if(game.flashTexts){
    game.flashTexts.forEach((ft,i)=>{
      ft.life-=16;
      if(ft.life<=0){game.flashTexts.splice(i,1);return;}
      ctx.strokeStyle=`rgba(255,0,0,${ft.life/400*0.6})`;ctx.lineWidth=2;ctx.setLineDash([8,8]);
      ctx.beginPath();ctx.moveTo(ft.x1,ft.y1);ctx.lineTo(ft.x2,ft.y2);ctx.stroke();ctx.setLineDash([]);
    });
  }

  // Enemies
  game.enemies.forEach(e=>{
    ctx.save();ctx.translate(e.x,e.y);
    if(e===game.boss){
      const pulse=1+Math.sin(globalTime*0.003)*0.06;
      const rotSpd=e.isFinal?0.008:0.005;
      ctx.rotate(globalTime*rotSpd);
      // Body
      ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=25;
      ctx.beginPath();
      const spikes=e.isFinal?14:10;
      for(let i=0;i<spikes*2;i++){
        const angle=(Math.PI*2/(spikes*2))*i;
        const r=i%2===0?e.r*pulse:e.r*0.55*pulse;
        if(i===0)ctx.moveTo(Math.cos(angle)*r,Math.sin(angle)*r);
        else ctx.lineTo(Math.cos(angle)*r,Math.sin(angle)*r);
      }
      ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      // Inner ring
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,e.r*0.6,0,Math.PI*2);ctx.stroke();
      // Eye
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,e.r*0.22,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#000';
      const ex=Math.cos(e.angle)*e.r*0.08,ey=Math.sin(e.angle)*e.r*0.08;
      ctx.beginPath();ctx.arc(ex,ey,e.r*0.12,0,Math.PI*2);ctx.fill();
      // HP bar
      const barW=e.r*2.2;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-barW/2,-e.r-16,barW,8);
      const hpGrad=ctx.createLinearGradient(-barW/2,-e.r-16,barW/2,-e.r-16);
      hpGrad.addColorStop(0,'#ff4444');hpGrad.addColorStop(0.5,'#ffaa00');hpGrad.addColorStop(1,'#44ff44');
      ctx.fillStyle=hpGrad;ctx.fillRect(-barW/2,-e.r-16,barW*(e.hp/e.maxHp),8);
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(-barW/2,-e.r-16,barW,8);
    }else{
      ctx.rotate(e.angle+Math.PI/2);
      // Glow for elite
      if(e.elite){ctx.shadowColor='#ffdd33';ctx.shadowBlur=18;}
      else{ctx.shadowColor=e.color;ctx.shadowBlur=10;}
      ctx.fillStyle=e.elite?'#ffdd33':e.color;
      ctx.beginPath();
      ctx.moveTo(0,-e.r);ctx.lineTo(e.r*0.75,e.r*0.55);ctx.lineTo(0,e.r*0.3);ctx.lineTo(-e.r*0.75,e.r*0.55);
      ctx.closePath();ctx.fill();ctx.shadowBlur=0;
      // Engine
      ctx.fillStyle=`rgba(255,${80+Math.random()*120},0,0.8)`;
      ctx.beginPath();ctx.moveTo(-4,e.r*0.4);ctx.lineTo(0,e.r*0.4+8+Math.random()*6);ctx.lineTo(4,e.r*0.4);ctx.fill();
      // HP bar small
      if(e.hp<e.maxHp){
        const bw=e.r*1.6;
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-bw/2,-e.r-10,bw,4);
        ctx.fillStyle='#ff4444';ctx.fillRect(-bw/2,-e.r-10,bw*(e.hp/e.maxHp),4);
      }
    }
    ctx.restore();
  });

  // Player ship
  const p=game.player;
  ctx.save();ctx.translate(p.x,p.y);
  if(p.invincible>0&&Math.floor(globalTime/80)%2===0)ctx.globalAlpha=0.4;
  // Glow
  ctx.shadowColor='#4488ff';ctx.shadowBlur=20;
  // Body
  ctx.fillStyle='#2266cc';
  ctx.beginPath();ctx.moveTo(0,-p.r-6);ctx.lineTo(p.r+4,p.r+2);ctx.lineTo(0,p.r*0.6);ctx.lineTo(-p.r-4,p.r+2);ctx.closePath();ctx.fill();
  // Detail
  ctx.fillStyle='#66aaff';
  ctx.beginPath();ctx.moveTo(0,-p.r-2);ctx.lineTo(p.r*0.4,p.r*0.3);ctx.lineTo(0,p.r*0.1);ctx.lineTo(-p.r*0.4,p.r*0.3);ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // Engine flame (animated)
  const flameH=12+Math.random()*10;
  const flameGrad=ctx.createLinearGradient(0,p.r,0,p.r+flameH);
  flameGrad.addColorStop(0,'rgba(255,200,50,0.9)');flameGrad.addColorStop(0.5,'rgba(255,100,0,0.6)');flameGrad.addColorStop(1,'rgba(255,50,0,0)');
  ctx.fillStyle=flameGrad;
  ctx.beginPath();ctx.moveTo(-5,p.r);ctx.quadraticCurveTo(0,p.r+flameH+5,5,p.r);ctx.fill();
  // Engine particles
  if(Math.random()<0.5)spawnParticle(p.x,p.y+p.r+5,Math.PI/2+(Math.random()-0.5)*0.4,1+Math.random()*2,'#ffaa00',400);
  ctx.globalAlpha=1;ctx.restore();

  // Skill aura
  if(p.skillActive){
    ctx.strokeStyle='rgba(255,220,50,0.3)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,35+Math.sin(globalTime*0.01)*5,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,220,50,0.08)';
    ctx.beginPath();ctx.arc(p.x,p.y,30,0,Math.PI*2);ctx.fill();
  }

  // Texts
  game.texts.forEach(t=>{
    ctx.fillStyle=t.color;ctx.globalAlpha=t.alpha;
    ctx.font=`bold ${t.size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=t.color;ctx.shadowBlur=10;
    ctx.fillText(t.text,t.x,t.y);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  });

  // HUD
  if(game.state==='playing'||game.state==='talent'){
    // HP bar with gradient
    const hpGrad=ctx.createLinearGradient(10,13,210,13);
    hpGrad.addColorStop(0,'#ff3333');hpGrad.addColorStop(0.5,'#ffaa00');hpGrad.addColorStop(1,'#44ff44');
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(10,8,200,18);
    ctx.fillStyle=hpGrad;ctx.fillRect(10,8,200*(p.hp/p.maxHp),18);
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(10,8,200,18);
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='left';
    ctx.fillText(`HP ${Math.ceil(p.hp)}/${p.maxHp}`,14,20);

    // Shield
    if(p.maxShield>0){
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,28,200,10);
      const shGrad=ctx.createLinearGradient(10,28,210,28);
      shGrad.addColorStop(0,'#2244aa');shGrad.addColorStop(1,'#66aaff');
      ctx.fillStyle=shGrad;ctx.fillRect(10,28,200*(p.shield/p.maxShield),10);
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.strokeRect(10,28,200,10);
    }

    // Wave
    ctx.fillStyle='#66ccff';ctx.font='bold 20px sans-serif';ctx.textAlign='left';
    ctx.shadowColor='#4488ff';ctx.shadowBlur=10;
    ctx.fillText(`波次 ${game.wave}/50`,10,56);
    ctx.shadowBlur=0;

    // Score
    ctx.fillStyle='#ffcc00';ctx.font='14px sans-serif';
    ctx.fillText(`分数: ${Math.floor(game.score)}`,10,74);

    // Weapon
    const w=p.weapons[p.weaponIdx];
    ctx.fillStyle=w.color;ctx.font='bold 14px sans-serif';
    ctx.fillText(`${w.icon} ${w.name} Lv.${w.level}`,10,92);

    // Skill cooldown ring
    const cx=50,cy=H-50,r=22;
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    const skillRatio=Math.max(0,1-p.skillCooldown/12000);
    const skillColor=p.skillActive?'#ffdd44':skillRatio>=1?'#44ff88':'#ff4444';
    ctx.strokeStyle=skillColor;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*skillRatio);ctx.stroke();
    ctx.fillStyle=skillColor;ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.skillActive?'⚡':Math.ceil(p.skillCooldown/1000)+'s',cx,cy);

    // Combo
    if(p.combo>1){
      const comboSize=16+Math.min(p.combo,12)*1.5;
      ctx.fillStyle='#ff8844';ctx.font=`bold ${comboSize}px sans-serif`;ctx.textAlign='center';
      ctx.shadowColor='#ff8844';ctx.shadowBlur=15;
      ctx.fillText(`${p.combo}x 连击!`,W/2,45);
      ctx.shadowBlur=0;
    }

    // Minimap
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(W-90,8,80,60);
    ctx.fillStyle='#ff4444';ctx.font='11px sans-serif';ctx.textAlign='right';
    ctx.fillText(`敌人 ${game.enemies.length}`,W-12,22);
    ctx.fillStyle='#ffaa00';ctx.fillText(`弹幕 ${game.eBullets.length}`,W-12,38);
    ctx.fillStyle='#66ccff';ctx.fillText(`击杀 ${game.kills}`,W-12,54);

    // Danger indicator when many bullets
    if(game.eBullets.length>40){
      ctx.fillStyle='rgba(255,0,0,0.15+0.1*Math.sin(globalTime*0.01))';
      ctx.fillRect(0,0,W,H);
    }
  }

  ctx.restore();

  // Screen flash
  if(game.screenFlash>0){
    ctx.fillStyle=`rgba(255,0,0,${Math.min(0.5,game.screenFlash*0.25)})`;
    ctx.fillRect(0,0,W,H);
  }

  // Victory flash
  if(game.state==='victory'){
    ctx.fillStyle=`rgba(255,255,200,${0.15+0.1*Math.sin(globalTime*0.005)})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ==================== MAIN LOOP ====================
function loop(timestamp){
  if(!lastTime)lastTime=timestamp;
  let dt=timestamp-lastTime;
  lastTime=timestamp;
  if(dt>100)dt=100;
  if(slowMotion>0)dt*=0.25;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ==================== UI LOGIC ====================
let selectedDiff='easy';
let selectedWeapon=0;

function initTitle(){
  loadMeta();
  document.getElementById('metaGold').textContent=meta.gold;
  document.getElementById('metaWave').textContent=meta.highWave;
  document.getElementById('metaKills').textContent=meta.totalKills;
  document.getElementById('metaGames').textContent=meta.gamesPlayed;

  const grid=document.getElementById('weaponSelect');
  grid.innerHTML='';
  WEAPONS.forEach((w,i)=>{
    const div=document.createElement('div');
    div.className='weapon-card'+(i===0?' selected':'');
    div.dataset.id=w.id;
    div.innerHTML=`<div class="w-icon">${w.icon}</div><div class="w-name">${w.name}</div><div class="w-desc">${w.desc}</div>`;
    div.onclick=()=>selectSingleWeapon(w.id,div);
    grid.appendChild(div);
  });

  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDiff=btn.dataset.diff;
    };
  });
}

function selectSingleWeapon(id,el){
  selectedWeapon=id;
  document.querySelectorAll('.weapon-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

document.getElementById('startBtn').onclick=()=>{
  startGame(selectedDiff,selectedWeapon);
};

document.getElementById('shopBtn').onclick=()=>{
  document.getElementById('titleScreen').style.display='none';
  document.getElementById('shopScreen').style.display='block';
  refreshShop();
};

document.getElementById('backBtn').onclick=()=>{
  document.getElementById('shopScreen').style.display='none';
  document.getElementById('titleScreen').style.display='block';
  initTitle();
};

document.getElementById('resetBtn').onclick=()=>{
  if(confirm('确定重置所有存档吗？此操作不可恢复！')){resetMeta();initTitle();}
};

document.getElementById('restartBtn').onclick=()=>{
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('titleScreen').style.display='block';
  initTitle();
};

document.getElementById('goShopBtn').onclick=()=>{
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('shopScreen').style.display='block';
  refreshShop();
};

function refreshShop(){
  document.getElementById('shopGold').textContent=meta.gold;
  const grid=document.getElementById('upgradeGrid');
  grid.innerHTML='';
  UPGRADES.forEach(u=>{
    const level=meta.upgrades[u.id];
    const cost=Math.floor(u.baseCost*Math.pow(1.38,level));
    const maxed=level>=u.max;
    const div=document.createElement('div');
    div.className='upgrade-card';
    div.innerHTML=`<div class="u-name">${u.name}</div><div class="u-desc">${u.desc}</div><div class="u-level">等级 ${level}/${u.max}</div><div class="u-cost">${maxed?'已满级':`💰 ${cost}`}</div><button class="btn btn-gold" style="margin-top:8px;font-size:13px;padding:6px 18px;" ${maxed||meta.gold<cost?'disabled':''} onclick="buyUpgrade('${u.id}')">${maxed?'已满级':'升级'}</button>`;
    grid.appendChild(div);
  });
}

function buyUpgrade(id){
  const u=UPGRADES.find(x=>x.id===id);
  const level=meta.upgrades[id];
  if(level>=u.max)return;
  const cost=Math.floor(u.baseCost*Math.pow(1.38,level));
  if(meta.gold<cost)return;
  meta.gold-=cost;
  meta.upgrades[id]++;
  saveMeta();
  refreshShop();
}

// Init
document.addEventListener('DOMContentLoaded',initTitle);
</script>
