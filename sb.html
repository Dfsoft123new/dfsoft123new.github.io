<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星际猎手：终极进化 v6.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
    width: 100%; height: 100%;
    background: #050510;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
    color: #fff;
    user-select: none;
    touch-action: none;
}
#gameCanvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    cursor: none;
}
#ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
}
#ui > * { pointer-events: auto; }
.screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(3,3,15,0.95);
    z-index: 100;
    overflow-y: auto;
    padding: 20px;
}
.screen.hidden { display: none !important; }
h1 {
    font-size: clamp(28px, 6vw, 52px);
    background: linear-gradient(90deg, #00d4ff, #ff00aa, #ffdd00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    text-align: center;
}
.subtitle { font-size: clamp(14px, 3vw, 18px); color: #88aaff; margin-bottom: 20px; text-align: center; }
.btn-group { display: flex; gap: 10px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
.btn {
    padding: 10px 20px;
    font-size: clamp(13px, 2.5vw, 16px);
    border: 2px solid #00d4ff;
    background: rgba(0,212,255,0.1);
    color: #00d4ff;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
    font-family: inherit;
    min-width: 80px;
}
.btn:hover, .btn:active { background: rgba(0,212,255,0.3); transform: scale(1.05); }
.btn.selected { background: rgba(0,212,255,0.5); color: #fff; box-shadow: 0 0 20px rgba(0,212,255,0.5); }
.btn-start {
    font-size: clamp(16px, 4vw, 22px);
    padding: 12px 40px;
    background: linear-gradient(90deg, #ff0044, #ff8800);
    border: none;
    color: #fff;
    margin-top: 15px;
}
.btn-start:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,68,0,0.6); }
.info-box {
    background: rgba(0,15,35,0.85);
    border: 1px solid #003366;
    border-radius: 10px;
    padding: 12px 20px;
    margin: 8px;
    max-width: 600px;
    width: 90%;
    text-align: center;
}
.info-box h3 { color: #ffdd00; margin-bottom: 6px; font-size: clamp(14px, 3vw, 18px); }
.info-box p { color: #aaccff; font-size: clamp(11px, 2.5vw, 14px); line-height: 1.5; }
.hud {
    position: absolute;
    pointer-events: none;
    z-index: 50;
}
#hudTop { top: 8px; left: 10px; }
#hudTop div { margin: 2px 0; font-size: clamp(11px, 2.5vw, 14px); text-shadow: 0 0 5px #000; }
#hudRight { top: 8px; right: 10px; text-align: right; }
#hudRight div { margin: 2px 0; font-size: clamp(10px, 2.2vw, 13px); text-shadow: 0 0 5px #000; }
.bar-container {
    width: clamp(120px, 25vw, 200px); height: 12px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 2px;
}
.bar-fill { height: 100%; border-radius: 5px; transition: width 0.2s; }
.hp-bar { background: linear-gradient(90deg, #ff0044, #ff4488); }
.shield-bar { background: linear-gradient(90deg, #0088ff, #44aaff); }
.skill-bar { background: linear-gradient(90deg, #ffaa00, #ffdd44); }
.combo-bar {
    width: clamp(100px, 20vw, 150px); height: 5px;
    background: rgba(0,0,0,0.5);
    border-radius: 3px;
    margin-top: 3px;
    overflow: hidden;
}
.combo-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff0044, #ff8800, #ffdd00, #00ff88, #0088ff, #8800ff);
    border-radius: 3px;
    transition: width 0.3s;
}
#talentScreen .talent-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 15px 0;
    max-width: 600px;
    width: 90%;
}
@media(min-width: 600px) {
    #talentScreen .talent-grid { grid-template-columns: repeat(4, 1fr); }
}
.talent-card {
    background: rgba(0,15,40,0.9);
    border: 2px solid #1a3366;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
}
.talent-card:hover, .talent-card:active { border-color: #00d4ff; transform: translateY(-2px); }
.talent-card.selected { border-color: #ffdd00; background: rgba(60,45,0,0.8); box-shadow: 0 0 12px rgba(255,221,0,0.3); }
.talent-card .t-name { font-size: clamp(12px, 2.5vw, 14px); color: #ffdd00; font-weight: bold; }
.talent-card .t-desc { font-size: clamp(10px, 2vw, 11px); color: #88aaff; margin-top: 3px; }
.talent-card .t-lv { font-size: 9px; color: #ff8800; margin-top: 2px; }
#messageArea {
    position: absolute;
    top: 35%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 60;
    text-align: center;
    width: 100%;
}
.float-text {
    position: absolute;
    font-size: clamp(14px, 3vw, 18px);
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 0 8px #000;
    animation: floatUp 1.2s ease-out forwards;
    white-space: nowrap;
}
@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
}
.event-banner {
    position: absolute;
    top: 20%; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(18px, 5vw, 28px);
    font-weight: bold;
    color: #ffdd00;
    text-shadow: 0 0 20px rgba(255,221,0,0.8);
    pointer-events: none;
    z-index: 55;
    animation: bannerIn 2s ease-out forwards;
    white-space: nowrap;
}
@keyframes bannerIn {
    0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
    20% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    80% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.weapon-icon {
    display: inline-block;
    width: clamp(24px, 5vw, 30px);
    height: clamp(24px, 5vw, 30px);
    border-radius: 4px;
    text-align: center;
    line-height: clamp(24px, 5vw, 30px);
    margin: 1px;
    border: 1px solid #444;
    font-size: clamp(12px, 2.5vw, 16px);
    background: rgba(0,0,0,0.5);
}
.weapon-icon.active { border-color: #ffdd00; box-shadow: 0 0 8px rgba(255,221,0,0.5); background: rgba(80,60,0,0.5); }
#weaponBar {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    z-index: 50;
    pointer-events: none;
}
/* 移动端虚拟摇杆 */
#joystickZone {
    position: absolute;
    bottom: 80px;
    left: 20px;
    width: 120px;
    height: 120px;
    z-index: 40;
    display: none;
}
#joystickBase {
    position: absolute;
    width: 100%; height: 100%;
    border: 2px solid rgba(0,212,255,0.3);
    border-radius: 50%;
    background: rgba(0,212,255,0.05);
}
#joystickKnob {
    position: absolute;
    width: 40px; height: 40px;
    background: rgba(0,212,255,0.5);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px rgba(0,212,255,0.5);
}
#skillBtn {
    position: absolute;
    bottom: 80px;
    right: 20px;
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 2px solid rgba(255,136,0,0.5);
    background: rgba(255,136,0,0.15);
    color: #ff8800;
    font-size: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 40;
    pointer-events: auto;
}
#skillBtn.cooldown { opacity: 0.4; }
#autoFireToggle {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 40;
    font-size: 11px;
    padding: 5px 10px;
    display: none;
}
</style>
<base target="_blank">
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div id="mainScreen" class="screen">
        <h1>星际猎手：终极进化</h1>
        <div class="subtitle">撑过50波，击败宇宙毁灭者！</div>
        <div class="info-box">
            <h3>选择难度</h3>
            <div class="btn-group" id="difficultyGroup">
                <button class="btn selected" data-diff="0">简单</button>
                <button class="btn" data-diff="1">普通</button>
                <button class="btn" data-diff="2">困难</button>
                <button class="btn" data-diff="3">地狱</button>
            </div>
        </div>
        <div class="info-box">
            <h3>选择初始武器</h3>
            <div class="btn-group" id="weaponGroup">
                <button class="btn selected" data-wp="0">散射炮</button>
                <button class="btn" data-wp="1">激光炮</button>
                <button class="btn" data-wp="2">追踪弹</button>
                <button class="btn" data-wp="3">霰弹枪</button>
            </div>
            <p id="weaponDesc">扇形散射，覆盖范围广，适合清理杂兵</p>
        </div>
        <button class="btn btn-start" id="startBtn">开始任务</button>
        <div class="info-box" style="margin-top:12px;">
            <p><b>PC:</b> 鼠标移动 | 空格大招 | 数字键1-8切武器<br>
            <b>手机:</b> 左摇杆移动 | 右按钮大招 | 自动射击</p>
        </div>
    </div>

    <div id="talentScreen" class="screen hidden">
        <h1 style="font-size:clamp(24px,5vw,36px);">天赋觉醒</h1>
        <div class="subtitle">第 <span id="talentWave">5</span> 波 - 选择一项天赋</div>
        <div class="talent-grid" id="talentGrid"></div>
        <button class="btn btn-start" id="confirmTalent">确认选择</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h1 id="goTitle" style="font-size:clamp(28px,6vw,48px);">任务失败</h1>
        <div class="subtitle" id="goScore">最终得分: 0</div>
        <div class="info-box">
            <p id="goStats">存活波数: 0 | 击杀敌人: 0 | 最高连击: 0</p>
        </div>
        <button class="btn btn-start" id="restartBtn">重新开始</button>
    </div>

    <div id="hud" class="hidden">
        <div id="hudTop" class="hud">
            <div>HP: <span id="hudHp">100</span>/<span id="hudMaxHp">100</span></div>
            <div class="bar-container"><div class="bar-fill hp-bar" id="hpBar" style="width:100%"></div></div>
            <div>Shield: <span id="hudShield">0</span></div>
            <div class="bar-container"><div class="bar-fill shield-bar" id="shieldBar" style="width:0%"></div></div>
            <div>Skill: <span id="hudSkill">Ready</span></div>
            <div class="bar-container"><div class="bar-fill skill-bar" id="skillBar" style="width:100%"></div></div>
            <div style="margin-top:6px;">Combo: <span id="hudCombo">0</span> (x<span id="hudComboMul">1.0</span>)</div>
            <div class="combo-bar"><div class="combo-fill" id="comboBar" style="width:0%"></div></div>
        </div>
        <div id="hudRight" class="hud">
            <div>Score: <span id="hudScore">0</span></div>
            <div>Wave: <span id="hudWave">1</span>/50</div>
            <div>Kills: <span id="hudKills">0</span></div>
            <div id="enemyCount">Enemies: 0</div>
            <div style="margin-top:8px;font-size:11px;color:#88aaff;">Weapon:</div>
            <div id="hudWeapon" style="color:#ffdd00;font-size:14px;">散射炮 Lv.1</div>
        </div>
        <div id="weaponBar"></div>
    </div>
    <div id="messageArea"></div>

    <!-- 移动端控件 -->
    <div id="joystickZone">
        <div id="joystickBase"></div>
        <div id="joystickKnob"></div>
    </div>
    <div id="skillBtn">
        <div>SKILL</div>
        <div id="skillCdText" style="font-size:10px;">Ready</div>
    </div>
    <button class="btn" id="autoFireToggle">自动射击: 开</button>
</div>

<script>
// ==================== 配置 ====================
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');
let W, H;
const IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

function resize() {
    W = CANVAS.width = window.innerWidth;
    H = CANVAS.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const DIFFICULTY = [
    { name: '简单', hpMul: 0.7, speedMul: 0.7, dmgMul: 0.5, dropMul: 2.0, scoreMul: 0.5, healOnMax: 50, bulletMul: 0.6 },
    { name: '普通', hpMul: 1.0, speedMul: 1.0, dmgMul: 1.0, dropMul: 1.3, scoreMul: 1.0, healOnMax: 40, bulletMul: 1.0 },
    { name: '困难', hpMul: 1.8, speedMul: 1.3, dmgMul: 1.8, dropMul: 1.0, scoreMul: 2.0, healOnMax: 30, bulletMul: 1.4 },
    { name: '地狱', hpMul: 3.0, speedMul: 1.7, dmgMul: 3.0, dropMul: 0.8, scoreMul: 3.5, healOnMax: 20, bulletMul: 1.8 }
];

const WEAPONS = [
    { name: '散射炮', icon: '🔫', desc: '扇形散射', color: '#00ff88', dmg: 18, speed: 7, fireRate: 150, pierce: 0, skill: '弹幕风暴', skillDur: 3000 },
    { name: '激光炮', icon: '⚡', desc: '穿透贯穿', color: '#00d4ff', dmg: 12, speed: 20, fireRate: 80, pierce: 8, skill: '超载模式', skillDur: 5000 },
    { name: '追踪弹', icon: '🎯', desc: '自动锁定', color: '#ff44aa', dmg: 22, speed: 6, fireRate: 180, pierce: 0, skill: '天基打击', skillDur: 4000 },
    { name: '霰弹枪', icon: '💥', desc: '贴脸爆发', color: '#ff8800', dmg: 14, speed: 8, fireRate: 300, pierce: 0, skill: '爆裂冲击', skillDur: 2000 },
    { name: '环形炮', icon: '🌀', desc: '环绕射击', color: '#aa44ff', dmg: 18, speed: 5, fireRate: 220, pierce: 1, skill: '环绕护盾', skillDur: 5000 },
    { name: '狙击炮', icon: '🔭', desc: '高伤单发', color: '#ff0044', dmg: 100, speed: 22, fireRate: 500, pierce: 5, skill: '贯穿射线', skillDur: 3000 },
    { name: '导弹巢', icon: '🚀', desc: '范围爆炸', color: '#ffdd00', dmg: 35, speed: 5, fireRate: 350, pierce: 0, skill: '集束轰炸', skillDur: 3000 },
    { name: '光束剑', icon: '⚔️', desc: '近战斩击', color: '#ffffff', dmg: 8, speed: 0, fireRate: 40, pierce: 99, skill: '剑刃风暴', skillDur: 3000 }
];

const WEAPON_UPGRADES = [
    { dmg: 1.5, fireRate: 0.75, speed: 1.2 },
    { dmg: 2.0, fireRate: 0.6, speed: 1.3 },
    { dmg: 2.8, fireRate: 0.48, speed: 1.45 },
    { dmg: 4.0, fireRate: 0.38, speed: 1.6 },
    { dmg: 6.0, fireRate: 0.28, speed: 1.8 }
];

const TALENTS = [
    { id: 'atkspd', name: '极速射击', type: 'atk', desc: '射速+20%', max: 3, eff: function() { game.player.atkSpdMul *= 1.20; } },
    { id: 'power', name: '火力强化', type: 'atk', desc: '子弹伤害+30%', max: 3, eff: function() { game.player.dmgMul *= 1.30; } },
    { id: 'crit', name: '暴击精通', type: 'atk', desc: '暴击率+15%,暴伤+35%', max: 3, eff: function() { game.player.critRate += 0.15; game.player.critDmg += 0.35; } },
    { id: 'pierce', name: '穿透强化', type: 'atk', desc: '穿透+2', max: 3, eff: function() { game.player.pierceAdd += 2; } },
    { id: 'multi', name: '多重射击', type: 'atk', desc: '额外发射+1', max: 3, eff: function() { game.player.extraShot += 1; } },
    { id: 'explode', name: '爆裂弹头', type: 'atk', desc: '击杀时30%爆炸', max: 3, eff: function() { game.player.explodeChance += 0.30; } },
    { id: 'bosskiller', name: 'Boss杀手', type: 'atk', desc: '对Boss伤害+35%', max: 3, eff: function() { game.player.bossDmg += 0.35; } },
    { id: 'giant', name: '巨化弹体', type: 'atk', desc: '子弹大小+40%,伤害+15%', max: 3, eff: function() { game.player.bulletSizeMul *= 1.4; game.player.dmgMul *= 1.15; } },
    { id: 'hpup', name: '生命强化', type: 'def', desc: '最大生命+35', max: 3, eff: function() { game.player.maxHp += 35; game.player.hp += 35; } },
    { id: 'shieldup', name: '护盾充能', type: 'def', desc: '最大护盾+30', max: 3, eff: function() { game.player.maxShield += 30; game.player.shield += 30; } },
    { id: 'regen', name: '生命恢复', type: 'def', desc: '每秒恢复4生命', max: 3, eff: function() { game.player.hpRegen += 4; } },
    { id: 'lifesteal', name: '生命偷取', type: 'def', desc: '造成伤害的8%转为生命', max: 3, eff: function() { game.player.lifeSteal += 0.08; } },
    { id: 'armor', name: '坚韧护甲', type: 'def', desc: '受到伤害-20%', max: 3, eff: function() { game.player.dmgRed *= 0.80; } },
    { id: 'rebirth', name: '涅槃重生', type: 'def', desc: '死亡时70%生命复活(1次)', max: 1, eff: function() { game.player.rebirth = true; } },
    { id: 'shieldregen', name: '护盾再生', type: 'def', desc: '护盾每秒恢复5', max: 3, eff: function() { game.player.shieldRegen += 5; } },
    { id: 'dodge', name: '闪避步法', type: 'def', desc: '闪避率+15%', max: 3, eff: function() { game.player.dodge += 0.15; } },
    { id: 'move', name: '机动强化', type: 'mob', desc: '移动速度+20%', max: 3, eff: function() { game.player.speedMul *= 1.20; } },
    { id: 'magnet', name: '引力场', type: 'mob', desc: '拾取范围+70%', max: 3, eff: function() { game.player.magnetMul *= 1.7; } },
    { id: 'lucky', name: '幸运之星', type: 'mob', desc: '掉落率+30%', max: 3, eff: function() { game.player.dropMul *= 1.30; } },
    { id: 'combo', name: '连击延长', type: 'mob', desc: '连击持续时间+2秒', max: 3, eff: function() { game.player.comboTime += 2000; } },
    { id: 'bounty', name: '赏金猎人', type: 'mob', desc: '击杀分数+20%', max: 3, eff: function() { game.player.scoreMul *= 1.20; } },
    { id: 'cdred', name: '冷却缩减', type: 'mob', desc: '大招冷却-20%', max: 3, eff: function() { game.player.cdRed *= 0.80; } },
    { id: 'bloom', name: '死亡绽放', type: 'mob', desc: '低生命时伤害+40%', max: 3, eff: function() { game.player.lowHpDmg = true; } },
    { id: 'bounce', name: '子弹弹射', type: 'mob', desc: '子弹可弹射2次', max: 2, eff: function() { game.player.bounce += 2; } }
];

// 敌人配置 - 每种都有独特的弹幕模式
const ENEMY_TYPES = [
    { name: '基础战机', hp: 50, speed: 2.0, dmg: 15, score: 10, radius: 15, color: '#ff4444', shape: 'triangle',
      fireRate: 2.0, bulletSpeed: 3, bulletCount: 1, pattern: 'aim' },
    { name: '高速突击机', hp: 30, speed: 5.0, dmg: 10, score: 15, radius: 12, color: '#ff8800', shape: 'dart',
      fireRate: 1.2, bulletSpeed: 5, bulletCount: 3, pattern: 'spread' },
    { name: '重型坦克', hp: 200, speed: 1.0, dmg: 30, score: 40, radius: 26, color: '#884400', shape: 'hex',
      fireRate: 3.0, bulletSpeed: 2.5, bulletCount: 8, pattern: 'ring' },
    { name: '蜂群机', hp: 20, speed: 4.0, dmg: 8, score: 8, radius: 10, color: '#ffaa00', shape: 'small',
      fireRate: 0.6, bulletSpeed: 4, bulletCount: 2, pattern: 'burst' },
    { name: '精英战机', hp: 150, speed: 2.8, dmg: 20, score: 70, radius: 20, color: '#ff0088', shape: 'elite',

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x); }
function rand(a, b) { return Math.random() * (b - a) + a; }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

    startWave() {
        const d = DIFFICULTY[this.difficulty];
        this.waveActive = true;
        this.waveSpawned = 0;

        // 每10波大Boss
        if (this.wave % 10 === 0) {
            this.waveTotal = 1;
            this.enemies.push(createBoss(this.wave, this.difficulty));
            this.addEventText('第 ' + this.wave + ' 波 - 大Boss来袭！', '#ff0044');
        }
        // 每5波小Boss（但不是10波的倍数）
        else if (this.wave % 5 === 0) {
            this.waveTotal = 3 + Math.floor(this.wave * 0.5);
            this.enemies.push(createMiniBoss(this.wave, this.difficulty));
            this.addEventText('第 ' + this.wave + ' 波 - 小Boss出现！', '#ff8800');
        }
        else {
            const baseCount = 6 + Math.floor(this.wave * 1.8);
            this.waveTotal = Math.min(baseCount, 50);
        }
    }

    nextWave() {
        this.wave++;
        this.waveActive = true;
        this.waveSpawned = 0;
        this.waveClearTimer = 0;
        this.startWave();
    }

    spawnEnemy() {
        if (this.waveSpawned >= this.waveTotal) return;
        if (this.enemies.length >= 30) return;

        let typeIdx = 0;
        const r = Math.random();
        const w = this.wave;

        // 根据波数调整敌人类型分布
        if (w >= 45) {
            if (r < 0.05) typeIdx = 0; else if (r < 0.15) typeIdx = 1; else if (r < 0.25) typeIdx = 2;
            else if (r < 0.40) typeIdx = 3; else if (r < 0.55) typeIdx = 4; else if (r < 0.70) typeIdx = 5;
            else if (r < 0.85) typeIdx = 6; else typeIdx = 7;
        } else if (w >= 30) {
            if (r < 0.08) typeIdx = 0; else if (r < 0.20) typeIdx = 1; else if (r < 0.35) typeIdx = 2;
            else if (r < 0.50) typeIdx = 3; else if (r < 0.65) typeIdx = 4; else if (r < 0.80) typeIdx = 5;
            else typeIdx = 6;
        } else if (w >= 15) {
            if (r < 0.10) typeIdx = 0; else if (r < 0.25) typeIdx = 1; else if (r < 0.45) typeIdx = 2;
            else if (r < 0.65) typeIdx = 3; else if (r < 0.85) typeIdx = 4; else typeIdx = 5;
        } else {
            if (r < 0.30) typeIdx = 0; else if (r < 0.55) typeIdx = 1; else if (r < 0.80) typeIdx = 2;
            else typeIdx = 3;
        }

        this.enemies.push(createEnemy(typeIdx, this.wave, this.difficulty));
        this.waveSpawned++;
    }

    fireWeapon() {
        const p = this.player;
        const wpIdx = p.weapons[p.curWeapon];
        const wp = WEAPONS[wpIdx];
        const lv = p.weaponLv[wpIdx];
        const up = lv > 0 ? WEAPON_UPGRADES[lv - 1] : { dmg: 1, fireRate: 1, speed: 1 };

        let dmg = wp.dmg * up.dmg * p.dmgMul;
        if (p.powerTime > 0) dmg *= 2.5;
        if (p.lowHpDmg && p.hp < p.maxHp * 0.3) dmg *= 1.4;

        const spd = wp.speed * up.speed;
        const pierce = wp.pierce + p.pierceAdd;
        const size = (wpIdx === 7 ? 35 : 7) * p.bulletSizeMul * (lv > 2 ? 1.3 : 1);
        const fr = wp.fireRate * up.fireRate / p.atkSpdMul;
        p.fireTimer = p.atkSpdTime > 0 ? fr * 0.4 : fr;

        const isCrit = Math.random() < p.critRate;
        if (isCrit) dmg *= p.critDmg;

        const fireBullet = (ox, oy, ovx, ovy, extraDmg) => {
            this.bullets.push({
                x: p.x + ox, y: p.y + oy,
                vx: ovx, vy: ovy,
                dmg: (extraDmg || dmg), color: wp.color, pierce: pierce, size: size,
                weaponId: wpIdx, isSkill: false,
                trail: [], trailTimer: 0,
                bounces: 0, maxBounces: p.bounce,
                hitSet: new Set(), isCrit: isCrit
            });
        };

        const a = -Math.PI / 2;

        switch (wpIdx) {
            case 0: {
                const count = 3 + Math.floor(lv / 2);
                const spread = 0.45 + lv * 0.06;
                for (let i = 0; i < count; i++) {
                    const aa = a + (i - (count - 1) / 2) * spread;
                    fireBullet(0, -20, Math.cos(aa) * spd, Math.sin(aa) * spd);
                }
                break;
            }
            case 1:
                fireBullet(0, -20, Math.cos(a) * spd, Math.sin(a) * spd);
                break;
            case 2:
                fireBullet(0, -20, Math.cos(a) * spd * 0.5, Math.sin(a) * spd * 0.5);
                break;
            case 3: {
                for (let i = 0; i < 6 + lv * 2; i++) {
                    const aa = a + rand(-0.35, 0.35);
                    fireBullet(rand(-10, 10), -20, Math.cos(aa) * spd * rand(0.8, 1.3), Math.sin(aa) * spd * rand(0.8, 1.3));
                }
                break;
            }
            case 4:
                fireBullet(0, -20, Math.cos(a) * spd, Math.sin(a) * spd);
                break;
            case 5:
                fireBullet(0, -20, Math.cos(a) * spd, Math.sin(a) * spd);
                break;
            case 6:
                fireBullet(0, -20, Math.cos(a + rand(-0.2, 0.2)) * spd, Math.sin(a + rand(-0.2, 0.2)) * spd);
                break;
            case 7:
                break;
        }

        for (let i = 0; i < p.extraShot; i++) {
            const aa = a + rand(-0.3, 0.3);
            fireBullet(rand(-15, 15), -20, Math.cos(aa) * spd, Math.sin(aa) * spd);
        }
    }

    useSkill() {
        const p = this.player;
        if (p.skillCooldown > 0 || p.skillActive) return;

        const wpIdx = p.weapons[p.curWeapon];
        const wp = WEAPONS[wpIdx];

        p.skillActive = true;
        p.skillEndTime = Date.now() + wp.skillDur;
        p.skillCooldown = (12000 * p.cdRed);

        switch (wpIdx) {
            case 0:
                this.addEventText('弹幕风暴！', wp.color);
                break;
            case 1:
                this.addEventText('超载模式！', wp.color);
                break;
            case 2:
                this.addEventText('天基打击！', wp.color);
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => {
                        if (this.state !== 'playing') return;
                        for (let j = 0; j < 4; j++) {
                            const x = rand(50, W - 50);
                            this.addParticles(x, -30, '#ff4400', 5);
                            this.shake = 0.2;
                            for (let e of this.enemies) {
                                if (Math.abs(e.x - x) < 100) this.damageEnemy(e, 100, true);
                            }
                        }
                    }, i * 250);
                }
                break;
            case 3:
                this.addEventText('爆裂冲击！', wp.color);
                p.invincible = 2.5;
                for (let i = 0; i < 40; i++) {
                    const a = (i / 40) * Math.PI * 2;
                    this.bullets.push({
                        x: p.x, y: p.y,
                        vx: Math.cos(a) * 9, vy: Math.sin(a) * 9,
                        dmg: 60 * p.dmgMul, color: '#ff8800', pierce: 6, size: 12,
                        weaponId: wpIdx, isSkill: true,
                        trail: [], trailTimer: 0,
                        bounces: 0, maxBounces: 0,
                        hitSet: new Set(), isCrit: false
                    });
                }
                break;
            case 4:
                this.addEventText('环绕护盾！', wp.color);
                break;
            case 5:
                this.addEventText('贯穿射线！', wp.color);
                break;
            case 6:
                this.addEventText('集束轰炸！', wp.color);
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        if (this.state !== 'playing') return;
                        const x = rand(80, W - 80);
                        const y = rand(80, H / 2);
                        this.addParticles(x, y, '#ffdd00', 8);
                        for (let e of this.enemies) {
                            if (dist(e, {x:x,y:y}) < 120) this.damageEnemy(e, 80, true);
                        }
                        this.shake = 0.25;
                    }, i * 120);
                }
                break;
            case 7:
                this.addEventText('剑刃风暴！', wp.color);
                break;
        }
    }

    updateSkill(dt) {
        const p = this.player;
        const wpIdx = p.weapons[p.curWeapon];

        switch (wpIdx) {
            case 0:
                if (Math.random() < 0.4) {
                    const a = rand(0, Math.PI * 2);
                    const spd = WEAPONS[0].speed;
                    this.bullets.push({
                        x: p.x, y: p.y,
                        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                        dmg: 25 * p.dmgMul, color: '#00ff88', pierce: 3, size: 7,
                        weaponId: 0, isSkill: true,
                        trail: [], trailTimer: 0,
                        bounces: 0, maxBounces: 0,
                        hitSet: new Set(), isCrit: false
                    });
                }
                break;
            case 1:
                p.fireTimer -= dt * 1000 * 2.5;
                break;
            case 4: {
                const t = Date.now() * 0.004;
                for (let i = 0; i < 4; i++) {
                    const a = t + (i / 4) * Math.PI * 2;
                    const bx = p.x + Math.cos(a) * 70;
                    const by = p.y + Math.sin(a) * 70;
                    for (let j = this.enemies.length - 1; j >= 0; j--) {
                        const e = this.enemies[j];
                        if (dist({x:bx,y:by}, e) < e.radius + 18) {
                            this.damageEnemy(e, 35 * p.dmgMul * dt * 60, false);
                        }
                    }
                    for (let j = this.enemyBullets.length - 1; j >= 0; j--) {
                        const b = this.enemyBullets[j];
                        if (dist({x:bx,y:by}, b) < 22) {
                            this.enemyBullets.splice(j, 1);
                            this.addParticles(b.x, b.y, b.color, 3);
                        }
                    }
                }
                break;
            }
            case 5: {
                const a = -Math.PI / 2;
                for (let e of this.enemies) {
                    if (Math.abs(e.x - p.x) < 25 && e.y < p.y) {
                        this.damageEnemy(e, 300 * p.dmgMul * dt * 60, false);
                    }
                }
                this.addParticles(p.x + rand(-15, 15), p.y - rand(50, 250), '#ff0044', 2);
                break;
            }
            case 7: {
                const sa = Date.now() * 0.006;
                for (let i = 0; i < 6; i++) {
                    const aa = sa + (i / 6) * Math.PI * 2;
                    const sx = p.x + Math.cos(aa) * 90;
                    const sy = p.y + Math.sin(aa) * 90;
                    for (let e of this.enemies) {
                        if (dist({x:sx,y:sy}, e) < e.radius + 35) {
                            this.damageEnemy(e, 50 * p.dmgMul * dt * 60, false);
                        }
                    }
                }
                break;
            }
        }
    }

    damageEnemy(e, dmg, isInstant) {
        const p = this.player;
        if (e.isBoss || e.isMiniBoss) dmg *= (1 + p.bossDmg);

        e.hp -= dmg;
        e.flash = 1;

        if (p.lifeSteal > 0) {
            p.hp = Math.min(p.maxHp, p.hp + dmg * p.lifeSteal);
        }

        if (e.hp <= 0) {
            this.killEnemy(e);
        } else if (isInstant || Math.random() < 0.4) {
            this.addParticles(e.x, e.y, e.color, 4);
        }
    }

    killEnemy(e) {
        const p = this.player;
        let scoreMul = 1 + Math.floor(p.combo / 10) * 0.25;
        if (p.scoreMulTime > 0) scoreMul *= 2.5;
        const pts = Math.floor(e.score * p.scoreMul * scoreMul);
        this.score += pts;

        p.combo++;
        p.comboTimer = p.comboTime;
        if (p.combo > this.maxCombo) this.maxCombo = p.combo;

        this.kills++;

        this.addFloatText(e.x, e.y, '+' + pts, '#ffdd00');
        if (p.combo >= 10 && p.combo % 10 === 0) {
            this.addFloatText(e.x, e.y - 30, p.combo + '连击！', '#ff0088');
        }

        // 华丽击杀特效
        this.addParticles(e.x, e.y, e.color, 20);
        this.addParticles(e.x, e.y, '#ffdd00', 12);
        this.addParticles(e.x, e.y, '#ffffff', 8);

        // 碎片
        for (let i = 0; i < 12; i++) {
            const a = rand(0, Math.PI * 2);
            const s = rand(2, 7);
            this.particles.push({
                x: e.x, y: e.y,
                vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                life: 2, maxLife: 2,
                color: e.color, size: rand(3, 8), type: 'gravity',
                rot: rand(0, Math.PI * 2), rotSpd: rand(-3, 3),
                update: function(dt) {
                    this.x += this.vx * dt * 60;
                    this.y += this.vy * dt * 60;
                    this.vy += 0.12;
                    this.vx *= 0.98;
                    this.rot += this.rotSpd * dt;
                    this.life -= dt;
                    return this.life > 0;
                },
                draw: function(ctx) {
                    const a = this.life / this.maxLife;
                    ctx.globalAlpha = a;
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rot);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                    ctx.restore();
                    ctx.globalAlpha = 1;
                }
            });
        }

        // 多层冲击波
        for (let ring = 0; ring < 3; ring++) {
            this.particles.push({
                x: e.x, y: e.y,
                vx: 0, vy: 0,
                life: 0.6 + ring * 0.15, maxLife: 0.6 + ring * 0.15,
                color: e.color, size: e.radius + ring * 20, type: 'ring',
                delay: ring * 0.08,
                timer: 0,
                update: function(dt) {
                    this.timer += dt;
                    if (this.timer < this.delay) return true;
                    this.life -= dt;
                    this.size += 120 * dt;
                    return this.life > 0;
                },
                draw: function(ctx) {
                    if (this.timer < this.delay) return;
                    const a = this.life / this.maxLife;
                    ctx.globalAlpha = a * 0.4;
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 4 - (this.maxLife - this.life) * 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            });
        }

        // 爆裂弹头
        if (p.explodeChance > 0 && Math.random() < p.explodeChance) {
            for (let other of this.enemies) {
                if (other !== e && dist(e, other) < 120) {
                    other.hp -= 40 * p.dmgMul;
                    other.flash = 1;
                    if (other.hp <= 0) this.killEnemy(other);
                }
            }
            this.addParticles(e.x, e.y, '#ff8800', 15);
            this.shake = 0.3;
        }

        // 自爆
        const base = ENEMY_TYPES[e.typeIdx];
        if (base && base.explodeRadius) {
            for (let other of this.enemies) {
                if (other !== e && dist(e, other) < base.explodeRadius) {
                    other.hp -= 50;
                    other.flash = 1;
                    if (other.hp <= 0) this.killEnemy(other);
                }
            }
            this.shake = 0.4;
            this.addParticles(e.x, e.y, '#ff0000', 20);
        }

        // 分裂
        if (base && base.splitCount && !e.splitSpawned) {
            e.splitSpawned = true;
            for (let i = 0; i < base.splitCount; i++) {
                const child = createEnemy(3, this.wave, this.difficulty);
                child.x = e.x + rand(-40, 40);
                child.y = e.y + rand(-40, 40);
                child.hp = child.maxHp * 0.4;
                this.enemies.push(child);
            }
        }

        // Boss击杀
        if (e.isBoss || e.isMiniBoss) {
            this.slowMoTimer = e.isBoss ? 2.0 : 1.0;
            this.shake = e.isBoss ? 1.2 : 0.6;
            this.flashColor = e.isFinal ? '#ffdd00' : '#ff0044';
            this.flashTimer = 0.6;
            if (e.isFinal) {
                this.victory();
                return;
            }
        }

        this.spawnDrop(e.x, e.y);
        const idx = this.enemies.indexOf(e);
        if (idx >= 0) this.enemies.splice(idx, 1);
    }

    spawnDrop(x, y) {
        const p = this.player;
        const d = DIFFICULTY[this.difficulty];
        if (Math.random() > d.dropMul * p.dropMul * 0.7) return;

        let cum = 0;
        const r = Math.random();
        for (let i = 0; i < DROP_TYPES.length; i++) {
            cum += DROP_TYPES[i].chance;
            if (r < cum) {
                this.drops.push(createDrop(x, y, i));
                return;
            }
        }
    }

    addParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            if (this.particles.length > 200) break;
            this.particles.push(createParticle(x, y, color, rand(2, 7), rand(0.3, 1.0), rand(2, 6), 'friction'));
        }
    }

    addFloatText(x, y, text, color) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.color = color;
        document.getElementById('messageArea').appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    addEventText(text, color) {
        const el = document.createElement('div');
        el.className = 'event-banner';
        el.textContent = text;
        el.style.color = color;
        document.getElementById('messageArea').appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }

    triggerEvent() {
        const r = Math.random();
        if (r < 0.3) {
            this.addEventText('陨石雨！', '#ff8800');
            for (let i = 0; i < 8; i++) {
                this.meteors.push({
                    x: rand(0, W), y: -60,
                    vx: rand(-2, 2), vy: rand(4, 8),
                    size: rand(12, 30), life: 6
                });
            }
        } else if (r < 0.6) {
            this.addEventText('精英突袭！', '#ff0044');
            for (let i = 0; i < 4; i++) {
                this.enemies.push(createEnemy(4, this.wave + 8, this.difficulty));
            }
        } else {
            this.addEventText('补给降临！', '#00ff88');
            for (let i = 0; i < 4; i++) {
                const idx = randInt(1, 4);
                this.drops.push(createDrop(rand(100, W - 100), -30, idx));
            }
        }
    }

    showTalentSelect() {
        this.state = 'talent';
        document.getElementById('talentWave').textContent = this.wave;
        const grid = document.getElementById('talentGrid');
        grid.innerHTML = '';

        const options = [];
        const pool = TALENTS.slice();
        for (let i = 0; i < 4; i++) {
            const idx = randInt(0, pool.length - 1);
            options.push(pool[idx]);
            pool.splice(idx, 1);
        }

        let selected = null;
        options.forEach((t) => {
            const card = document.createElement('div');
            card.className = 'talent-card';
            const lv = this.player.talents[t.id] || 0;
            const maxed = lv >= t.max;
            card.innerHTML = '<div class="t-name">' + t.name + '</div><div class="t-desc">' + t.desc + '</div><div class="t-lv">等级: ' + lv + '/' + t.max + '</div>';
            if (maxed) card.style.opacity = '0.5';
            card.onclick = () => {
                if (maxed) return;
                document.querySelectorAll('.talent-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selected = t;
            };
            grid.appendChild(card);
        });

        document.getElementById('confirmTalent').onclick = () => {
            if (!selected) return;
            const lv = this.player.talents[selected.id] || 0;
            if (lv >= selected.max) return;
            this.player.talents[selected.id] = lv + 1;
            selected.eff();
            this.addEventText('获得天赋: ' + selected.name, '#ffdd00');
            document.getElementById('talentScreen').classList.add('hidden');
            this.state = 'playing';
            this.nextWave();
        };

        document.getElementById('talentScreen').classList.remove('hidden');
    }

    victory() {
        this.state = 'victory';
        document.getElementById('goTitle').textContent = '任务完成！';
        document.getElementById('goTitle').style.background = 'linear-gradient(90deg, #ffdd00, #ff8800)';
        document.getElementById('goTitle').style.webkitBackgroundClip = 'text';
        document.getElementById('goTitle').style.webkitTextFillColor = 'transparent';
        document.getElementById('goScore').textContent = '最终得分: ' + this.score;
        document.getElementById('goStats').textContent = '存活波数: ' + this.wave + ' | 击杀敌人: ' + this.kills + ' | 最高连击: ' + this.maxCombo;
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        if (IS_MOBILE) {
            document.getElementById('joystickZone').style.display = 'none';
            document.getElementById('skillBtn').style.display = 'none';
            document.getElementById('autoFireToggle').style.display = 'none';
        }
    }

    gameOver() {
        this.state = 'gameover';
        document.getElementById('goTitle').textContent = '任务失败';
        document.getElementById('goTitle').style.background = 'linear-gradient(90deg, #ff0044, #ff8800)';
        document.getElementById('goTitle').style.webkitBackgroundClip = 'text';
        document.getElementById('goTitle').style.webkitTextFillColor = 'transparent';
        document.getElementById('goScore').textContent = '最终得分: ' + this.score;
        document.getElementById('goStats').textContent = '存活波数: ' + this.wave + ' | 击杀敌人: ' + this.kills + ' | 最高连击: ' + this.maxCombo;
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('hud').classList.add('hidden');
        if (IS_MOBILE) {
            document.getElementById('joystickZone').style.display = 'none';
            document.getElementById('skillBtn').style.display = 'none';
            document.getElementById('autoFireToggle').style.display = 'none';
        }
    }

    updateHUD() {
        const p = this.player;
        document.getElementById('hudHp').textContent = Math.floor(p.hp);
        document.getElementById('hudMaxHp').textContent = p.maxHp;
        document.getElementById('hpBar').style.width = (p.hp / p.maxHp * 100) + '%';
        document.getElementById('hudShield').textContent = Math.floor(p.shield);
        document.getElementById('shieldBar').style.width = (p.maxShield > 0 ? p.shield / p.maxShield * 100 : 0) + '%';
        const cdMax = 12000 * p.cdRed;
        document.getElementById('hudSkill').textContent = p.skillCooldown > 0 ? Math.ceil(p.skillCooldown / 1000) + 's' : '就绪';
        document.getElementById('skillBar').style.width = p.skillCooldown > 0 ? (1 - p.skillCooldown / cdMax) * 100 + '%' : '100%';
        if (IS_MOBILE) {
            const btn = document.getElementById('skillBtn');
            const txt = document.getElementById('skillCdText');
            if (p.skillCooldown > 0) {
                btn.classList.add('cooldown');
                txt.textContent = Math.ceil(p.skillCooldown / 1000) + 's';
            } else {
                btn.classList.remove('cooldown');
                txt.textContent = 'Ready';
            }
        }
        document.getElementById('hudCombo').textContent = p.combo;
        const comboMul = 1 + Math.floor(p.combo / 10) * 0.25;
        document.getElementById('hudComboMul').textContent = comboMul.toFixed(1);
        document.getElementById('comboBar').style.width = Math.min(100, p.combo * 3) + '%';
        document.getElementById('hudScore').textContent = this.score;
        document.getElementById('hudWave').textContent = this.wave;
        document.getElementById('hudKills').textContent = this.kills;
        document.getElementById('enemyCount').textContent = '敌人: ' + this.enemies.length;
        const wpIdx = p.weapons[p.curWeapon];
        document.getElementById('hudWeapon').textContent = WEAPONS[wpIdx].name + ' Lv.' + (p.weaponLv[wpIdx] + 1);
    }

    updateWeaponBar() {
        const bar = document.getElementById('weaponBar');
        bar.innerHTML = '';
        for (let i = 0; i < 8; i++) {
            const el = document.createElement('div');
            el.className = 'weapon-icon' + (i === this.player.weapons[this.player.curWeapon] ? ' active' : '');
            el.textContent = this.player.weaponUnlocked[i] ? WEAPONS[i].icon : '?';
            el.style.opacity = this.player.weaponUnlocked[i] ? '1' : '0.3';
            bar.appendChild(el);
        }
    }

    update(dt) {
        if (this.state !== 'playing') return;

        if (this.slowMoTimer > 0) {
            this.slowMoTimer -= dt;
            this.slowMo = lerp(this.slowMo, 0.25, 0.1);
        } else {
            this.slowMo = lerp(this.slowMo, 1, 0.08);
        }
        dt *= this.slowMo;

        const p = this.player;

        // 玩家移动 - PC鼠标 / 手机摇杆
        if (IS_MOBILE && this.joystick.active) {
            p.x += this.joystick.dx * p.speed * p.speedMul * dt * 60;
            p.y += this.joystick.dy * p.speed * p.speedMul * dt * 60;
        } else {
            p.x = lerp(p.x, mouse.x, 0.15 * p.speedMul);
            p.y = lerp(p.y, mouse.y, 0.15 * p.speedMul);
        }
        p.x = clamp(p.x, 20, W - 20);
        p.y = clamp(p.y, 20, H - 20);

        if (p.hpRegen > 0) p.hp = Math.min(p.maxHp, p.hp + p.hpRegen * dt);
        if (p.shieldRegen > 0) p.shield = Math.min(p.maxShield, p.shield + p.shieldRegen * dt);

        if (p.magnetTime > 0) p.magnetTime -= dt;
        if (p.atkSpdTime > 0) p.atkSpdTime -= dt;
        if (p.powerTime > 0) p.powerTime -= dt;
        if (p.scoreMulTime > 0) p.scoreMulTime -= dt;
        if (p.invincible > 0) p.invincible -= dt;
        if (p.skillCooldown > 0) p.skillCooldown -= dt * 1000;
        if (p.skillActive && Date.now() > p.skillEndTime) p.skillActive = false;
        if (p.comboTimer > 0) {
            p.comboTimer -= dt * 1000;
            if (p.comboTimer <= 0) p.combo = 0;
        }

        p.fireTimer -= dt * 1000;
        if ((p.fireTimer <= 0 && p.weapons.length > 0) || (IS_MOBILE && this.autoFire && p.fireTimer <= 0)) {
            this.fireWeapon();
        }

        if (p.skillActive) this.updateSkill(dt);

        // 波次生成
        if (this.waveActive && this.waveSpawned < this.waveTotal) {
            this.waveTimer += dt;
            const spawnInterval = Math.max(0.2, 1.2 - this.wave * 0.015);
            if (this.waveTimer >= spawnInterval) {
                this.waveTimer = 0;
                this.spawnEnemy();
            }
        }

        if (this.waveActive && this.waveSpawned >= this.waveTotal && this.enemies.length === 0) {
            this.waveClearTimer += dt;
            if (this.waveClearTimer > 1.5) {
                this.waveClearTimer = 0;
                this.waveActive = false;
                if (this.wave >= 50) { this.victory(); return; }
                if (this.wave % 5 === 0) { this.showTalentSelect(); return; }
                this.nextWave();
            }
        }

        this.eventTimer += dt;
        if (this.eventTimer > 12 && !this.eventActive) {
            this.eventTimer = 0;
            this.triggerEvent();
        }

        // 更新玩家子弹
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            const b = this.bullets[i];
            b.trailTimer += dt;
            if (b.trailTimer > 0.015) {
                b.trailTimer = 0;
                b.trail.push({ x: b.x, y: b.y });
                if (b.trail.length > 8) b.trail.shift();
            }
            b.x += b.vx * dt * 60;
            b.y += b.vy * dt * 60;

            if (b.bounces < b.maxBounces) {
                if (b.x < 0 || b.x > W) { b.vx *= -1; b.bounces++; b.x = clamp(b.x, 0, W); }
                if (b.y < 0 || b.y > H) { b.vy *= -1; b.bounces++; b.y = clamp(b.y, 0, H); }
            }

            let alive = b.x > -50 && b.x < W + 50 && b.y > -50 && b.y < H + 50 && b.pierce >= 0;
            if (!alive) { this.bullets.splice(i, 1); continue; }

            for (let j = this.enemies.length - 1; j >= 0; j--) {
                const e = this.enemies[j];
                if (b.hitSet.has(e)) continue;
                if (dist(b, e) < e.radius + b.size) {
                    b.hitSet.add(e);
                    // 暴击特效
                    if (b.isCrit) {
                        this.addParticles(b.x, b.y, '#ff00ff', 6);
                        this.shake = 0.1;
                    }
                    this.damageEnemy(e, b.dmg, true);
                    if (!b.isSkill) {
                        b.pierce--;
                        if (b.pierce < 0) {
                            this.addParticles(b.x, b.y, b.color, 6);
                            this.bullets.splice(i, 1);
                            alive = false;
                            break;
                        }
                    }
                }
            }
            if (!alive) continue;

            if (b.weaponId === 2 && !b.isSkill) {
                let nearest = null, minD = 350;
                for (let e of this.enemies) {
                    const d = dist(b, e);
                    if (d < minD) { minD = d; nearest = e; }
                }
                if (nearest) {
                    const ta = angle(b, nearest);
                    const ca = Math.atan2(b.vy, b.vx);
                    let da = ta - ca;
                    while (da > Math.PI) da -= Math.PI * 2;
                    while (da < -Math.PI) da += Math.PI * 2;
                    const na = ca + da * 0.06;
                    const spd = Math.hypot(b.vx, b.vy);
                    b.vx = Math.cos(na) * spd;
                    b.vy = Math.sin(na) * spd;
                }
            }
        }
        if (this.bullets.length > 150) this.bullets.splice(0, this.bullets.length - 150);

        // 更新敌人子弹（弹幕！）
        for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
            const b = this.enemyBullets[i];
            if (b.homing && b.target) {
                const ta = angle(b, b.target);
                const ca = Math.atan2(b.vy, b.vx);
                let da = ta - ca;
                while (da > Math.PI) da -= Math.PI * 2;
                while (da < -Math.PI) da += Math.PI * 2;
                const na = ca + da * b.homingStrength;
                const spd = Math.hypot(b.vx, b.vy);
                b.vx = Math.cos(na) * spd;
                b.vy = Math.sin(na) * spd;
            }
            if (b.accel) {
                b.vx *= 1.02; b.vy *= 1.02;
            }
            if (b.wave) {
                b.wavePhase += dt * 5;
                b.vx = Math.cos(b.wavePhase) * b.waveAmp;
            }
            b.x += b.vx * dt * 60;
            b.y += b.vy * dt * 60;
            b.trail.push({ x: b.x, y: b.y });
            if (b.trail.length > 5) b.trail.shift();

            if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
                this.enemyBullets.splice(i, 1);
                continue;
            }
            if (dist(b, p) < 18 + b.radius && p.invincible <= 0) {
                this.damagePlayer(b.dmg);
                this.enemyBullets.splice(i, 1);
                this.addParticles(p.x, p.y, '#ff0044', 6);
                this.shake = 0.15;
            }
        }
        if (this.enemyBullets.length > 200) this.enemyBullets.splice(0, this.enemyBullets.length - 200);

        // 更新敌人
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            const e = this.enemies[i];
            if (!e.update(dt, p, this)) {
                this.enemies.splice(i, 1);
                continue;
            }
            if (dist(e, p) < e.radius + 16 && p.invincible <= 0) {
                this.damagePlayer(e.dmg);
                e.hp -= 25;
                e.flash = 1;
                if (e.hp <= 0) this.killEnemy(e);
            }
        }

        // 更新掉落物
        const magnetR = 100 * p.magnetMul + (p.magnetTime > 0 ? 250 : 0);
        for (let i = this.drops.length - 1; i >= 0; i--) {
            const d = this.drops[i];
            if (!d.update(dt)) { this.drops.splice(i, 1); continue; }
            const md = dist(d, p);
            if (md < magnetR) {
                const a = angle(d, p);
                const spd = lerp(2, 10, 1 - md / magnetR);
                d.x += Math.cos(a) * spd * dt * 60;
                d.y += Math.sin(a) * spd * dt * 60;
            }
            if (md < 25) {
                this.collectDrop(d);
                this.drops.splice(i, 1);
            }
        }

        // 更新粒子
        for (let i = this.particles.length - 1; i >= 0; i--) {
            if (!this.particles[i].update(dt)) this.particles.splice(i, 1);
        }
        if (this.particles.length > 200) this.particles.splice(0, this.particles.length - 200);

        // 更新流星
        for (let i = this.meteors.length - 1; i >= 0; i--) {
            const m = this.meteors[i];
            m.x += m.vx * dt * 60;
            m.y += m.vy * dt * 60;
            m.life -= dt;
            if (m.life <= 0 || m.y > H + 50) { this.meteors.splice(i, 1); continue; }
            if (dist(m, p) < m.size + 16 && p.invincible <= 0) {
                this.damagePlayer(25);
                this.meteors.splice(i, 1);
            }
        }

        // 背景
        for (let s of this.stars) {
            s.y += s.speed * dt * 60;
            s.twinkle += dt * 3;
            if (s.y > H) { s.y = 0; s.x = rand(0, W); }
        }
        for (let n of this.nebulas) {
            n.x += n.vx * dt * 60;
            n.y += n.vy * dt * 60;
            if (n.x < -n.radius) n.x = W + n.radius;
            if (n.x > W + n.radius) n.x = -n.radius;
            if (n.y < -n.radius) n.y = H + n.radius;
            if (n.y > H + n.radius) n.y = -n.radius;
        }

        if (this.shake > 0) this.shake *= 0.92;
        if (this.shake < 0.01) this.shake = 0;
        if (this.flashTimer > 0) this.flashTimer -= dt;

        this.updateHUD();
    }

    damagePlayer(dmg) {
        const p = this.player;
        if (p.invincible > 0) return;
        if (Math.random() < p.dodge) {
            this.addFloatText(p.x, p.y - 20, '闪避！', '#00ff88');
            return;
        }
        dmg *= p.dmgRed;
        if (p.shield > 0) {
            const absorb = Math.min(p.shield, dmg);
            p.shield -= absorb;
            dmg -= absorb;
        }
        p.hp -= dmg;
        this.shake = 0.5;
        this.flashColor = '#ff0000';
        this.flashTimer = 0.25;
        this.addParticles(p.x, p.y, '#ff0044', 10);

        if (p.hp <= 0) {
            if (p.rebirth && !p.rebirthUsed) {
                p.rebirthUsed = true;
                p.hp = p.maxHp * 0.7;
                p.invincible = 3;
                this.addEventText('涅槃重生！', '#ffdd00');
            } else {
                this.gameOver();
            }
        }
    }

    collectDrop(d) {
        const p = this.player;
        const info = DROP_TYPES[d.typeIdx];
        switch (info.type) {
            case 'upgrade': {
                const wpIdx = p.weapons[p.curWeapon];
                if (p.weaponLv[wpIdx] < 5) {
                    p.weaponLv[wpIdx]++;
                    this.addFloatText(p.x, p.y, WEAPONS[wpIdx].name + '升级！', '#00ff88');
                } else {
                    const heal = DIFFICULTY[this.difficulty].healOnMax;
                    p.hp = Math.min(p.maxHp, p.hp + heal);
                    this.addFloatText(p.x, p.y, '+' + heal + 'HP', '#ff4444');
                }
                break;
            }
            case 'heal': p.hp = Math.min(p.maxHp, p.hp + 35); this.addFloatText(p.x, p.y, '+35HP', '#ff4444'); break;
            case 'maxhp': p.maxHp += 20; p.hp += 20; this.addFloatText(p.x, p.y, '生命上限+20', '#ff0088'); break;
            case 'shield': p.maxShield += 15; p.shield = p.maxShield; this.addFloatText(p.x, p.y, '护盾+', '#0088ff'); break;
            case 'nuke':
                this.addEventText('核弹清屏！', '#ffdd00');
                for (let e of this.enemies.slice()) this.damageEnemy(e, 9999, true);
                this.shake = 0.6;
                break;
            case 'magnet': p.magnetTime = 10; this.addFloatText(p.x, p.y, '磁铁！', '#aa44ff'); break;
            case 'atkspd': p.atkSpdTime = 8; this.addFloatText(p.x, p.y, '攻速提升！', '#ff8800'); break;
            case 'power': p.powerTime = 8; this.addFloatText(p.x, p.y, '火力全开！', '#ff0044'); break;
            case 'score': p.scoreMulTime = 12; this.addFloatText(p.x, p.y, '分数x2.5！', '#ffdd00'); break;
            case 'chest': this.score += 800; p.hp = Math.min(p.maxHp, p.hp + 60); this.addFloatText(p.x, p.y, '宝箱！+800分', '#ffdd00'); break;
            case 'newwp': {
                const unlocked = [];
                for (let i = 0; i < 8; i++) if (!p.weaponUnlocked[i]) unlocked.push(i);
                if (unlocked.length > 0) {
                    const nw = unlocked[randInt(0, unlocked.length - 1)];
                    p.weaponUnlocked[nw] = true; p.weapons.push(nw);
                    this.addFloatText(p.x, p.y, '解锁' + WEAPONS[nw].name + '!', '#00d4ff');
                } else { this.score += 500; this.addFloatText(p.x, p.y, '+500分', '#ffdd00'); }
                break;
            }
        }
        this.updateWeaponBar();
    }

    draw() {
        CTX.fillStyle = '#050510';
        CTX.fillRect(0, 0, W, H);

        CTX.save();
        if (this.shake > 0) {
            CTX.translate(rand(-this.shake * 12, this.shake * 12), rand(-this.shake * 12, this.shake * 12));
        }

        // 星云
        for (let n of this.nebulas) {
            const g = CTX.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
            g.addColorStop(0, n.color + '33');
            g.addColorStop(0.5, n.color + '15');
            g.addColorStop(1, 'transparent');
            CTX.fillStyle = g;
            CTX.beginPath();
            CTX.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
            CTX.fill();
        }

        // 星星
        for (let s of this.stars) {
            const tw = Math.sin(s.twinkle) * 0.4 + 0.6;
            CTX.globalAlpha = s.alpha * tw;
            CTX.fillStyle = '#fff';
            CTX.beginPath();
            CTX.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            CTX.fill();
        }
        CTX.globalAlpha = 1;

        // 流星
        for (let m of this.meteors) {
            CTX.strokeStyle = '#ff8800';
            CTX.lineWidth = m.size * 0.4;
            CTX.beginPath();
            CTX.moveTo(m.x, m.y);
            CTX.lineTo(m.x - m.vx * 8, m.y - m.vy * 8);
            CTX.stroke();
            CTX.fillStyle = '#ffaa00';
            CTX.shadowColor = '#ff8800';
            CTX.shadowBlur = 15;
            CTX.beginPath();
            CTX.arc(m.x, m.y, m.size * 0.5, 0, Math.PI * 2);
            CTX.fill();
            CTX.shadowBlur = 0;
        }

        if (this.state === 'playing') {
            const p = this.player;

            // 掉落物
            for (let d of this.drops) d.draw(CTX);

            // 敌人子弹（弹幕！）- 带拖尾发光
            for (let b of this.enemyBullets) {
                CTX.save();
                // 拖尾
                if (b.trail && b.trail.length > 1) {
                    for (let i = 0; i < b.trail.length - 1; i++) {
                        const a = (i / b.trail.length) * 0.6;
                        CTX.globalAlpha = a;
                        CTX.strokeStyle = b.color;
                        CTX.lineWidth = b.radius * 0.5 * a;
                        CTX.lineCap = 'round';
                        CTX.beginPath();
                        CTX.moveTo(b.trail[i].x, b.trail[i].y);
                        CTX.lineTo(b.trail[i+1].x, b.trail[i+1].y);
                        CTX.stroke();
                    }
                }
                CTX.globalAlpha = 1;
                CTX.fillStyle = b.color;
                CTX.shadowColor = b.color;
                CTX.shadowBlur = 12;
                CTX.beginPath();
                CTX.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                CTX.fill();
                CTX.fillStyle = '#fff';
                CTX.shadowBlur = 0;
                CTX.beginPath();
                CTX.arc(b.x, b.y, b.radius * 0.4, 0, Math.PI * 2);
                CTX.fill();
                CTX.restore();
            }

            // 玩家子弹
            for (let b of this.bullets) {
                CTX.save();
                if (b.trail.length > 1) {
                    for (let i = 0; i < b.trail.length - 1; i++) {
                        const a = (i / b.trail.length) * 0.5;
                        CTX.globalAlpha = a;
                        CTX.strokeStyle = b.color;
                        CTX.lineWidth = b.size * 0.5 * a;
                        CTX.lineCap = 'round';
                        CTX.beginPath();
                        CTX.moveTo(b.trail[i].x, b.trail[i].y);
                        CTX.lineTo(b.trail[i+1].x, b.trail[i+1].y);
                        CTX.stroke();
                    }
                }
                CTX.globalAlpha = 1;
                CTX.fillStyle = '#fff';
                CTX.shadowColor = b.color;
                CTX.shadowBlur = b.isCrit ? 20 : 12;
                CTX.beginPath();
                CTX.arc(b.x, b.y, b.size * 0.4, 0, Math.PI * 2);
                CTX.fill();
                CTX.fillStyle = b.color;
                CTX.beginPath();
                CTX.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                CTX.fill();
                if (b.isCrit) {
                    CTX.strokeStyle = '#ff00ff';
                    CTX.lineWidth = 2;
                    CTX.beginPath();
                    CTX.arc(b.x, b.y, b.size + 4, 0, Math.PI * 2);
                    CTX.stroke();
                }
                CTX.shadowBlur = 0;
                CTX.restore();
            }

            // 技能特效
            if (p.skillActive) {
                const wpIdx = p.weapons[p.curWeapon];
                if (wpIdx === 5) {
                    CTX.save();
                    CTX.strokeStyle = '#ff0044';
                    CTX.lineWidth = 25;
                    CTX.shadowColor = '#ff0044';
                    CTX.shadowBlur = 40;
                    CTX.beginPath();
                    CTX.moveTo(p.x, p.y);
                    CTX.lineTo(p.x, -100);
                    CTX.stroke();
                    CTX.strokeStyle = '#ff8888';
                    CTX.lineWidth = 10;
                    CTX.beginPath();
                    CTX.moveTo(p.x, p.y);
                    CTX.lineTo(p.x, -100);
                    CTX.stroke();
                    CTX.restore();
                }
                if (wpIdx === 7) {
                    CTX.save();
                    const sa = Date.now() * 0.006;
                    for (let i = 0; i < 6; i++) {
                        const aa = sa + (i / 6) * Math.PI * 2;
                        CTX.strokeStyle = '#ffffff';
                        CTX.lineWidth = 5;
                        CTX.shadowColor = '#00d4ff';
                        CTX.shadowBlur = 20;
                        CTX.beginPath();
                        CTX.moveTo(p.x, p.y);
                        CTX.lineTo(p.x + Math.cos(aa) * 90, p.y + Math.sin(aa) * 90);
                        CTX.stroke();
                    }
                    CTX.restore();
                }
                if (wpIdx === 4) {
                    const t = Date.now() * 0.004;
                    for (let i = 0; i < 4; i++) {
                        const a = t + (i / 4) * Math.PI * 2;
                        CTX.fillStyle = 'rgba(170,68,255,0.6)';
                        CTX.shadowColor = '#aa44ff';
                        CTX.shadowBlur = 15;
                        CTX.beginPath();
                        CTX.arc(p.x + Math.cos(a) * 70, p.y + Math.sin(a) * 70, 12, 0, Math.PI * 2);
                        CTX.fill();
                    }
                    CTX.shadowBlur = 0;
                }
            }

            // 敌人
            for (let e of this.enemies) e.draw(CTX);

            // 粒子
            for (let p2 of this.particles) p2.draw(CTX);

            // 玩家飞船
            CTX.save();
            CTX.translate(p.x, p.y);

            // 引擎尾焰
            const flameH = 20 + Math.random() * 8;
            const flameW = 6 + Math.random() * 3;
            CTX.fillStyle = '#0044aa';
            CTX.globalAlpha = 0.7;
            CTX.beginPath();
            CTX.moveTo(-flameW, 12);
            CTX.lineTo(0, 12 + flameH);
            CTX.lineTo(flameW, 12);
            CTX.fill();
            CTX.fillStyle = '#0088ff';
            CTX.globalAlpha = 0.9;
            CTX.beginPath();
            CTX.moveTo(-flameW * 0.5, 12);
            CTX.lineTo(0, 12 + flameH * 0.7);
            CTX.lineTo(flameW * 0.5, 12);
            CTX.fill();
            CTX.fillStyle = '#ffffff';
            CTX.globalAlpha = 1;
            CTX.beginPath();
            CTX.moveTo(-2, 12);
            CTX.lineTo(0, 12 + flameH * 0.4);
            CTX.lineTo(2, 12);
            CTX.fill();

            // 飞船主体
            CTX.fillStyle = p.invincible > 0 && Math.floor(Date.now() / 80) % 2 === 0 ? '#ffffff' : '#00d4ff';
            CTX.shadowColor = '#00d4ff';
            CTX.shadowBlur = 20;
            CTX.beginPath();
            CTX.moveTo(0, -22);
            CTX.lineTo(-14, 14);
            CTX.lineTo(-7, 10);
            CTX.lineTo(0, 16);
            CTX.lineTo(7, 10);
            CTX.lineTo(14, 14);
            CTX.closePath();
            CTX.fill();
            CTX.shadowBlur = 0;

            // 机翼细节
            CTX.strokeStyle = '#0088aa';
            CTX.lineWidth = 1;
            CTX.beginPath();
            CTX.moveTo(0, -10);
            CTX.lineTo(0, 10);
            CTX.stroke();

            // 护盾
            if (p.shield > 0) {
                CTX.strokeStyle = 'rgba(0,136,255,0.4)';
                CTX.lineWidth = 2;
                CTX.beginPath();
                CTX.arc(0, 0, 26, 0, Math.PI * 2);
                CTX.stroke();
                CTX.fillStyle = 'rgba(0,136,255,0.08)';
                CTX.fill();
            }

            // 无敌光环
            if (p.invincible > 0) {
                CTX.strokeStyle = 'rgba(255,221,0,0.5)';
                CTX.lineWidth = 2;
                CTX.beginPath();
                CTX.arc(0, 0, 30 + Math.sin(Date.now() * 0.012) * 4, 0, Math.PI * 2);
                CTX.stroke();
            }

            CTX.restore();
        }

        if (this.flashTimer > 0) {
            CTX.fillStyle = this.flashColor;
            CTX.globalAlpha = this.flashTimer * 0.35;
            CTX.fillRect(0, 0, W, H);
            CTX.globalAlpha = 1;
        }

        CTX.restore();
    }
}

// ==================== 敌人系统（带弹幕！）====================

function createEnemy(typeIdx, wave, diff) {
    const base = ENEMY_TYPES[typeIdx];
    const waveMul = Math.pow(1.1, wave - 1);
    const d = DIFFICULTY[diff];

    const side = randInt(0, 3);
    let x, y;
    if (side === 0) { x = rand(50, W - 50); y = -40; }
    else if (side === 1) { x = W + 40; y = rand(50, H - 50); }
    else if (side === 2) { x = rand(50, W - 50); y = H + 40; }
    else { x = -40; y = rand(50, H - 50); }

    // 弹幕发射间隔根据难度调整
    const fireInterval = base.fireRate / (d.bulletMul * (1 + wave * 0.03));

    return {
        x: x, y: y,
        hp: base.hp * waveMul * d.hpMul,
        maxHp: base.hp * waveMul * d.hpMul,
        speed: base.speed * d.speedMul * (1 + wave * 0.025),
        dmg: base.dmg * d.dmgMul,
        score: Math.floor(base.score * waveMul * d.scoreMul),
        radius: base.radius,
        color: base.color,
        shape: base.shape,
        typeIdx: typeIdx,
        angle: 0,
        flash: 0,
        fireTimer: rand(0, fireInterval * 0.5),
        fireInterval: fireInterval,
        bulletSpeed: base.bulletSpeed * d.speedMul,
        bulletCount: base.bulletCount,
        pattern: base.pattern,
        splitSpawned: false,
        laserCharge: 0,
        laserActive: false,
        laserAngle: 0,

        update: function(dt, player, game) {
            const a = angle(this, player);
            this.angle = lerp(this.angle, a, 0.06);

            // 移动
            if (base.laser) {
                this.laserCharge += dt;
                if (this.laserCharge > 2.5 && !this.laserActive) {
                    this.laserActive = true;
                    this.laserAngle = a;
                    this.laserCharge = 0;
                }
                if (this.laserActive) {
                    this.laserCharge += dt;
                    if (this.laserCharge > 2) { this.laserActive = false; this.laserCharge = 0; }
                }
            } else {
                this.x += Math.cos(this.angle) * this.speed * dt * 60;
                this.y += Math.sin(this.angle) * this.speed * dt * 60;
            }

            // 弹幕发射！
            if (this.pattern !== 'none') {
                this.fireTimer += dt;
                if (this.fireTimer >= this.fireInterval) {
                    this.fireTimer = 0;
                    this.fire(game, player);
                }
            }

            if (this.flash > 0) this.flash -= dt * 6;
            return this.hp > 0;
        },

        fire: function(game, player) {
            const self = this;
            const spd = this.bulletSpeed;
            const count = this.bulletCount;
            const a = angle(this, player);

            const addBullet = (vx, vy, opts) => {
                const b = {
                    x: self.x, y: self.y,
                    vx: vx, vy: vy,
                    dmg: self.dmg, radius: 5 + (opts && opts.big ? 3 : 0),
                    color: self.color,
                    trail: [],
                    homing: false, accel: false, wave: false
                };
                if (opts) {
                    if (opts.homing) { b.homing = true; b.target = player; b.homingStrength = opts.homingStrength || 0.03; }
                    if (opts.accel) b.accel = true;
                    if (opts.wave) { b.wave = true; b.wavePhase = 0; b.waveAmp = vx; b.vx = 0; }
                    if (opts.big) b.radius = 10;
                }
                game.enemyBullets.push(b);
            };

            switch (this.pattern) {
                case 'aim': // 瞄准射击
                    addBullet(Math.cos(a) * spd, Math.sin(a) * spd);
                    break;

                case 'spread': // 散射
                    for (let i = 0; i < count; i++) {
                        const aa = a + (i - (count - 1) / 2) * 0.35;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd);
                    }
                    break;

                case 'ring': // 环形弹幕
                    for (let i = 0; i < count; i++) {
                        const aa = (i / count) * Math.PI * 2;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd);
                    }
                    break;

                case 'burst': // 爆发连射
                    for (let i = 0; i < count; i++) {
                        const aa = a + rand(-0.5, 0.5);
                        addBullet(Math.cos(aa) * spd * rand(0.8, 1.3), Math.sin(aa) * spd * rand(0.8, 1.3));
                    }
                    break;

                case 'homing': // 追踪弹
                    addBullet(Math.cos(a) * spd * 0.6, Math.sin(a) * spd * 0.6, { homing: true, homingStrength: 0.04 });
                    for (let i = 1; i < count; i++) {
                        const aa = a + (i - (count - 1) / 2) * 0.3;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd);
                    }
                    break;

                case 'split': // 分裂弹幕
                    for (let i = 0; i < count; i++) {
                        const aa = a + (i - (count - 1) / 2) * 0.4;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd, { accel: true });
                    }
                    break;

                case 'laser': // 激光塔 - 扇形弹幕
                    for (let i = 0; i < count; i++) {
                        const aa = a + (i - (count - 1) / 2) * 0.25;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd, { big: true });
                    }
                    break;
            }
        },

        draw: function(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle + Math.PI / 2);

            const flash = this.flash > 0;
            ctx.fillStyle = flash ? '#fff' : this.color;
            ctx.strokeStyle = flash ? '#fff' : '#ffffff';
            ctx.lineWidth = 2;

            switch (this.shape) {
                case 'triangle':
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(-this.radius * 0.7, this.radius);
                    ctx.lineTo(this.radius * 0.7, this.radius);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    break;
                case 'dart':
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius * 1.4);
                    ctx.lineTo(-this.radius * 0.5, this.radius * 0.5);
                    ctx.lineTo(0, this.radius * 0.2);
                    ctx.lineTo(this.radius * 0.5, this.radius * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    break;
                case 'hex':
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2;
                        ctx.lineTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 12;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    break;
                case 'small':
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 8;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    break;
                case 'elite':
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(-this.radius, 0);
                    ctx.lineTo(0, this.radius);
                    ctx.lineTo(this.radius, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowColor = '#ffdd00';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = flash ? '#fff' : '#ffdd00';
                    ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.3, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'bomb':
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 15;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = flash ? '#fff' : '#ff4444';
                    ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.5, 0, Math.PI * 2); ctx.fill();
                    break;
                case 'split':
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(-this.radius * 0.8, 0);
                    ctx.lineTo(0, this.radius);
                    ctx.lineTo(this.radius * 0.8, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    break;
                case 'tower':
                    ctx.fillRect(-this.radius * 0.6, -this.radius * 0.6, this.radius * 1.2, this.radius * 1.2);
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                    ctx.strokeRect(-this.radius * 0.6, -this.radius * 0.6, this.radius * 1.2, this.radius * 1.2);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = flash ? '#fff' : '#00ff88';
                    ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.35, 0, Math.PI * 2); ctx.fill();
                    break;
            }

            ctx.rotate(-this.angle - Math.PI / 2);

            // 血条
            const hpPct = this.hp / this.maxHp;
            ctx.fillStyle = '#222';
            ctx.fillRect(-22, -this.radius - 12, 44, 5);
            ctx.fillStyle = hpPct > 0.5 ? '#00ff88' : hpPct > 0.25 ? '#ff8800' : '#ff0044';
            ctx.fillRect(-22, -this.radius - 12, 44 * hpPct, 5);

            // 激光预警
            if (base.laser && this.laserCharge > 1.8 && !this.laserActive) {
                ctx.strokeStyle = 'rgba(255,0,0,0.4)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(this.laserAngle - this.angle - Math.PI/2) * 800, Math.sin(this.laserAngle - this.angle - Math.PI/2) * 800);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.restore();

            // 激光绘制
            if (base.laser && this.laserActive) {
                ctx.save();
                ctx.strokeStyle = '#ff0044';
                ctx.lineWidth = 10;
                ctx.shadowColor = '#ff0044';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + Math.cos(this.laserAngle) * 2000, this.y + Math.sin(this.laserAngle) * 2000);
                ctx.stroke();
                ctx.strokeStyle = '#ff8888';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + Math.cos(this.laserAngle) * 2000, this.y + Math.sin(this.laserAngle) * 2000);
                ctx.stroke();
                ctx.restore();
            }
        }
    };
}

// ==================== 小Boss ====================
function createMiniBoss(wave, diff) {
    const d = DIFFICULTY[diff];
    const hpMul = 4 + wave * 0.15;
    const baseHp = 400 * hpMul * d.hpMul * Math.pow(1.06, wave);

    return {
        x: W / 2, y: -60,
        hp: baseHp, maxHp: baseHp,
        speed: 2 * d.speedMul,
        dmg: 25 * d.dmgMul,
        score: 300 * wave,
        radius: 28,
        color: '#ff6600',
        isMiniBoss: true,
        angle: 0,
        flash: 0,
        attackTimer: 0,
        attackPattern: 0,
        entered: false,
        enterY: 80,

        update: function(dt, player, game) {
            if (!this.entered) {
                this.y += this.speed * dt * 60;
                if (this.y >= this.enterY) this.entered = true;
                return true;
            }

            this.x += Math.sin(Date.now() * 0.0015) * this.speed * dt * 60;
            this.x = clamp(this.x, this.radius + 20, W - this.radius - 20);

            this.attackTimer += dt;
            const interval = 1.5;
            if (this.attackTimer >= interval) {
                this.attackTimer = 0;
                this.attackPattern = (this.attackPattern + 1) % 3;
                this.fire(game, player);
            }

            if (this.flash > 0) this.flash -= dt * 6;
            return this.hp > 0;
        },

        fire: function(game, player) {
            const self = this;
            const a = angle(this, player);
            const spd = 4 * DIFFICULTY[diff].bulletMul;

            const addBullet = (vx, vy, opts) => {
                const b = { x: self.x, y: self.y, vx: vx, vy: vy, dmg: self.dmg, radius: 6, color: self.color, trail: [], homing: false };
                if (opts && opts.homing) { b.homing = true; b.target = player; b.homingStrength = 0.025; }
                game.enemyBullets.push(b);
            };

            switch (this.attackPattern) {
                case 0: // 环形弹幕
                    for (let i = 0; i < 16; i++) {
                        const aa = (i / 16) * Math.PI * 2;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd);
                    }
                    break;
