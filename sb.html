<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际猎手：终极进化</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a1a;
    overflow: hidden;
    font-family: 'Microsoft YaHei', sans-serif;
    color: #fff;
    user-select: none;
}
#gameCanvas {
    display: block;
    cursor: none;
}
#ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}
#ui > * { pointer-events: auto; }
.screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,5,20,0.92);
    z-index: 100;
}
.screen.hidden { display: none !important; }
h1 {
    font-size: 52px;
    background: linear-gradient(90deg, #00d4ff, #ff00aa, #ffdd00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    text-shadow: 0 0 40px rgba(0,212,255,0.5);
}
.subtitle { font-size: 18px; color: #88aaff; margin-bottom: 30px; }
.btn-group { display: flex; gap: 15px; margin: 10px 0; flex-wrap: wrap; justify-content: center; }
.btn {
    padding: 12px 28px;
    font-size: 16px;
    border: 2px solid #00d4ff;
    background: rgba(0,212,255,0.1);
    color: #00d4ff;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
    font-family: inherit;
}
.btn:hover { background: rgba(0,212,255,0.3); transform: scale(1.05); }
.btn.selected { background: rgba(0,212,255,0.5); color: #fff; box-shadow: 0 0 20px rgba(0,212,255,0.5); }
.btn-start {
    font-size: 22px;
    padding: 15px 50px;
    background: linear-gradient(90deg, #ff0044, #ff8800);
    border: none;
    color: #fff;
    margin-top: 20px;
}
.btn-start:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(255,68,0,0.6); }
.info-box {
    background: rgba(0,20,40,0.8);
    border: 1px solid #004488;
    border-radius: 10px;
    padding: 15px 25px;
    margin: 10px;
    max-width: 600px;
    text-align: center;
}
.info-box h3 { color: #ffdd00; margin-bottom: 8px; }
.info-box p { color: #aaccff; font-size: 14px; line-height: 1.6; }
.hud {
    position: absolute;
    pointer-events: none;
    z-index: 50;
}
#hudTop { top: 10px; left: 15px; }
#hudTop div { margin: 3px 0; font-size: 15px; text-shadow: 0 0 5px #000; }
#hudRight { top: 10px; right: 15px; text-align: right; }
#hudRight div { margin: 3px 0; font-size: 14px; text-shadow: 0 0 5px #000; }
.bar-container {
    width: 200px; height: 14px;
    background: rgba(0,0,0,0.6);
    border: 1px solid #444;
    border-radius: 7px;
    overflow: hidden;
    margin-top: 3px;
}
.bar-fill { height: 100%; border-radius: 6px; transition: width 0.2s; }
.hp-bar { background: linear-gradient(90deg, #ff0044, #ff4488); }
.shield-bar { background: linear-gradient(90deg, #0088ff, #44aaff); }
.skill-bar { background: linear-gradient(90deg, #ffaa00, #ffdd44); }
.combo-bar {
    width: 150px; height: 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 3px;
    margin-top: 4px;
    overflow: hidden;
}
.combo-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff0044, #ff8800, #ffdd00, #00ff88, #0088ff, #8800ff);
    border-radius: 3px;
    transition: width 0.3s;
}
#talentScreen .talent-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 20px 0;
    max-width: 700px;
}
.talent-card {
    background: rgba(0,20,50,0.9);
    border: 2px solid #224488;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    min-width: 140px;
}
.talent-card:hover { border-color: #00d4ff; transform: translateY(-3px); }
.talent-card.selected { border-color: #ffdd00; background: rgba(80,60,0,0.8); box-shadow: 0 0 15px rgba(255,221,0,0.3); }
.talent-card .t-name { font-size: 14px; color: #ffdd00; font-weight: bold; }
.talent-card .t-desc { font-size: 11px; color: #88aaff; margin-top: 4px; }
.talent-card .t-lv { font-size: 10px; color: #ff8800; margin-top: 2px; }
#messageArea {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 60;
    text-align: center;
}
.float-text {
    position: absolute;
    font-size: 18px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 0 8px #000;
    animation: floatUp 1.2s ease-out forwards;
}
@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
}
.event-banner {
    position: absolute;
    top: 25%; left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: bold;
    color: #ffdd00;
    text-shadow: 0 0 20px rgba(255,221,0,0.8);
    pointer-events: none;
    z-index: 55;
    animation: bannerIn 2s ease-out forwards;
}
@keyframes bannerIn {
    0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
    20% { opacity: 1; transform: translateX(-50%) scale(1.1); }
    80% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(1); }
}
.weapon-icon {
    display: inline-block;
    width: 30px; height: 30px;
    border-radius: 5px;
    text-align: center;
    line-height: 30px;
    margin: 2px;
    border: 1px solid #444;
    font-size: 16px;
}
.weapon-icon.active { border-color: #ffdd00; box-shadow: 0 0 8px rgba(255,221,0,0.5); }
#weaponBar {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 50;
    pointer-events: none;
}
</style>
<base target="_blank">
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui">
    <div id="mainScreen" class="screen">
        <h1>星际猎手：终极进化</h1>
        <div class="subtitle">撑过50波，击败宇宙毁灭者！</div>
        <div class="info-box">
            <h3>选择难度</h3>
            <div class="btn-group" id="difficultyGroup">
                <button class="btn selected" data-diff="0">简单</button>
                <button class="btn" data-diff="1">普通</button>
                <button class="btn" data-diff="2">困难</button>
                <button class="btn" data-diff="3">地狱</button>
            </div>
        </div>
        <div class="info-box">
            <h3>选择初始武器</h3>
            <div class="btn-group" id="weaponGroup">
                <button class="btn selected" data-wp="0">散射炮</button>
                <button class="btn" data-wp="1">激光炮</button>
                <button class="btn" data-wp="2">追踪弹</button>
                <button class="btn" data-wp="3">霰弹枪</button>
