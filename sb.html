<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星际猎手：终极进化 v10.0</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
body { background:#050510; overflow:hidden; font-family:'Microsoft YaHei',sans-serif; color:#fff; }
#gameCanvas { display:block; margin:0 auto; background:#050510; }
#uiLayer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.screen { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; background:rgba(5,5,16,0.92); transition:opacity 0.3s; }
.screen.hidden { display:none; opacity:0; pointer-events:none; }

/* 标题画面 */
.title-box { text-align:center; margin-bottom:20px; }
.title-box h1 { font-size:42px; background:linear-gradient(90deg,#ff6b35,#f7c531,#4ecdc4,#ff6b35); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shine 3s linear infinite; text-shadow:0 0 30px rgba(255,107,53,0.3); margin-bottom:10px; }
@keyframes shine { 0%{background-position:0%} 50%{background-position:100%} 100%{background-position:0%} }
.subtitle { color:#8899aa; font-size:14px; letter-spacing:4px; }

.weapon-select { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:720px; margin:15px auto; padding:0 20px; }
@media(max-width:600px){ .weapon-select{grid-template-columns:repeat(2,1fr);} .title-box h1{font-size:28px;} }
.wpn-card { background:linear-gradient(135deg,rgba(30,40,60,0.9),rgba(20,25,40,0.9)); border:2px solid #334; border-radius:12px; padding:12px; text-align:center; cursor:pointer; transition:all 0.2s; position:relative; }
.wpn-card:hover { border-color:#667; transform:translateY(-2px); box-shadow:0 4px 20px rgba(100,150,255,0.15); }
.wpn-card.selected { border-color:#f7c531; box-shadow:0 0 20px rgba(247,197,49,0.3); background:linear-gradient(135deg,rgba(60,50,20,0.9),rgba(40,35,15,0.9)); }
.wpn-card .wpn-icon { font-size:28px; margin-bottom:4px; }
.wpn-card .wpn-name { font-size:13px; font-weight:bold; color:#ccd; }
.wpn-card .wpn-desc { font-size:10px; color:#8899aa; margin-top:4px; line-height:1.3; }

.difficulty-select { display:flex; gap:10px; margin:15px 0; flex-wrap:wrap; justify-content:center; }
.diff-btn { padding:8px 20px; border:2px solid #445; background:rgba(20,25,40,0.8); color:#ccd; border-radius:20px; cursor:pointer; font-size:14px; transition:all 0.2s; }
.diff-btn:hover { border-color:#778; }
.diff-btn.selected { border-color:#4ecdc4; color:#4ecdc4; box-shadow:0 0 15px rgba(78,205,196,0.2); }

.start-btn { padding:14px 50px; font-size:18px; font-weight:bold; border:none; border-radius:30px; background:linear-gradient(90deg,#ff6b35,#f7c531); color:#1a0f00; cursor:pointer; transition:all 0.2s; margin-top:15px; box-shadow:0 4px 20px rgba(255,107,53,0.3); }
.start-btn:hover { transform:scale(1.05); box-shadow:0 6px 30px rgba(255,107,53,0.5); }
.start-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

/* 游戏内UI */
.hud { position:absolute; top:0; left:0; width:100%; padding:10px 15px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:10; }
.hud-left, .hud-right { display:flex; flex-direction:column; gap:4px; }
.hud-bar { background:rgba(0,0,0,0.5); border-radius:6px; padding:4px 10px; font-size:12px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.08); }
.hud-bar span { color:#f7c531; font-weight:bold; }
.hp-bar-bg { width:120px; height:8px; background:#222; border-radius:4px; overflow:hidden; margin-top:2px; }
.hp-bar-fill { height:100%; background:linear-gradient(90deg,#ff4444,#ff8844); border-radius:4px; transition:width 0.2s; }
.shield-bar-fill { height:100%; background:linear-gradient(90deg,#4488ff,#44ccff); border-radius:4px; transition:width 0.2s; }

/* 商店 */
.shop-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:700px; margin:15px auto; padding:0 20px; max-height:50vh; overflow-y:auto; }
@media(max-width:600px){ .shop-grid{grid-template-columns:1fr;} }
.shop-item { background:linear-gradient(135deg,rgba(30,40,60,0.9),rgba(20,25,40,0.9)); border:2px solid #334; border-radius:10px; padding:12px; cursor:pointer; transition:all 0.2s; }
.shop-item:hover { border-color:#f7c531; }
.shop-item.maxed { opacity:0.4; border-color:#333; cursor:not-allowed; }
.shop-item-name { font-size:14px; font-weight:bold; color:#f7c531; }
.shop-item-desc { font-size:11px; color:#99a; margin:4px 0; }
.shop-item-lvl { font-size:11px; color:#4ecdc4; }
.shop-item-cost { font-size:12px; color:#ff6b35; font-weight:bold; margin-top:4px; }

/* 天赋选择 */
.talent-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; max-width:750px; margin:20px auto; padding:0 20px; }
@media(max-width:600px){ .talent-grid{grid-template-columns:1fr;} }
.talent-card { background:linear-gradient(135deg,rgba(40,30,60,0.95),rgba(25,20,40,0.95)); border:2px solid #556; border-radius:14px; padding:18px; cursor:pointer; transition:all 0.25s; text-align:center; }
.talent-card:hover { border-color:#a78; transform:translateY(-4px); box-shadow:0 8px 30px rgba(160,120,255,0.2); }
.talent-card .talent-name { font-size:15px; font-weight:bold; color:#e0c0ff; margin-bottom:6px; }
.talent-card .talent-desc { font-size:12px; color:#bbaacc; line-height:1.5; }
.talent-card .talent-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; margin-top:8px; }
.talent-tag.exclusive { background:rgba(255,107,53,0.2); color:#ff6b35; border:1px solid rgba(255,107,53,0.4); }
.talent-tag.general { background:rgba(78,205,196,0.2); color:#4ecdc4; border:1px solid rgba(78,205,196,0.4); }

/* 游戏结束 */
.gameover-box { text-align:center; }
.gameover-box h2 { font-size:36px; margin-bottom:10px; }
.gameover-box .stats { font-size:14px; color:#aab; line-height:2; margin:15px 0; }
.gameover-box .stats span { color:#f7c531; font-weight:bold; }

/* 移动端摇杆 */
#joystickZone { position:absolute; bottom:30px; left:30px; width:120px; height:120px; display:none; z-index:20; }
#skillBtn { position:absolute; bottom:40px; right:30px; width:70px; height:70px; border-radius:50%; background:rgba(255,107,53,0.3); border:2px solid #ff6b35; color:#fff; font-size:12px; display:none; align-items:center; justify-content:center; z-index:20; pointer-events:auto; }

/* 滚动条美化 */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:rgba(0,0,0,0.3); }
::-webkit-scrollbar-thumb { background:#445; border-radius:3px; }
</style>

// ==================== 射击系统 ====================
function getWeapon(wid){ return WEAPONS[wid]; }

function getTalentLevel(tid){ return player.talents[tid]||0; }

function getFireRate(w){ 
  let rate = w.fireRate;
  rate *= 1/player.globalAspdMul;
  if(w.id===0 && getTalentLevel('rapidFire')>0) rate *= 0.7;
  if(w.id===1 && getTalentLevel('coolant')>0) rate *= 0.75;
  if(w.id===6 && getTalentLevel('rapidRocket')>0) rate *= 0.6;
  if(getTalentLevel('rapidFire_g')>0) rate *= 0.9; // 通用极速射击
  return Math.max(1, rate);
}

function getDamage(w){
  let dmg = w.dmg * player.globalDmgMul;
  if(w.id===1 && getTalentLevel('laserFocus')>0) dmg *= 1+0.4*getTalentLevel('laserFocus');
  if(w.id===6 && getTalentLevel('heavyPayload')>0) dmg *= 1+0.35*getTalentLevel('heavyPayload');
  if(w.id===7 && getTalentLevel('swordMaster')>0) dmg *= 1+0.5*getTalentLevel('swordMaster');
  if(getTalentLevel('fireCore_g')>0) dmg *= 1+0.12*getTalentLevel('fireCore_g');
  return Math.max(1, dmg);
}

function getPierce(w){
  let p = w.pierce;
  if(w.id===0 && getTalentLevel('pierceShot')>0) p += 3*getTalentLevel('pierceShot');
  if(w.id===5 && getTalentLevel('pierceUp')>0) p += 8*getTalentLevel('pierceUp');
  return p;
}

function spawnBullet(w, ox, oy, angle, isUlt=false, isSkill=false){
  const dmg = getDamage(w);
  const spd = w.speed * (1 + (w.id===4 && getTalentLevel('ringSpeed')>0 ? 0.3*getTalentLevel('ringSpeed') : 0));
  const life = w.life * (1 + (w.id===2 && getTalentLevel('longLife')>0 ? 0.5*getTalentLevel('longLife') : 0));

  const b = {
    x: ox, y: oy,
    vx: Math.cos(angle)*spd,
    vy: Math.sin(angle)*spd,
    dmg: dmg,
    pierce: getPierce(w),
    life: life,
    maxLife: life,
    angle: angle,
    weapon: w.id,
    size: w.bulletSize,
    color: w.color,
    shape: w.bulletShape,
    homing: w.homing || false,
    explode: w.explode || false,
    blastRadius: (w.blastRadius||0) * (1 + (w.id===6 && getTalentLevel('blastUp')>0 ? 0.5*getTalentLevel('blastUp') : 0)),
    melee: w.melee || false,
    range: (w.range||0) * (1 + (w.id===7 && getTalentLevel('swordReach')>0 ? 0.4*getTalentLevel('swordReach') : 0)),
    isUlt: isUlt,
    isSkill: isSkill,
    trail: [],
    crit: Math.random() < (0.05 + player.globalCritMul + (w.id===5 && getTalentLevel('criticalAim')>0 ? 0.15*getTalentLevel('criticalAim') : 0)),
    burn: w.id===1 && getTalentLevel('burnEffect')>0 ? 2*getTalentLevel('burnEffect') : 0,
    poison: w.id===4 && getTalentLevel('poisonRing')>0 ? 3*getTalentLevel('poisonRing') : 0,
    bleed: w.id===3 && getTalentLevel('bleedShot')>0 ? 3*getTalentLevel('bleedShot') : 0,
    knockback: w.id===3 && getTalentLevel('knockback')>0 ? 3*getTalentLevel('knockback') : 0,
    vampiric: w.id===7 && getTalentLevel('vampiric')>0 ? 0.1*getTalentLevel('vampiric') : 0,
    split: w.id===2 && getTalentLevel('splitWarhead')>0 ? 2 : 0,
    smartBomb: w.id===2 && getTalentLevel('smartBomb')>0,
    starBurst: w.id===4 && getTalentLevel('starBurst')>0,
    chain: w.id===6 && getTalentLevel('chainReact')>0 ? 0.25*getTalentLevel('chainReact') : 0,
    incendiary: w.id===6 && getTalentLevel('incendiary')>0 ? 3*getTalentLevel('incendiary') : 0,
    headshot: w.id===5 && getTalentLevel('headshot')>0 ? 0.5*getTalentLevel('headshot') : 0,
    charge: w.id===5 && getTalentLevel('chargeShot')>0 ? player.chargeCounter : 0,
    swordWave: w.id===7 && getTalentLevel('swordWave')>0,
    boomerang: w.id===4 && getTalentLevel('boomerang')>0,
    penetrated: [] // 已穿透目标
  };

  if(b.charge && b.charge % 3 === 0) b.dmg *= 2;
  if(b.crit) b.dmg *= 1.5;

  bullets.push(b);
  return b;
}

function fireWeapon(){
  const w = getWeapon(currentWeapon);
  player.fireTimer--;
  if(player.fireTimer > 0) return;
  player.fireTimer = getFireRate(w);
  player.chargeCounter = (player.chargeCounter+1)%10;

  const px = player.x, py = player.y - 20;

  // 散射炮
  if(w.id === 0){
    let count = 3 + (getTalentLevel('scatterPlus')>0 ? 2*getTalentLevel('scatterPlus') : 0);
    let spread = 0.4 * (1 + (getTalentLevel('spreadUp')>0 ? 0.5*getTalentLevel('spreadUp') : 0));
    if(getTalentLevel('spreadNarrow')>0){ spread *= 0.7; }
    for(let i=0;i<count;i++){
      let a = targetAngle - spread/2 + spread*(i/(count-1));
      spawnBullet(w, px, py, a);
    }
  }
  // 激光炮
  else if(w.id === 1){
    spawnBullet(w, px, py, targetAngle);
  }
  // 追踪弹
  else if(w.id === 2){
    let count = 1 + (getTalentLevel('cluster')>0 ? getTalentLevel('cluster') : 0);
    for(let i=0;i<count;i++){
      let a = targetAngle + (Math.random()-0.5)*0.3;
      spawnBullet(w, px, py, a);
    }
  }
  // 霰弹枪
  else if(w.id === 3){
    let count = 6 + (getTalentLevel('pelletPlus')>0 ? 3*getTalentLevel('pelletPlus') : 0);
    let spread = 0.5;
    for(let i=0;i<count;i++){
      let a = targetAngle - spread/2 + spread*(i/(count-1)) + (Math.random()-0.5)*0.1;
      spawnBullet(w, px, py, a);
    }
  }
  // 环形炮
  else if(w.id === 4){
    let count = 8 + (getTalentLevel('ringPlus')>0 ? 4*getTalentLevel('ringPlus') : 0);
    for(let i=0;i<count;i++){
      let a = (Math.PI*2*i/count) + (Date.now()*0.001);
      spawnBullet(w, px, py, a);
    }
  }
  // 狙击炮
  else if(w.id === 5){
    spawnBullet(w, px, py, targetAngle);
  }
  // 导弹巢
  else if(w.id === 6){
    spawnBullet(w, px, py, targetAngle);
  }
  // 光束剑
  else if(w.id === 7){
    // 近战斩击，不发射子弹而是检测范围
    let range = w.range * (1 + (getTalentLevel('swordReach')>0 ? 0.4*getTalentLevel('swordReach') : 0));
    let angle = targetAngle;
    let arc = 1.2;
    // 创建视觉子弹（用于渲染）
    let b = spawnBullet(w, px, py, angle);
    b.range = range; b.arc = arc; b.life = 8;

    // 剑气
    if(getTalentLevel('swordWave')>0){
      let waveCount = getTalentLevel('swordWave');
      for(let i=0;i<waveCount;i++){
        let wa = angle + (i-waveCount/2+0.5)*0.3;
        let wb = spawnBullet(w, px, py, wa);
        wb.isWave = true; wb.life = 40; wb.size = 5; wb.speed = 8;
        wb.vx = Math.cos(wa)*8; wb.vy = Math.sin(wa)*8;
      }
    }
  }
}

// ==================== 大招系统 ====================
function useSkill(){
  if(player.skillCooldown > 0) return;
  player.skillCooldown = player.maxSkillCd * (1 - (getTalentLevel('cooldown_g')>0 ? 0.1*getTalentLevel('cooldown_g') : 0));
  const w = getWeapon(currentWeapon);
  const px = player.x, py = player.y;

  slowMotion = 15;
  screenShake = 10;

  // 大招特效粒子
  for(let i=0;i<60;i++){
    let a = Math.random()*Math.PI*2;
    let s = Math.random()*6+2;
    particles.push({x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:40, maxLife:40, color:w.color, size:Math.random()*4+2, type:'burst'});
  }
  // 冲击波
  for(let r=1;r<=3;r++){
    particles.push({x:px, y:py, r:1, maxR:r*80, life:30, maxLife:30, color:w.color, type:'shockwave', width:4-r});
  }

  if(w.id === 0){
    // 散射炮大招：全方向弹幕
    let count = getTalentLevel('ultimateBarrage')>0 ? 48 : 24;
    for(let i=0;i<count;i++){
      let a = Math.PI*2*i/count;
      spawnBullet(w, px, py, a, true);
    }
  }
  else if(w.id === 1){
    // 激光炮大招：旋转激光
    if(getTalentLevel('beamSweep')>0){
      for(let i=0;i<8;i++){
        let a = Math.PI*2*i/8;
        let b = spawnBullet(w, px, py, a, true);
        b.sweep = true; b.sweepSpeed = 0.08; b.sweepLife = 120;
      }
    } else {
      for(let i=0;i<12;i++){
        let a = Math.PI*2*i/12;
        spawnBullet(w, px, py, a, true);
      }
    }
  }
  else if(w.id === 2){
    // 追踪弹大招：导弹风暴
    let count = getTalentLevel('missileStorm')>0 ? 20 : 12;
    for(let i=0;i<count;i++){
      let a = -Math.PI/2 + (Math.random()-0.5)*1.5;
      spawnBullet(w, px, py, a, true);
    }
  }
  else if(w.id === 3){
    // 霰弹枪大招：弹幕地狱
    if(getTalentLevel('shotgunHell')>0){
      for(let round=0;round<3;round++){
        setTimeout(()=>{
          for(let i=0;i<24;i++){
            let a = Math.PI*2*i/24;
            spawnBullet(w, px, py, a, true);
          }
        }, round*200);
      }
    } else {
      for(let i=0;i<36;i++){
        let a = Math.PI*2*i/36;
        spawnBullet(w, px, py, a, true);
      }
    }
  }
  else if(w.id === 4){
    // 环形炮大招：银河漩涡
    if(getTalentLevel('galaxyVortex')>0){
      // 创建吸引场
      particles.push({x:px, y:py-100, r:200, life:300, maxLife:300, color:'#cc66ff', type:'vortex', pull:3});
      for(let i=0;i<40;i++){
        let a = Math.random()*Math.PI*2;
        let b = spawnBullet(w, px, py, a, true);
        b.vortex = true; b.vx = Math.cos(a)*2; b.vy = Math.sin(a)*2;
      }
    } else {
      for(let i=0;i<32;i++){
        let a = Math.PI*2*i/32;
        spawnBullet(w, px, py, a, true);
      }
    }
  }
  else if(w.id === 5){
    // 狙击炮大招：天基打击
    if(getTalentLevel('orbitalStrike')>0){
      for(let i=0;i<3;i++){
        setTimeout(()=>{
          let tx = px + (Math.random()-0.5)*300;
          let b = spawnBullet(w, tx, -50, Math.PI/2, true);
          b.size = 20; b.dmg *= 3; b.blastRadius = 120;
          b.vy = 15; b.vx = 0;
        }, i*300);
      }
    } else {
      for(let i=0;i<8;i++){
        let a = Math.PI*2*i/8;
        spawnBullet(w, px, py, a, true);
      }
    }
  }
  else if(w.id === 6){
    // 导弹巢大招：核弹
    if(getTalentLevel('nukeStrike')>0){
      let b = spawnBullet(w, px, py, targetAngle, true);
      b.size = 30; b.dmg *= 5; b.blastRadius = 250; b.speed = 3;
      b.vx = Math.cos(targetAngle)*3; b.vy = Math.sin(targetAngle)*3;
    } else {
      for(let i=0;i<16;i++){
        let a = Math.PI*2*i/16;
        spawnBullet(w, px, py, a, true);
      }
    }
  }
  else if(w.id === 7){
    // 光束剑大招：旋风斩
    if(getTalentLevel('whirlwind')>0){
      player.whirlwind = 180; // 3秒
    } else {
      let b = spawnBullet(w, px, py, 0, true);
      b.whirl = true; b.life = 60; b.range = 150; b.arc = Math.PI*2;
    }
  }
}

function spawnEnemy(type, isBoss=false){
  const d = DIFFICULTY[diff];
  let e = {
    x: Math.random()*(W-100)+50,
    y: -40,
    hp: 0, maxHp: 0,
    speed: 0,
    dmg: 0,
    radius: 15,
    type: type,
    isBoss: isBoss,
    phase: 0,
    phaseTimer: 0,
    attackTimer: 0,
    moveTimer: 0,
    targetX: Math.random()*(W-100)+50,
    targetY: Math.random()*H*0.4+50,
    elite: Math.random() < 0.1 + player.globalLuckyMul,
    status: {}, // burn, poison, bleed, stun
    angle: 0
  };

  if(isBoss){
    if(type === 'mini'){
      e.radius = 35; e.hp = 300; e.speed = 1.5; e.dmg = 15;
    } else if(type === 'boss'){
      e.radius = 55; e.hp = 1200; e.speed = 1; e.dmg = 25;
    } else if(type === 'final'){
      e.radius = 80; e.hp = 8000; e.speed = 0.8; e.dmg = 40;
    }
    e.hp *= Math.pow(1.075, wave) * d.hp;
    e.maxHp = e.hp;
    e.dmg *= d.dmg;
    e.speed *= d.speed;
    bossActive = true;
  } else {
    const types = ['scout','fighter','tank','shooter','dasher','bomber','sniper','swarmer'];
    const t = type || types[Math.floor(Math.random()*types.length)];
    e.type = t;
    switch(t){
      case 'scout': e.hp=30; e.speed=2.5; e.dmg=8; e.radius=12; break;
      case 'fighter': e.hp=60; e.speed=1.8; e.dmg=12; e.radius=16; break;
      case 'tank': e.hp=150; e.speed=0.8; e.dmg=15; e.radius=22; break;
      case 'shooter': e.hp=45; e.speed=1.2; e.dmg=10; e.radius=14; break;
      case 'dasher': e.hp=40; e.speed=3.5; e.dmg=10; e.radius=12; break;
      case 'bomber': e.hp=80; e.speed=1.0; e.dmg=20; e.radius=18; break;
      case 'sniper': e.hp=35; e.speed=1.0; e.dmg=18; e.radius=13; break;
      case 'swarmer': e.hp=20; e.speed=2.0; e.dmg=6; e.radius=10; break;
    }
    e.hp *= Math.pow(1.075, wave) * d.hp;
    e.maxHp = e.hp;
    e.dmg *= d.dmg;
    e.speed *= d.speed;
    if(e.elite){ e.hp*=2; e.maxHp*=2; e.dmg*=1.5; e.speed*=1.2; e.radius*=1.3; }
  }

  enemies.push(e);
  return e;
}

function spawnWave(){
  const d = DIFFICULTY[diff];
  let count = 4 + Math.floor(wave * 0.8 * d.bullet);
  if(wave % 5 === 0) count = Math.floor(count * 0.5);

  // Boss波
  if(wave % 50 === 0 && wave > 0){
    spawnEnemy('final', true);
    showWarning('宇宙毁灭者 降临！', '#ff2244');
  } else if(wave % 10 === 0 && wave > 0){
    spawnEnemy('boss', true);
    showWarning('虚空领主 降临！', '#ff6b35');
  } else if(wave % 5 === 0 && wave > 0){
    spawnEnemy('mini', true);
    showWarning('狂暴猎手 出现！', '#f7c531');
  } else {
    for(let i=0;i<count;i++){
      setTimeout(()=>spawnEnemy(), i*30);
    }
  }
}

function showWarning(text, color){
  texts.push({x:W/2, y:H/2, text:text, color:color, life:120, maxLife:120, size:32, type:'warning'});
  slowMotion = 30;
  screenShake = 8;
  // Boss登场粒子
  for(let i=0;i<50;i++){
    let a = Math.random()*Math.PI*2;
    let s = Math.random()*5+2;
    particles.push({x:W/2, y:H/2-50, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:60, maxLife:60, color:color, size:Math.random()*5+2, type:'burst'});
  }
}

// ==================== 敌人AI与射击 ====================
function updateEnemies(){
  const d = DIFFICULTY[diff];

  enemies.forEach(e=>{
    // 状态效果
    if(e.status.burn){ e.hp -= 0.5; e.status.burn--; }
    if(e.status.poison){ e.hp -= 0.3; e.status.poison--; }
    if(e.status.bleed){ e.hp -= 0.4; e.status.bleed--; }
    if(e.status.stun){ e.status.stun--; return; }

    // 移动
    e.angle = Math.atan2(player.y - e.y, player.x - e.x);

    if(e.isBoss){
      e.phaseTimer++;
      // Boss阶段切换
      if(e.type==='mini' && e.hp < e.maxHp*0.5 && e.phase===0){ e.phase=1; e.speed*=1.5; }
      if(e.type==='boss' && e.hp < e.maxHp*0.6 && e.phase===0){ e.phase=1; }
      if(e.type==='boss' && e.hp < e.maxHp*0.3 && e.phase===1){ e.phase=2; e.attackTimer=0; }
      if(e.type==='final' && e.hp < e.maxHp*0.75 && e.phase===0){ e.phase=1; }
      if(e.type==='final' && e.hp < e.maxHp*0.5 && e.phase===1){ e.phase=2; }
      if(e.type==='final' && e.hp < e.maxHp*0.25 && e.phase===2){ e.phase=3; }

      // Boss移动
      e.moveTimer++;
      if(e.moveTimer > 120){
        e.targetX = Math.random()*(W-100)+50;
        e.targetY = Math.random()*H*0.4+50;
        e.moveTimer = 0;
      }
      let dx = e.targetX - e.x;
      let dy = e.targetY - e.y;
      let dist = Math.sqrt(dx*dx+dy*dy);
      if(dist > 5){ e.x += (dx/dist)*e.speed; e.y += (dy/dist)*e.speed; }

      // Boss攻击
      e.attackTimer++;
      let atkInterval = e.type==='final' ? 40 : e.type==='boss' ? 50 : 35;
      atkInterval /= d.bullet;
      if(e.attackTimer > atkInterval){
        e.attackTimer = 0;
        bossAttack(e);
      }
    } else {
      // 普通敌人移动
      switch(e.type){
        case 'scout': e.y += e.speed; e.x += Math.sin(e.y*0.02)*2; break;
        case 'fighter': e.y += e.speed*0.7; e.x += Math.cos(Date.now()*0.002)*1; break;
        case 'tank': e.y += e.speed*0.5; break;
        case 'shooter': e.y += e.speed*0.4; if(e.y > 80) e.y = 80 + Math.sin(Date.now()*0.001)*20; break;
        case 'dasher': 
          if(!e.dashTimer){ e.dashTimer = 60; e.dashDir = Math.atan2(player.y-e.y, player.x-e.x); }
          e.dashTimer--;
          if(e.dashTimer > 30){ e.x += Math.cos(e.dashDir)*e.speed*2; e.y += Math.sin(e.dashDir)*e.speed*2; }
          else { e.y += e.speed*0.3; }
          if(e.dashTimer <= 0) e.dashTimer = 90;
          break;
        case 'bomber': e.y += e.speed; break;
        case 'sniper': e.y += e.speed*0.3; if(e.y > 100) e.y = 100; break;
        case 'swarmer': 
          e.y += e.speed; 
          e.x += Math.sin(Date.now()*0.005 + e.y*0.01)*3;
          break;
      }

      // 普通敌人射击
      e.attackTimer++;
      let shootChance = 0.01 * d.bullet;
      if(e.type==='shooter' || e.type==='sniper') shootChance = 0.025 * d.bullet;
      if(Math.random() < shootChance){
        enemyShoot(e);
      }

      // 轰炸机自爆
      if(e.type==='bomber'){
        let dist = Math.hypot(player.x-e.x, player.y-e.y);
        if(dist < 60){ e.hp = 0; createExplosion(e.x, e.y, 80, '#ff6622'); playerHit(e.dmg*2); }
      }
    }

    // 边界
    if(e.x < e.radius) e.x = e.radius;
    if(e.x > W-e.radius) e.x = W-e.radius;
    if(e.y < -e.radius) e.y = -e.radius;
    if(e.y > H+e.radius && !e.isBoss) e.y = -e.radius;
  });

  // 清理死亡敌人
  for(let i=enemies.length-1;i>=0;i--){
    if(enemies[i].hp <= 0){
      enemyDeath(enemies[i]);
      enemies.splice(i,1);
    }
  }
}

function enemyShoot(e){
  const d = DIFFICULTY[diff];
  let angle = Math.atan2(player.y - e.y, player.x - e.x);
  let speed = 3 + (e.elite?1:0);

  if(e.type === 'shooter'){
    // 散射
    for(let i=-1;i<=1;i++){
      let a = angle + i*0.2;
      enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, dmg:e.dmg, radius:4, color:'#ff4444', type:'normal'});
    }
  } else if(e.type === 'sniper'){
    // 狙击
    enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(angle)*6, vy:Math.sin(angle)*6, dmg:e.dmg*1.5, radius:3, color:'#ff8844', type:'sniper', trail:true});
  } else if(e.type === 'swarmer'){
    // 环形
    for(let i=0;i<4;i++){
      let a = Math.PI*2*i/4 + Date.now()*0.001;
      enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, dmg:e.dmg*0.6, radius:3, color:'#cc44ff', type:'ring'});
    }
  } else {
    // 普通瞄准
    enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed, dmg:e.dmg, radius:4, color:e.elite?'#ffaa00':'#ff6666', type:'normal'});
  }
}

function bossAttack(e){
  const d = DIFFICULTY[diff];
  let angle = Math.atan2(player.y - e.y, player.x - e.x);
  let patterns = [];

  if(e.type === 'mini'){
    patterns = ['ring','burst'];
  } else if(e.type === 'boss'){
    if(e.phase === 0) patterns = ['fan','spiral'];
    else if(e.phase === 1) patterns = ['tracking','accel'];
    else patterns = ['mixed'];
  } else {
    if(e.phase === 0) patterns = ['ring','fan'];
    else if(e.phase === 1) patterns = ['spiral','tracking'];
    else if(e.phase === 2) patterns = ['accel','laser'];
    else patterns = ['hell'];
  }

  let pattern = patterns[Math.floor(Math.random()*patterns.length)];
  let count = e.type==='final' ? 16 : e.type==='boss' ? 12 : 8;
  count *= d.bullet;

  switch(pattern){
    case 'ring':
      for(let i=0;i<count;i++){
        let a = Math.PI*2*i/count;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3, dmg:e.dmg, radius:5, color:'#ff4444', type:'boss'});
      }
      break;
    case 'fan':
      for(let i=-Math.floor(count/2);i<=Math.floor(count/2);i++){
        let a = angle + i*0.15;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*3.5, vy:Math.sin(a)*3.5, dmg:e.dmg, radius:5, color:'#ff8844', type:'boss'});
      }
      break;
    case 'spiral':
      for(let i=0;i<count;i++){
        let a = angle + i*0.3 + e.phaseTimer*0.05;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3, dmg:e.dmg*0.8, radius:4, color:'#ffaa44', type:'spiral', spin:0.02});
      }
      break;
    case 'tracking':
      for(let i=0;i<Math.floor(count/2);i++){
        let a = angle + (Math.random()-0.5)*0.5;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*2.5, vy:Math.sin(a)*2.5, dmg:e.dmg*0.7, radius:4, color:'#ff66aa', type:'homing', life:120});
      }
      break;
    case 'accel':
      for(let i=0;i<count;i++){
        let a = Math.PI*2*i/count;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*1, vy:Math.sin(a)*1, dmg:e.dmg, radius:5, color:'#ff4444', type:'accel', accel:0.08});
      }
      break;
    case 'laser':
      // 激光预警
      particles.push({x:e.x, y:e.y, tx:player.x, ty:player.y, life:60, maxLife:60, color:'#ff0000', type:'laserWarn', width:3});
      setTimeout(()=>{
        let la = Math.atan2(player.y-e.y, player.x-e.x);
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(la)*15, vy:Math.sin(la)*15, dmg:e.dmg*2, radius:6, color:'#ff0000', type:'laser', life:30, pierce:true});
      }, 600);
      break;
    case 'mixed':
      for(let i=0;i<count;i++){
        let a = Math.PI*2*i/count + Math.random()*0.5;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*(2+Math.random()*2), vy:Math.sin(a)*(2+Math.random()*2), dmg:e.dmg*0.9, radius:4, color:Math.random()>0.5?'#ff4444':'#ffaa00', type:'normal'});
      }
      break;
    case 'hell':
      for(let i=0;i<count*1.5;i++){
        let a = Math.random()*Math.PI*2;
        enemyBullets.push({x:e.x, y:e.y, vx:Math.cos(a)*(1+Math.random()*4), vy:Math.sin(a)*(1+Math.random()*4), dmg:e.dmg*0.8, radius:4, color:['#ff4444','#ff8844','#ffaa00','#ff66aa'][Math.floor(Math.random()*4)], type:'normal'});
      }
      break;
  }
}

// ==================== 碰撞检测 ====================
function updateBullets(){
  for(let i=bullets.length-1;i>=0;i--){
    let b = bullets[i];

    // 拖尾记录
    b.trail.push({x:b.x, y:b.y});
    if(b.trail.length > 8) b.trail.shift();

    // 追踪
    if(b.homing && !b.isUlt){
      let nearest = null, minDist = 9999;
      enemies.forEach(e=>{
        let dist = Math.hypot(e.x-b.x, e.y-b.y);
        if(dist < minDist && dist < 400){ minDist = dist; nearest = e; }
      });
      if(nearest){
        let ta = Math.atan2(nearest.y-b.y, nearest.x-b.x);
        let ca = Math.atan2(b.vy, b.vx);
        let diff = ta - ca;
        while(diff > Math.PI) diff -= Math.PI*2;
        while(diff < -Math.PI) diff += Math.PI*2;
        let turn = 0.08 * (1 + getTalentLevel('homingAgile')*0.5);
        ca += diff * turn;
        let spd = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(ca)*spd; b.vy = Math.sin(ca)*spd;
      }
    }

    // 漩涡
    if(b.vortex){
      b.vx *= 0.98; b.vy *= 0.98;
    }

    // 回旋镖
    if(b.boomerang){
      if(b.x < 0 || b.x > W || b.y < 0 || b.y > H){
        b.vx *= -0.8; b.vy *= -0.8;
      }
    }

    // 旋转激光
    if(b.sweep){
      b.angle += b.sweepSpeed || 0.05;
      b.vx = Math.cos(b.angle)*8; b.vy = Math.sin(b.angle)*8;
    }

    // 移动
    if(!b.melee || b.isWave || b.isUlt){
      b.x += b.vx; b.y += b.vy;
    }

    b.life--;
    if(b.life <= 0){
      // 爆炸武器死亡时爆炸
      if(b.explode && b.blastRadius > 0){
        createExplosion(b.x, b.y, b.blastRadius, b.color);
        enemies.forEach(e=>{
          if(Math.hypot(e.x-b.x, e.y-b.y) < b.blastRadius){
            let dmg = b.dmg * 0.5;
            applyDamage(e, dmg, b);
          }
        });
      }
      bullets.splice(i,1);
      continue;
    }

    // 边界
    if(!b.melee && !b.boomerang && (b.x < -50 || b.x > W+50 || b.y < -50 || b.y > H+50)){
      bullets.splice(i,1);
      continue;
    }

    // 碰撞检测
    if(b.melee && !b.isWave){
      // 近战范围检测
      let range = b.range || 90;
      let arc = b.arc || 1.2;
      enemies.forEach(e=>{
        let dist = Math.hypot(e.x-b.x, e.y-b.y);
        let ea = Math.atan2(e.y-b.y, e.x-b.x);
        let diff = Math.abs(ea - b.angle);
        while(diff > Math.PI) diff -= Math.PI*2;
        if(dist < range && Math.abs(diff) < arc/2){
          if(!b.penetrated.includes(e)){
            b.penetrated.push(e);
            applyDamage(e, b.dmg, b);
            // 吸血
            if(b.vampiric){ player.hp = Math.min(player.maxHp, player.hp + b.dmg*b.vampiric); }
            // 剑气
            if(b.swordWave && !b.isWave){
              let wa = Math.atan2(e.y-b.y, e.x-b.x);
              let wb = spawnBullet(getWeapon(7), b.x, b.y, wa);
              wb.isWave = true; wb.life = 30; wb.size = 4; wb.dmg = b.dmg*0.5;
              wb.vx = Math.cos(wa)*6; wb.vy = Math.sin(wa)*6;
            }
          }
        }
      });
    } else {
      // 子弹碰撞
      for(let j=enemies.length-1;j>=0;j--){
        let e = enemies[j];
        let dist = Math.hypot(e.x-b.x, e.y-b.y);
        if(dist < e.radius + b.size + 5){
          // 已穿透的不重复伤害（除非有彻底贯穿）
          let hasPenetration = b.weapon===5 && getTalentLevel('penetration')>0;
          if(!hasPenetration && b.penetrated.includes(e)) continue;
          b.penetrated.push(e);

          applyDamage(e, b.dmg, b);

          // 特效触发
          if(b.burn) e.status.burn = b.burn * 60;
          if(b.poison) e.status.poison = b.poison * 60;
          if(b.bleed) e.status.bleed = b.bleed * 60;
          if(b.knockback){
            let ka = Math.atan2(e.y-b.y, e.x-b.x);
            e.x += Math.cos(ka)*b.knockback*5;
            e.y += Math.sin(ka)*b.knockback*5;
          }
          if(b.vampiric) player.hp = Math.min(player.maxHp, player.hp + b.dmg*b.vampiric);

          // 分裂弹头
          if(b.split && !b.hasSplit){
            b.hasSplit = true;
            for(let s=0;s<b.split;s++){
              let sa = Math.random()*Math.PI*2;
              let sb = spawnBullet(getWeapon(b.weapon), b.x, b.y, sa);
              sb.dmg = b.dmg * 0.4; sb.size = 4; sb.life = 40; sb.homing = true;
              sb.split = 0;
            }
          }

          // 星爆
          if(b.starBurst){
            createExplosion(b.x, b.y, 40, b.color);
            enemies.forEach(ne=>{
              if(ne !== e && Math.hypot(ne.x-b.x, ne.y-b.y) < 40){
                applyDamage(ne, b.dmg*0.3, b);
              }
            });
          }

          // 智能炸弹
          if(b.smartBomb){
            createExplosion(b.x, b.y, 50, b.color);
            enemies.forEach(ne=>{
              if(ne !== e && Math.hypot(ne.x-b.x, ne.y-b.y) < 50){
                applyDamage(ne, b.dmg*0.4, b);
              }
            });
          }

          // 穿透处理
          b.pierce--;
          if(b.pierce < 0 && !hasPenetration){
            if(b.explode && b.blastRadius > 0){
              createExplosion(b.x, b.y, b.blastRadius, b.color);
              enemies.forEach(ne=>{
                if(Math.hypot(ne.x-b.x, ne.y-b.y) < b.blastRadius){
                  applyDamage(ne, b.dmg*0.5, b);
                }
              });
            }
            bullets.splice(i,1);
            break;
          }
        }
      }
    }
  }
}

function applyDamage(e, dmg, b){
  // 确保伤害为正数，绝对不会给敌人加血
  dmg = Math.abs(dmg);
  if(dmg <= 0) dmg = 1;

  // 近距离杀伤
  if(b && b.weapon===3 && getTalentLevel('closeCombat')>0){
    let dist = Math.hypot(player.x-e.x, player.y-e.y);
    if(dist < 150) dmg *= 1.5;
  }

  // 爆头
  if(b && b.headshot && e.isBoss) dmg *= 1.5;

  e.hp -= dmg;

  // 伤害数字
  texts.push({x:e.x+(Math.random()-0.5)*20, y:e.y-20, text:Math.floor(dmg), color:b&&b.crit?'#ffaa00':'#ffffff', life:30, maxLife:30, size:b&&b.crit?16:12, type:'damage'});

  // 受击粒子
  for(let k=0;k<3;k++){
    let a = Math.random()*Math.PI*2;
    particles.push({x:e.x, y:e.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3, life:15, maxLife:15, color:'#ffaaaa', size:2, type:'hit'});
  }
}

function enemyDeath(e){
  // 连击
  combo++; comboTimer = 120;
  let comboMul = Math.min(3 + (getTalentLevel('comboMaster_g')>0 ? getTalentLevel('comboMaster_g') : 0), Math.floor(combo/5)+1);

  // 分数和金币
  let baseScore = e.isBoss ? (e.type==='final'?5000:e.type==='boss'?2000:500) : (e.elite?50:10);
  let baseGold = e.isBoss ? (e.type==='final'?100:e.type==='boss'?40:15) : (e.elite?3:1);
  score += baseScore * comboMul;
  gold += baseGold * player.globalGoldMul;
  kills++;

  // 击杀特效
  let particleCount = e.isBoss ? 100 : (e.elite?30:16);
  let color = e.elite ? '#ffaa00' : e.isBoss ? '#ff2244' : '#ff6666';

  // 冲击波
  for(let r=1;r<=(e.isBoss?15:2);r++){
    particles.push({x:e.x, y:e.y, r:1, maxR:r*(e.isBoss?30:20), life:e.isBoss?60:30, maxLife:e.isBoss?60:30, color:color, type:'shockwave', width:2});
  }

  // 粒子爆发
  for(let i=0;i<particleCount;i++){
    let a = Math.random()*Math.PI*2;
    let s = Math.random()*(e.isBoss?8:5)+1;
    let c = ['#ff4444','#ff8844','#ffaa00','#ffcc00','#ffffff'][Math.floor(Math.random()*5)];
    particles.push({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:e.isBoss?80:40, maxLife:e.isBoss?80:40, color:c, size:Math.random()*(e.isBoss?6:3)+1, type:'burst', gravity:0.05});
  }
  // 白光粒子
  for(let i=0;i<(e.isBoss?20:8);i++){
    let a = Math.random()*Math.PI*2;
    let s = Math.random()*4+1;
    particles.push({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:30, maxLife:30, color:'#ffffff', size:Math.random()*3+1, type:'burst'});
  }

  // 碎片
  for(let i=0;i<(e.isBoss?12:4);i++){
    let a = Math.random()*Math.PI*2;
    let s = Math.random()*4+2;
    particles.push({x:e.x, y:e.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:50, maxLife:50, color:'#667788', size:Math.random()*6+3, type:'debris', angle:a, spin:(Math.random()-0.5)*0.2});
  }

  // 屏幕震动
  screenShake = Math.min(screenShake + (e.isBoss?20:3), 20);
  if(combo > 5) screenShake = Math.min(screenShake + combo*0.5, 25);

  // Boss死亡慢镜
  if(e.isBoss){
    slowMotion = e.type==='final'?180:90;
    // 全屏金光
    particles.push({x:W/2, y:H/2, r:1, maxR:Math.max(W,H), life:120, maxLife:120, color:'#ffcc00', type:'shockwave', width:1});
  }

  // 掉落
  if(Math.random() < 0.15 + player.globalLuckyMul){
    let types = ['hp','shield','gold','weapon'];
    let type = types[Math.floor(Math.random()*types.length)];
    drops.push({x:e.x, y:e.y, type:type, life:600, vy:1, radius:8});
  }

  // 连锁爆炸
  if(e.status && e.status.chain){
    if(Math.random() < e.status.chain){
      createExplosion(e.x, e.y, 80, '#ff6622');
      enemies.forEach(ne=>{
        if(Math.hypot(ne.x-e.x, ne.y-e.y) < 80){
          applyDamage(ne, e.maxHp*0.3, null);
        }
      });
    }
  }

  // 爆裂散射（散射炮天赋）
  if(getTalentLevel('burstShot')>0 && Math.random() < 0.2*getTalentLevel('burstShot')){
    let w = getWeapon(0);
    for(let i=0;i<6;i++){
      let a = Math.PI*2*i/6;
      spawnBullet(w, e.x, e.y, a);
    }
  }
}

function createExplosion(x, y, radius, color){
  particles.push({x:x, y:y, r:1, maxR:radius, life:20, maxLife:20, color:color, type:'shockwave', width:3});
  for(let i=0;i<15;i++){
    let a = Math.random()*Math.PI*2;
    let s = Math.random()*4+1;
    particles.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:30, maxLife:30, color:color, size:Math.random()*4+2, type:'burst'});
  }
}

// ==================== 玩家受击 ====================
function playerHit(dmg){
  if(player.invincible > 0) return;

  // 闪避
  if(Math.random() < player.dodge){
    texts.push({x:player.x, y:player.y-30, text:'闪避!', color:'#4ecdc4', life:30, maxLife:30, size:16, type:'float'});
    return;
  }

  // 护甲减伤
  let armorMul = 1 - (getTalentLevel('armor_g')>0 ? 0.1*getTalentLevel('armor_g') : 0);
  dmg = Math.abs(dmg) * armorMul;
  if(dmg < 1) dmg = 1;

  // 护盾优先
  if(player.shield > 0){
    let absorb = Math.min(player.shield, dmg);
    player.shield -= absorb;
    dmg -= absorb;
    // 护盾吸收特效
    for(let i=0;i<6;i++){
      let a = Math.random()*Math.PI*2;
      particles.push({x:player.x, y:player.y, vx:Math.cos(a)*2, vy:Math.sin(a)*2, life:20, maxLife:20, color:'#44ccff', size:3, type:'burst'});
    }
  }

  if(dmg > 0){
    player.hp -= dmg;
    player.invincible = 30;
    screenShake = 8;
    dangerFlash = 20;

    // 受击粒子
    for(let i=0;i<8;i++){
      let a = Math.random()*Math.PI*2;
      particles.push({x:player.x, y:player.y, vx:Math.cos(a)*4, vy:Math.sin(a)*4, life:20, maxLife:20, color:'#ff4444', size:3, type:'burst'});
    }

    // 红闪
    particles.push({x:0, y:0, w:W, h:H, life:10, maxLife:10, color:'rgba(255,0,0,0.3)', type:'flash'});
  }

  if(player.hp <= 0){
    // 涅槃重生
    if(getTalentLevel('rebirth_g')>0 && !player.hasReborn){
      player.hasReborn = true;
      player.hp = player.maxHp * 0.3;
      player.shield = player.maxShield;
      player.invincible = 120;
      texts.push({x:W/2, y:H/2, text:'涅槃重生!', color:'#ff6b35', life:90, maxLife:90, size:28, type:'warning'});
      slowMotion = 60;
      screenShake = 15;
    } else {
      gameOver();
    }
  }
}

// ==================== 更新逻辑 ====================
function update(){
  if(gameState !== 'playing') return;

  // 慢镜
  let timeScale = slowMotion > 0 ? 0.3 : 1;
  if(slowMotion > 0) slowMotion--;

  // 屏幕震动
  if(screenShake > 0) screenShake *= 0.9;
  if(screenShake < 0.5) screenShake = 0;

  // 危险闪烁
  if(dangerFlash > 0) dangerFlash--;
  if(enemyBullets.length > 50) dangerFlash = Math.max(dangerFlash, 5);

  // 玩家移动
  let moveX = 0, moveY = 0;
  if(isMobile && joystick.active){
    moveX = joystick.dx;
    moveY = joystick.dy;
  } else {
    // 鼠标跟随（平滑）
    let dx = mouse.x - player.x;
    let dy = mouse.y - player.y;
    let dist = Math.hypot(dx, dy);
    if(dist > 5){
      let spd = player.speed * timeScale;
      if(dist < spd){ player.x = mouse.x; player.y = mouse.y; }
      else { player.x += (dx/dist)*spd; player.y += (dy/dist)*spd; }
    }
  }

  // 摇杆移动叠加
  if(moveX !== 0 || moveY !== 0){
    player.x += moveX * player.speed * timeScale * 0.05;
    player.y += moveY * player.speed * timeScale * 0.05;
  }

  // 边界限制
  player.x = Math.max(20, Math.min(W-20, player.x));
  player.y = Math.max(20, Math.min(H-20, player.y));

  // 计算朝向（子弹方向）
  targetAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // 无敌时间
  if(player.invincible > 0) player.invincible--;

  // 技能冷却
  if(player.skillCooldown > 0) player.skillCooldown -= timeScale;
  if(player.skillCooldown < 0) player.skillCooldown = 0;

  // 生命恢复
  if(getTalentLevel('regen_g')>0 && player.hp < player.maxHp){
    player.hp = Math.min(player.maxHp, player.hp + player.maxHp*0.0001*getTalentLevel('regen_g')*timeScale);
  }

  // 射击
  fireWeapon();

  // 旋风斩
  if(player.whirlwind > 0){
    player.whirlwind -= timeScale;
    let b = spawnBullet(getWeapon(7), player.x, player.y, Date.now()*0.1, true);
    b.whirl = true; b.life = 5; b.range = 130; b.arc = Math.PI*2;
  }

  // 更新子弹
  updateBullets();

  // 更新敌人
  updateEnemies();

  // 更新敌人子弹
  for(let i=enemyBullets.length-1;i>=0;i--){
    let eb = enemyBullets[i];
    eb.x += eb.vx * timeScale;
    eb.y += eb.vy * timeScale;

    if(eb.type === 'accel'){
      eb.vx *= 1+eb.accel; eb.vy *= 1+eb.accel;
    }
    if(eb.type === 'homing' && eb.life){
      eb.life--;
      let ha = Math.atan2(player.y-eb.y, player.x-eb.x);
      let ca = Math.atan2(eb.vy, eb.vx);
      let diff = ha - ca;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      ca += diff * 0.03;
      let spd = Math.hypot(eb.vx, eb.vy);
      eb.vx = Math.cos(ca)*spd; eb.vy = Math.sin(ca)*spd;
      if(eb.life <= 0) { enemyBullets.splice(i,1); continue; }
    }
    if(eb.type === 'spiral'){
      let ca = Math.atan2(eb.vy, eb.vx);
      ca += eb.spin || 0.02;
      let spd = Math.hypot(eb.vx, eb.vy);
      eb.vx = Math.cos(ca)*spd; eb.vy = Math.sin(ca)*spd;
    }

    // 碰撞玩家
    let dist = Math.hypot(eb.x-player.x, eb.y-player.y);
    if(dist < 15 + eb.radius){
      playerHit(eb.dmg);
      if(!eb.pierce) enemyBullets.splice(i,1);
      continue;
    }

    // 边界
    if(eb.x < -50 || eb.x > W+50 || eb.y < -50 || eb.y > H+50){
      enemyBullets.splice(i,1);
    }
  }

  // 更新掉落
  for(let i=drops.length-1;i>=0;i--){
    let d = drops[i];
    d.y += d.vy;
    d.life--;

    // 引力场拾取
    let pickRange = 30 + (getTalentLevel('gravity_g')>0 ? 50*getTalentLevel('gravity_g') : 0);
    let dist = Math.hypot(d.x-player.x, d.y-player.y);
    if(dist < pickRange){
      // 拾取
      if(d.type === 'hp'){ player.hp = Math.min(player.maxHp, player.hp+20); }
      else if(d.type === 'shield'){ player.shield = Math.min(player.maxShield+50, player.shield+25); }
      else if(d.type === 'gold'){ gold += 5; }
      else if(d.type === 'weapon'){
        let newWpn = Math.floor(Math.random()*8);
        unlockedWeapons.add(newWpn);
        texts.push({x:player.x, y:player.y-40, text:'解锁: '+WEAPONS[newWpn].name, color:'#f7c531', life:60, maxLife:60, size:14, type:'float'});
      }
      // 拾取特效
      for(let k=0;k<8;k++){
        let a = Math.random()*Math.PI*2;
        particles.push({x:d.x, y:d.y, vx:Math.cos(a)*3, vy:Math.sin(a)*3, life:20, maxLife:20, color:'#f7c531', size:3, type:'burst'});
      }
      drops.splice(i,1);
      continue;
    }

    if(d.life <= 0) drops.splice(i,1);
  }

  // 更新粒子
  for(let i=particles.length-1;i>=0;i--){
    let p = particles[i];
    p.life--;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    if(p.type === 'burst' || p.type === 'hit'){
      p.x += p.vx * timeScale;
      p.y += p.vy * timeScale;
      if(p.gravity) p.vy += p.gravity;
      p.vx *= 0.95; p.vy *= 0.95;
    }
    if(p.type === 'debris'){
      p.x += p.vx * timeScale;
      p.y += p.vy * timeScale;
      p.vy += 0.1;
      p.angle += p.spin || 0;
    }
    if(p.type === 'vortex'){
      // 吸引敌人
      enemies.forEach(e=>{
        let dist = Math.hypot(e.x-p.x, e.y-p.y);
        if(dist < p.r && dist > 10){
          let a = Math.atan2(p.y-e.y, p.x-e.x);
          e.x += Math.cos(a)*p.pull*timeScale;
          e.y += Math.sin(a)*p.pull*timeScale;
        }
      });
    }
  }

  // 更新文字
  for(let i=texts.length-1;i>=0;i--){
    texts[i].life--;
    if(texts[i].life <= 0) texts.splice(i,1);
  }

  // 连击
  if(comboTimer > 0) comboTimer -= timeScale;
  else combo = 0;

  // 波次
  if(!bossActive && enemies.length === 0){
    waveTimer++;
    if(waveTimer > waveDelay){
      waveTimer = 0;
      spawnWave();
      wave++;

      // 天赋选择
      if((wave-1) % 5 === 0 && wave > 1){
        showTalentSelect();
      }
    }
  }
  if(bossActive && enemies.filter(e=>e.isBoss).length === 0){
    bossActive = false;
  }

  // 背景星星
  stars.forEach(s=>{
    s.y += s.speed * timeScale;
    s.alpha += s.twinkle;
    if(s.alpha > 1) s.alpha = 1;
    if(s.alpha < 0.3) s.alpha = 0.3;
    if(s.twinkle > 0 && s.alpha >= 1) s.twinkle = -Math.abs(s.twinkle);
    if(s.twinkle < 0 && s.alpha <= 0.3) s.twinkle = Math.abs(s.twinkle);
    if(s.y > H) s.y = 0;
  });
  nebulas.forEach(n=>{
    n.x += n.dx * timeScale;
    n.y += n.dy * timeScale;
    if(n.x < -n.r) n.x = W+n.r;
    if(n.x > W+n.r) n.x = -n.r;
    if(n.y < -n.r) n.y = H+n.r;
    if(n.y > H+n.r) n.y = -n.r;
  });

  // 随机流星
  if(Math.random() < 0.002){
    particles.push({x:Math.random()*W, y:-10, vx:(Math.random()-0.5)*2, vy:Math.random()*3+2, life:60, maxLife:60, color:'#aabbff', size:2, type:'star', trail:[]});
  }
}

function renderHUD(){

  let hudHTML = '';

  let shieldPct = Math.max(0, player.shield/Math.max(1,player.maxShield)*100);
  let hpColor = hpPct > 50 ? '#ff8844' : hpPct > 25 ? '#ffaa00' : '#ff4444';

  hudHTML += `<div style="position:absolute;top:10px;left:15px;z-index:10;">
    <div class="hud-bar">生命: <span style="color:${hpColor}">${Math.ceil(player.hp)}/${Math.ceil(player.maxHp)}</span></div>

    <div class="hud-bar" style="margin-top:4px;">波次: <span>${wave}</span></div>
    <div class="hud-bar">分数: <span>${Math.floor(score)}</span></div>

    ${combo>1?`<div class="hud-bar" style="color:#ff6b35;font-weight:bold;">连击x${combo}</div>`:''}
  </div>`;

  // 右侧面板
  let skillCdPct = Math.max(0, 1 - player.skillCooldown/player.maxSkillCd)*100;
  let wpn = getWeapon(currentWeapon);
  hudHTML += `<div style="position:absolute;top:10px;right:15px;z-index:10;text-align:right;">
    <div class="hud-bar">武器: <span style="color:${wpn.color}">${wpn.icon} ${wpn.name}</span></div>
    <div class="hud-bar">金币: <span>${Math.floor(gold)}</span></div>
    <div class="hud-bar" style="margin-top:4px;">大招冷却</div>
    <div class="hp-bar-bg" style="width:100px;margin-left:auto;"><div class="hp-bar-fill" style="width:${skillCdPct}%;background:linear-gradient(90deg,#f7c531,#ff6b35);"></div></div>
    <div style="margin-top:6px;font-size:10px;color:#667;">`;

  // 已解锁武器
  let idx = 1;
  WEAPONS.forEach((w,i)=>{
    if(unlockedWeapons.has(i)){
      hudHTML += `<span style="color:${i===currentWeapon?'#f7c531':'#445'};margin:0 2px;">${idx}:${w.icon}</span>`;
      idx++;
    }
  });
  hudHTML += `</div></div>`;

  // 底部提示
  if(waveTimer > 0 && !bossActive){
    hudHTML += `<div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;color:#8899aa;z-index:10;">下一波准备中...</div>`;
  }

  // 危险提示
  if(enemyBullets.length > 50){
    hudHTML += `<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;color:#ff2244;font-weight:bold;z-index:10;animation:pulse 0.5s infinite;">⚠ 弹幕密集 ⚠</div>`;
  }

  document.getElementById('uiLayer').innerHTML = hudHTML;
}

// ==================== 事件处理 ====================
window.addEventListener('mousemove', e=>{
  mouse.x = e.clientX; mouse.y = e.clientY;
});

window.addEventListener('keydown', e=>{
  if(gameState !== 'playing') return;
  if(e.code === 'Space'){ e.preventDefault(); useSkill(); }
  if(e.key >= '1' && e.key <= '8'){
    let idx = parseInt(e.key) - 1;
    let unlocked = Array.from(unlockedWeapons);
    if(idx < unlocked.length){
      currentWeapon = unlocked[idx];
      texts.push({x:player.x, y:player.y-30, text:WEAPONS[currentWeapon].name, color:WEAPONS[currentWeapon].color, life:40, maxLife:40, size:14, type:'float'});
    }
  }
});

// 摇杆
const joyCanvas = document.getElementById('joystickCanvas');
const joyCtx = joyCanvas.getContext('2d');
let joyCenter = {x:60, y:60}, joyPos = {x:60, y:60};

function drawJoystick(){
  joyCtx.clearRect(0,0,120,120);
  joyCtx.strokeStyle = 'rgba(255,255,255,0.3)';
  joyCtx.lineWidth = 2;
  joyCtx.beginPath(); joyCtx.arc(60,60,40,0,Math.PI*2); joyCtx.stroke();
  joyCtx.fillStyle = 'rgba(255,255,255,0.5)';
  joyCtx.beginPath(); joyCtx.arc(joyPos.x, joyPos.y, 20, 0, Math.PI*2); joyCtx.fill();
}
drawJoystick();

joyCanvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  let t = e.touches[0];
  let rect = joyCanvas.getBoundingClientRect();
  joystick.active = true;
  updateJoystick(t.clientX-rect.left, t.clientY-rect.top);
},{passive:false});

joyCanvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  let t = e.touches[0];
  let rect = joyCanvas.getBoundingClientRect();
  updateJoystick(t.clientX-rect.left, t.clientY-rect.top);
},{passive:false});

joyCanvas.addEventListener('touchend', e=>{
  e.preventDefault();
  joystick.active = false;
  joystick.dx = 0; joystick.dy = 0;
  joyPos = {x:60, y:60};
  drawJoystick();
},{passive:false});

function updateJoystick(x, y){
  let dx = x - 60, dy = y - 60;
  let dist = Math.hypot(dx, dy);
  if(dist > 40){ dx = dx/dist*40; dy = dy/dist*40; }
  joyPos = {x:60+dx, y:60+dy};
  joystick.dx = dx/40;
  joystick.dy = dy/40;
  drawJoystick();
}

// 技能按钮
document.getElementById('skillBtn').addEventListener('touchstart', e=>{
  e.preventDefault();
  if(gameState === 'playing') useSkill();
},{passive:false});
document.getElementById('skillBtn').addEventListener('click', e=>{
  if(gameState === 'playing') useSkill();
});

// 窗口调整
window.addEventListener('resize', ()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// ==================== 主循环 ====================
function loop(){
  update();
  render();
  renderHUD();
  requestAnimationFrame(loop);
}

// 启动
loop();
</script>
</body>
</html>
