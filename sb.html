                case 1: // 瞄准散射
                    for (let i = -3; i <= 3; i++) {
                        const aa = a + i * 0.2;
                        addBullet(Math.cos(aa) * spd * 1.2, Math.sin(aa) * spd * 1.2);
                    }
                    break;
                case 2: // 追踪弹
                    for (let i = 0; i < 4; i++) {
                        const aa = a + rand(-0.4, 0.4);
                        addBullet(Math.cos(aa) * spd * 0.7, Math.sin(aa) * spd * 0.7, { homing: true });
                    }
                    break;
            }
        },

        draw: function(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            const pulse = Math.sin(Date.now() * 0.004) * 0.15 + 1;
            const flash = this.flash > 0;

            ctx.fillStyle = flash ? '#fff' : this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 25 * pulse;
            ctx.beginPath();
            ctx.moveTo(0, -this.radius * 1.2);
            ctx.lineTo(-this.radius, 0);
            ctx.lineTo(-this.radius * 0.5, this.radius);
            ctx.lineTo(this.radius * 0.5, this.radius);
            ctx.lineTo(this.radius, 0);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = flash ? '#fff' : '#ffdd00';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.35, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-6, -4, 4, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(6, -4, 4, 0, Math.PI * 2); ctx.fill();

            ctx.restore();

            // 血条
            const barW = Math.min(300, W * 0.5);
            const barX = (W - barW) / 2;
            const barY = 25;
            ctx.fillStyle = '#222';
            ctx.fillRect(barX, barY, barW, 12);
            const hpPct = this.hp / this.maxHp;
            ctx.fillStyle = hpPct > 0.5 ? '#ff8800' : '#ff0044';
            ctx.fillRect(barX, barY, barW * hpPct, 12);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, barW, 12);

            ctx.fillStyle = '#ffaa00';
            ctx.font = 'bold 12px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('小Boss - 狂暴猎手 Lv.' + wave + '  ' + Math.floor(hpPct * 100) + '%', W / 2, barY - 6);
            ctx.textAlign = 'left';
        }
    };
}

// ==================== 大Boss ====================
function createBoss(wave, diff) {
    const isFinal = wave >= 50;
    const hpMul = isFinal ? 25 : (wave >= 30 ? 12 : 5);
    const d = DIFFICULTY[diff];
    const baseHp = 800 * hpMul * d.hpMul * Math.pow(1.06, wave);

    return {
        x: W / 2, y: -100,
        hp: baseHp, maxHp: baseHp,
        speed: 1.8 * d.speedMul,
        dmg: 35 * d.dmgMul,
        score: isFinal ? 20000 : 800 * wave,
        radius: isFinal ? 55 : 40,
        color: isFinal ? '#ff0022' : '#ff0088',
        isBoss: true,
        isFinal: isFinal,
        phase: 1,
        maxPhase: isFinal ? 3 : 2,
        angle: 0,
        flash: 0,
        attackTimer: 0,
        attackPattern: 0,
        enterY: isFinal ? 130 : 100,
        entered: false,

        update: function(dt, player, game) {
            if (!this.entered) {
                this.y += this.speed * dt * 60;
                if (this.y >= this.enterY) this.entered = true;
                return true;
            }

            const hpPct = this.hp / this.maxHp;
            if (this.phase === 1 && hpPct <= 0.5) {
                this.phase = 2;
                this.speed *= 1.4;
                game.addEventText('Boss狂暴！弹幕密度提升！', '#ff0044');
                game.shake = 0.6;
            }
            if (this.phase === 2 && this.maxPhase >= 3 && hpPct <= 0.25) {
                this.phase = 3;
                this.speed *= 1.4;
                game.addEventText('Boss绝望模式！全屏弹幕！', '#ff0000');
                game.shake = 1.0;
            }

            this.x += Math.sin(Date.now() * 0.001 * this.phase) * this.speed * dt * 60;
            this.x = clamp(this.x, this.radius + 20, W - this.radius - 20);

            this.attackTimer += dt;
            const interval = this.phase === 3 ? 0.6 : this.phase === 2 ? 0.9 : 1.4;
            if (this.attackTimer >= interval) {
                this.attackTimer = 0;
                this.attackPattern = (this.attackPattern + 1) % 6;
                this.fire(game, player);
            }

            if (this.flash > 0) this.flash -= dt * 6;
            return this.hp > 0;
        },

        fire: function(game, player) {
            const self = this;
            const a = angle(this, player);
            const spd = (4 + this.phase) * DIFFICULTY[diff].bulletMul;
            const phaseMul = this.phase;

            const addBullet = (vx, vy, opts) => {
                const b = { x: self.x, y: self.y, vx: vx, vy: vy, dmg: self.dmg, radius: 6, color: self.color, trail: [], homing: false, accel: false };
                if (opts) {
                    if (opts.homing) { b.homing = true; b.target = player; b.homingStrength = opts.homingStrength || 0.03; }
                    if (opts.accel) b.accel = true;
                    if (opts.big) { b.radius = 12; b.dmg *= 1.5; }
                    if (opts.fast) { b.vx *= 1.5; b.vy *= 1.5; }
                }
                game.enemyBullets.push(b);
            };

            switch (this.attackPattern) {
                case 0: // 环形弹幕
                    const count = 16 + phaseMul * 8;
                    for (let i = 0; i < count; i++) {
                        const aa = (i / count) * Math.PI * 2 + Date.now() * 0.001;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd);
                    }
                    break;
                case 1: // 瞄准扇形
                    for (let i = -4 - phaseMul; i <= 4 + phaseMul; i++) {
                        const aa = a + i * 0.12;
                        addBullet(Math.cos(aa) * spd * 1.3, Math.sin(aa) * spd * 1.3);
                    }
                    break;
                case 2: // 螺旋弹幕
                    for (let i = 0; i < 2 + phaseMul; i++) {
                        const offset = (Date.now() * 0.003) + (i / (2 + phaseMul)) * Math.PI * 2;
                        for (let j = 0; j < 6; j++) {
                            const aa = offset + (j / 6) * Math.PI * 2;
                            addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd);
                        }
                    }
                    break;
                case 3: // 追踪弹雨
                    for (let i = 0; i < 3 + phaseMul * 2; i++) {
                        const aa = a + rand(-0.6, 0.6);
                        addBullet(Math.cos(aa) * spd * 0.6, Math.sin(aa) * spd * 0.6, { homing: true, homingStrength: 0.035 });
                    }
                    break;
                case 4: // 加速弹幕
                    for (let i = 0; i < 8 + phaseMul * 4; i++) {
                        const aa = (i / (8 + phaseMul * 4)) * Math.PI * 2;
                        addBullet(Math.cos(aa) * spd * 0.5, Math.sin(aa) * spd * 0.5, { accel: true });
                    }
                    break;
                case 5: // 混合攻击 - 大弹幕+小弹幕
                    for (let i = 0; i < 4; i++) {
                        const aa = a + (i - 1.5) * 0.4;
                        addBullet(Math.cos(aa) * spd, Math.sin(aa) * spd, { big: true });
                    }
                    for (let i = 0; i < 12 + phaseMul * 6; i++) {
                        const aa = (i / (12 + phaseMul * 6)) * Math.PI * 2;
                        addBullet(Math.cos(aa) * spd * 0.8, Math.sin(aa) * spd * 0.8);
                    }
                    break;
            }
        },

        draw: function(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            const pulse = Math.sin(Date.now() * 0.003) * 0.12 + 1;
            const flash = this.flash > 0;

            // 主体
            ctx.fillStyle = flash ? '#fff' : this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 35 * pulse;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 核心
            ctx.fillStyle = flash ? '#fff' : '#ffdd00';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * 0.35, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            const eyeOff = this.radius * 0.22;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-eyeOff, -eyeOff * 0.5, this.radius * 0.18, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeOff, -eyeOff * 0.5, this.radius * 0.18, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            const lookX = Math.sin(Date.now() * 0.002) * 3;
            ctx.beginPath(); ctx.arc(-eyeOff + lookX, -eyeOff * 0.5, this.radius * 0.09, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(eyeOff + lookX, -eyeOff * 0.5, this.radius * 0.09, 0, Math.PI * 2); ctx.fill();

            // 旋转尖刺
            ctx.strokeStyle = flash ? '#fff' : this.color;
            ctx.lineWidth = 3;
            const spikeCount = 8 + this.phase * 2;
            for (let i = 0; i < spikeCount; i++) {
                const a = (i / spikeCount) * Math.PI * 2 + Date.now() * 0.001 * (this.phase > 1 ? -1 : 1);
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * this.radius * 0.75, Math.sin(a) * this.radius * 0.75);
                ctx.lineTo(Math.cos(a) * this.radius * 1.4, Math.sin(a) * this.radius * 1.4);
                ctx.stroke();
            }

            // 阶段光环
            if (this.phase >= 2) {
                ctx.strokeStyle = 'rgba(255,0,0,0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.6 + Math.sin(Date.now() * 0.005) * 5, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();

            // Boss血条
            const barW = Math.min(500, W * 0.7);
            const barX = (W - barW) / 2;
            const barY = 35;
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(barX, barY, barW, 18);
            const hpPct = this.hp / this.maxHp;
            const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grad.addColorStop(0, '#ff0022');
            grad.addColorStop(0.5, '#ff6600');
            grad.addColorStop(1, '#ffdd00');
            ctx.fillStyle = grad;
            ctx.fillRect(barX, barY, barW * hpPct, 18);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barW, 18);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Microsoft YaHei';
            ctx.textAlign = 'center';
            const name = this.isFinal ? '★ 宇宙毁灭者 ★' : '虚空领主 Lv.' + wave;
            ctx.fillText(name + ' 阶段' + this.phase + '/' + this.maxPhase + '  ' + Math.floor(hpPct * 100) + '%', W / 2, barY - 8);
            ctx.textAlign = 'left';
        }
    };
}

// ==================== 掉落物 ====================
function createDrop(x, y, typeIdx) {
    const d = DROP_TYPES[typeIdx];
    return {
        x: x, y: y, typeIdx: typeIdx,
        vy: -2, vx: rand(-1, 1),
        life: 10, angle: 0,
        update: function(dt) {
            this.vy += 0.05;
            this.y += this.vy * dt * 60;
            this.x += this.vx * dt * 60;
            this.angle += dt * 2;
            this.life -= dt;
            return this.life > 0 && this.y < H + 30;
        },
        draw: function(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.fillStyle = d.color;
            ctx.shadowColor = d.color;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(0, 0, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(d.icon, 0, 0);
            ctx.restore();
        }
    };
}

// ==================== 粒子 ====================
function createParticle(x, y, color, speed, life, size, type) {
    const a = rand(0, Math.PI * 2);
    const s = rand(speed * 0.3, speed);
    return {
        x: x, y: y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life, maxLife: life,
        color: color, size: size, type: type,
        update: function(dt) {
            this.x += this.vx * dt * 60;
            this.y += this.vy * dt * 60;
            this.life -= dt;
            if (this.type === 'gravity') this.vy += 0.15;
            if (this.type === 'friction') { this.vx *= 0.97; this.vy *= 0.97; }
            return this.life > 0;
        },
        draw: function(ctx) {
            const a = this.life / this.maxLife;
            ctx.globalAlpha = a;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    };
}

// ==================== 事件监听 ====================
document.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        if (game && game.state === 'playing') game.useSkill();
    }
    if (e.code.startsWith('Digit')) {
        const num = parseInt(e.code.replace('Digit', '')) - 1;
        if (game && game.state === 'playing' && num >= 0 && num < 8) {
            const p = game.player;
            for (let i = 0; i < p.weapons.length; i++) {
                if (p.weapons[i] === num && p.weaponUnlocked[num]) {
                    p.curWeapon = i;
                    game.updateWeaponBar();
                    game.addFloatText(p.x, p.y - 30, WEAPONS[num].name, '#00d4ff');
                    break;
                }
            }
        }
    }
});

document.addEventListener('keyup', e => { keys[e.code] = false; });

// 难度选择
document.querySelectorAll('#difficultyGroup .btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#difficultyGroup .btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        if (game) game.difficulty = parseInt(btn.dataset.diff);
    });
});

// 武器选择
const weaponDescs = ['扇形散射，覆盖范围广', '穿透贯穿，直线高伤', '自动锁定，机动战', '贴脸爆发，近距离王者'];
document.querySelectorAll('#weaponGroup .btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('#weaponGroup .btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const idx = parseInt(btn.dataset.wp);
        document.getElementById('weaponDesc').textContent = weaponDescs[idx];
        if (game) game.startWeapon = idx;
    });
});

// 开始按钮
document.getElementById('startBtn').addEventListener('click', () => {
    game = new Game();
    game.difficulty = parseInt(document.querySelector('#difficultyGroup .btn.selected').dataset.diff);
    game.startWeapon = parseInt(document.querySelector('#weaponGroup .btn.selected').dataset.wp);
    game.start();
});

// 重新开始
document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
});

// 手机摇杆
const joystickZone = document.getElementById('joystickZone');
const joystickKnob = document.getElementById('joystickKnob');
let joystickTouchId = null;

joystickZone.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    joystickTouchId = touch.identifier;
    const rect = joystickZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = touch.clientX - cx;
    const dy = touch.clientY - cy;
    const len = Math.hypot(dx, dy);
    const maxR = rect.width / 2 - 20;
    const scale = len > maxR ? maxR / len : 1;
    joystickKnob.style.transform = 'translate(calc(-50% + ' + dx * scale + 'px), calc(-50% + ' + dy * scale + 'px))';
    if (game) {
        game.joystick.active = true;
        game.joystick.dx = (dx * scale / maxR) * 3;
        game.joystick.dy = (dy * scale / maxR) * 3;
    }
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let touch of e.changedTouches) {
        if (touch.identifier !== joystickTouchId) continue;
        const rect = joystickZone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = touch.clientX - cx;
        const dy = touch.clientY - cy;
        const len = Math.hypot(dx, dy);
        const maxR = rect.width / 2 - 20;
        const scale = len > maxR ? maxR / len : 1;
        joystickKnob.style.transform = 'translate(calc(-50% + ' + dx * scale + 'px), calc(-50% + ' + dy * scale + 'px))';
        if (game) {
            game.joystick.dx = (dx * scale / maxR) * 3;
            game.joystick.dy = (dy * scale / maxR) * 3;
        }
    }
}, { passive: false });

joystickZone.addEventListener('touchend', e => {
    for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) {
            joystickTouchId = null;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            if (game) { game.joystick.active = false; game.joystick.dx = 0; game.joystick.dy = 0; }
        }
    }
});

// 手机技能按钮
document.getElementById('skillBtn').addEventListener('touchstart', e => {
    e.preventDefault();
    if (game && game.state === 'playing') game.useSkill();
}, { passive: false });

// 自动射击切换
const autoFireToggle = document.getElementById('autoFireToggle');
autoFireToggle.addEventListener('click', () => {
    if (game) {
        game.autoFire = !game.autoFire;
        autoFireToggle.textContent = '自动射击: ' + (game.autoFire ? '开' : '关');
    }
});

// ==================== 游戏循环 ====================
function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;

    if (game) {
        game.update(dt);
        game.draw();
    } else {
        CTX.fillStyle = '#050510';
        CTX.fillRect(0, 0, W, H);
        const t = timestamp * 0.001;
        for (let i = 0; i < 120; i++) {
            const x = (i * 137.5 + t * 15) % W;
            const y = (i * 73.3 + t * 8) % H;
            const s = (Math.sin(i * 0.7 + t) + 1) * 1.5;
            const a = (Math.sin(i * 0.3 + t * 0.5) + 1) * 0.3 + 0.2;
            CTX.globalAlpha = a;
            CTX.fillStyle = '#fff';
            CTX.beginPath();
            CTX.arc(x, y, s, 0, Math.PI * 2);
            CTX.fill();
        }
        CTX.globalAlpha = 1;
    }

    requestAnimationFrame(loop);
}

lastTime = performance.now();
requestAnimationFrame(loop);

game = new Game();
